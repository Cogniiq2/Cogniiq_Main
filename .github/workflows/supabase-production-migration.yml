name: Supabase Production Migration

# Applies ONE allowlisted migration to the production database, or audits/dry-runs it.
#
# The safety design is unchanged from the original receptionist-only workflow; it has been
# generalised, not relaxed. The target is now chosen from a fixed allowlist instead of being
# hard-wired, and every derived value — path, version, confirmation string — comes from the
# validated selection rather than from separate operator input.
#
# The isolated-workspace architecture is the load-bearing part. The migrations directory is
# emptied and then repopulated ONLY from the real remote migration history (read-only
# `supabase migration fetch --linked`), after which the selected target is restored. The
# resulting invariant is that EXACTLY ONE local-only migration exists and it is the target,
# so `db push` is physically incapable of applying anything else. That is what keeps the
# unrelated club-operations migrations out of production without relying on the CLI to be
# told the right thing, and without ever mutating remote migration history.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git branch or tag containing the migration (e.g. main, or a feature branch)
        required: true
        # `main` is the long-term default because it is the branch a migration normally lives on
        # once it has been reviewed and merged. It is a DEFAULT, not a restriction: the operator
        # can and does enter a feature branch here for a pre-merge run, and the workflow treats
        # both identically — the ref is checked out verbatim and the selected migration must
        # exist in it. None of the safety comes from which ref this is: it comes from the
        # allowlist, the derived confirmation string, the dependency gate, the isolated-workspace
        # invariant, the dry run and the backup gates, all of which run regardless of the ref.
        default: main
      target_migration:
        description: Which allowlisted production migration to act on
        required: true
        type: choice
        options:
          - 20260711120000_receptionist_persistence.sql
          - 20260826120000_owner_historical_paid_invoice.sql
          - 20260828120000_owner_finance_multipay_recurring_bulk.sql
          - 20260829120000_owner_finance_advance_payments.sql
          - 20260830120000_client_service_onboarding.sql
          - 20260830121000_ai_receptionist_template_v1.sql
          - 20260830122000_service_onboarding_audit_fix.sql
        default: 20260826120000_owner_historical_paid_invoice.sql
      mode:
        description: Audit history, run a dry run, or apply the migration
        required: true
        type: choice
        options:
          - audit-history
          - dry-run
          - apply
        default: dry-run
      confirmation:
        description: Required for apply mode. Must equal APPLY_MIGRATION_<version>.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: supabase-production-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Supabase production migration
    runs-on: ubuntu-latest
    env:
      ISOLATED_SOURCE_DIR: isolated-migration-source
      # The UPLOAD directory. Only ever holds the ENCRYPTED archive plus non-sensitive
      # metadata — never a plaintext dump. Never committed.
      BACKUP_DIR: production-backup
      # Plaintext dumps live ONLY under $RUNNER_TEMP, outside $GITHUB_WORKSPACE, so no
      # artifact path, glob or `git add` can reach them even by mistake. They are destroyed
      # before the migration writes.
      PLAINTEXT_BACKUP_SUBDIR: supabase-plaintext-backup
      ROUNDTRIP_SUBDIR: supabase-backup-roundtrip
      BACKUP_KEY_SUBDIR: supabase-backup-key
      ENCRYPTED_ARCHIVE_NAME: supabase-production-backup.tar.gz.gpg
      # Must equal the version pinned on supabase/setup-cli below; the workflow static test
      # asserts they agree, so the manifest can record the CLI that produced the dump.
      SUPABASE_CLI_VERSION: 2.116.0

    steps:
      - name: Checkout workflow tools
        uses: actions/checkout@v4

      - name: Checkout selected migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: migration-source

      # Safety gate: re-validate the selected migration against an explicit allowlist in
      # bash. GitHub renders `choice` as a dropdown, but the workflow_dispatch API accepts
      # any string, so the dropdown is a convenience and NOT a security boundary. Every
      # derived value is produced here from the validated filename — the version is never
      # accepted as separate input and the path is a fixed shape, so traversal is
      # impossible by construction.
      - name: Resolve and validate selected migration
        env:
          SELECTED_MIGRATION: ${{ inputs.target_migration }}
        run: |
          set -euo pipefail

          case "$SELECTED_MIGRATION" in
            20260711120000_receptionist_persistence.sql) ;;
            20260826120000_owner_historical_paid_invoice.sql) ;;
            20260828120000_owner_finance_multipay_recurring_bulk.sql) ;;
            20260829120000_owner_finance_advance_payments.sql) ;;
            20260830120000_client_service_onboarding.sql) ;;
            20260830121000_ai_receptionist_template_v1.sql) ;;
            20260830122000_service_onboarding_audit_fix.sql) ;;
            *)
              echo "Refusing to act on a migration that is not on the production allowlist: $SELECTED_MIGRATION"
              exit 1
              ;;
          esac

          if ! printf '%s' "$SELECTED_MIGRATION" | grep -Eq '^[0-9]{14}_[A-Za-z0-9_.-]+\.sql$'; then
            echo "Selected migration filename is malformed: $SELECTED_MIGRATION"
            exit 1
          fi

          target_version="${SELECTED_MIGRATION%%_*}"
          {
            echo "TARGET_MIGRATION=$SELECTED_MIGRATION"
            echo "TARGET_MIGRATION_PATH=supabase/migrations/$SELECTED_MIGRATION"
            echo "TARGET_MIGRATION_VERSION=$target_version"
            echo "EXPECTED_CONFIRMATION=APPLY_MIGRATION_$target_version"
          } >> "$GITHUB_ENV"

          echo "Selected production migration: $SELECTED_MIGRATION (version $target_version)"

      # Safety gate: this workflow fails before linking if the selected branch does not
      # contain the selected migration file.
      - name: Verify expected migration exists
        run: test -f "migration-source/$TARGET_MIGRATION_PATH"

      # The Node gates below (allowlist agreement, dependency gate, dry-run scope, backup
      # gate, ledger verification) import js-yaml, so dependencies must exist before the
      # first of them runs. This is deliberately the ONLY thing installed and it happens
      # after the cheap bash validation, so a bad target still fails before any install.
      #
      # --ignore-scripts: this workflow can write to the production database. It never
      # builds the application, and none of its gates need a native binary, so package
      # lifecycle scripts have no reason to execute in this context. package-lock.json
      # stays authoritative — `npm ci`, never `npm install`.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies for the verification gates
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Safety gate: the allowlist in this YAML, the bash case above and
      # .github/scripts/lib/supabase-migration-allowlist.mjs must agree exactly.
      - name: Verify workflow allowlist matches the canonical allowlist
        run: node .github/scripts/test-supabase-production-migration-workflow.mjs

      # Safety gate: audit-history intentionally inspects the complete selected source
      # branch. For dry-run/apply the workspace is rebuilt from scratch: the selected target
      # is parked OUTSIDE the migrations directory, the directory is emptied, and it is then
      # repopulated ONLY from the real remote migration history (read-only `migration fetch`).
      #
      # The old invariant — "exactly one SQL file exists in supabase/migrations" — is
      # unsatisfiable against this database. `supabase db push` refuses to run when the
      # remote history contains versions with no local file, and production has remote-only
      # versions (including two whose SQL exists nowhere in this repository). The CLI's own
      # suggestion, `migration repair --status reverted`, would MUTATE production migration
      # history and is forbidden here.
      #
      # The replacement invariant is strictly stronger, because it bounds what `db push`
      # actually acts on rather than bounding the directory and inferring the rest:
      #
      #     EXACTLY ONE local-only migration exists, and it is the selected target.
      #
      # Every other local file corresponds to an already-applied remote version, which push
      # skips by definition and never executes.
      - name: Stage target and empty the isolated migrations directory
        if: ${{ inputs.mode != 'audit-history' }}
        shell: bash
        run: |
          set -euo pipefail

          source_migration="migration-source/$TARGET_MIGRATION_PATH"
          isolated_root="$ISOLATED_SOURCE_DIR"
          isolated_migrations="$isolated_root/supabase/migrations"
          target_staging="$RUNNER_TEMP/$TARGET_MIGRATION"

          test -f "$source_migration"
          source_sha="$(sha256sum "$source_migration" | awk '{print $1}')"

          rm -rf "$isolated_root"
          mkdir -p "$isolated_root"
          tar -C migration-source --exclude=.git -cf - . | tar -C "$isolated_root" -xf -

          # Park the target outside the workspace while the directory is emptied and
          # refilled from remote history, so nothing that happens in between can touch it.
          rm -f "$target_staging"
          cp "$isolated_root/$TARGET_MIGRATION_PATH" "$target_staging"
          staged_sha="$(sha256sum "$target_staging" | awk '{print $1}')"
          if [ "$source_sha" != "$staged_sha" ]; then
            echo "Staged target does not match the source-branch file."
            exit 1
          fi

          # Empty completely. Every migration on the source branch — including the
          # unrelated club-operations pair — is removed here. The directory is repopulated
          # ONLY by `supabase migration fetch --linked`, so a file can reach the push
          # workspace only by already being applied in production.
          rm -rf "$isolated_migrations"
          mkdir -p "$isolated_migrations"

          remaining="$(find "$isolated_migrations" -mindepth 1 | wc -l)"
          if [ "$remaining" -ne 0 ]; then
            echo "Isolated migrations directory is not empty ($remaining entr(y|ies) remain)."
            exit 1
          fi
          if [ -e "$isolated_migrations/$TARGET_MIGRATION" ]; then
            echo "Target must not be present in the migrations directory at this point."
            exit 1
          fi

          {
            echo "TARGET_STAGING_PATH=$target_staging"
            echo "TARGET_SOURCE_SHA=$source_sha"
            echo "TARGET_STAGED_SHA=$staged_sha"
          } >> "$GITHUB_ENV"

          echo "Isolated migrations directory emptied; target staged at $target_staging"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned, not "latest". Resolving "latest" performs a GitHub release lookup at run
          # time, which is both non-reproducible and a dependency on an unauthenticated rate
          # limit — run 33084517446 failed on exactly that, before any Supabase interaction.
          # A workflow that can write to the production database should run a known CLI
          # version, chosen deliberately rather than by whatever shipped that morning.
          version: 2.116.0

      # Safety gate: fail closed if any required secret is missing, without printing
      # secret values.
      #
      # SUPABASE_BACKUP_PASSPHRASE is checked here — BEFORE a single production row is read —
      # rather than at encryption time. This repository is PUBLIC, so a run that dumped
      # production and only then discovered it had no way to encrypt the result would have
      # created exactly the plaintext this design exists to prevent. Refusing early means the
      # data is never extracted in the first place.
      - name: Verify required Supabase secrets are configured
        env:
          MODE: ${{ inputs.mode }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_BACKUP_PASSPHRASE: ${{ secrets.SUPABASE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$SUPABASE_DB_PASSWORD"

          if [ "$MODE" = "apply" ] && [ -z "${SUPABASE_BACKUP_PASSPHRASE:-}" ]; then
            echo "SUPABASE_BACKUP_PASSPHRASE is not configured."
            echo "Apply mode requires it: the production backup must be encrypted before it can"
            echo "be uploaded, because artifacts in this PUBLIC repository are world-readable."
            exit 1
          fi

      # Safety gate: apply mode requires an exact human-entered confirmation string that is
      # specific to the selected migration, so a confirmation typed for one migration can
      # never authorise a different one. Generic strings are impossible by construction —
      # the expected value is always APPLY_MIGRATION_<version>.
      - name: Verify apply confirmation
        if: ${{ inputs.mode == 'apply' }}
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "$EXPECTED_CONFIRMATION" ]; then
            echo "Apply mode requires the exact confirmation string for the selected migration."
            echo "Expected: $EXPECTED_CONFIRMATION"
            exit 1
          fi
          echo "Confirmation accepted for $TARGET_MIGRATION_VERSION."

      - name: Link Supabase project for audit
        if: ${{ inputs.mode == 'audit-history' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        working-directory: migration-source
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Link Supabase project for isolated migration
        if: ${{ inputs.mode != 'audit-history' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        working-directory: isolated-migration-source
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: List migration history for audit
        if: ${{ inputs.mode == 'audit-history' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: migration-source
        run: |
          set -o pipefail
          supabase migration list 2>&1 | tee ../supabase-migration-list.txt

      # Captured BEFORE any push so the post-apply check can prove the unrelated
      # club-operations migrations did not change state during this run.
      - name: List migration history for isolated migration
        if: ${{ inputs.mode != 'audit-history' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: isolated-migration-source
        run: |
          set -o pipefail
          supabase migration list 2>&1 | tee ../supabase-migration-list.txt

      # Safety gate: the remote history must already contain every prerequisite of the
      # selected migration, and must NOT already contain the migration itself. The Finance
      # chain has real schema dependencies, so an out-of-order push would fail part-way
      # through against production instead of being refused here.
      - name: Verify remote migration dependencies
        if: ${{ inputs.mode != 'audit-history' }}
        run: node .github/scripts/verify-supabase-migration-deps.mjs supabase-migration-list.txt "$TARGET_MIGRATION"

      # Repopulate the emptied migrations directory from the REAL remote migration history.
      #
      # `migration fetch` is read-only with respect to the remote database: it reads the
      # linked project's migration history and writes local files from it. It does not
      # execute SQL, does not alter schema_migrations, and does not touch schema. It is the
      # official read-only alternative to `migration repair`, which would mutate production
      # history and is banned in this workflow.
      #
      # The files it creates are versions that are ALREADY applied remotely, so `db push`
      # skips every one of them. They exist purely so the CLI's reconciliation check passes.
      - name: Fetch remote migration history into the isolated workspace
        if: ${{ inputs.mode != 'audit-history' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: isolated-migration-source
        run: supabase migration fetch --linked

      # Safety gate: audit exactly what the fetch created. The set of files produced must
      # equal the set of remote versions captured BEFORE the fetch — no more, no fewer, none
      # malformed. A fetched file with no corresponding remote version would mean the
      # workspace gained a migration from somewhere other than production history, which is
      # the single thing this design exists to prevent.
      - name: Verify fetched history matches the remote history exactly
        if: ${{ inputs.mode != 'audit-history' }}
        run: |
          node .github/scripts/verify-supabase-reconciliation.mjs fetched \
            --remote-before supabase-migration-list.txt \
            --migrations-dir "$ISOLATED_SOURCE_DIR/supabase/migrations" \
            --target-version "$TARGET_MIGRATION_VERSION"

      # Restore ONLY the staged target. Nothing else from the source branch returns to this
      # directory, so the unrelated club-operations migrations cannot reappear.
      - name: Restore the selected target migration
        if: ${{ inputs.mode != 'audit-history' }}
        shell: bash
        run: |
          set -euo pipefail

          isolated_migrations="$ISOLATED_SOURCE_DIR/supabase/migrations"
          restored="$isolated_migrations/$TARGET_MIGRATION"

          if [ -e "$restored" ]; then
            echo "Target already exists in the reconciled workspace, which means it is already applied remotely."
            exit 1
          fi

          cp "$TARGET_STAGING_PATH" "$restored"
          restored_sha="$(sha256sum "$restored" | awk '{print $1}')"
          echo "TARGET_RESTORED_SHA=$restored_sha" >> "$GITHUB_ENV"
          echo "Restored $TARGET_MIGRATION into the reconciled workspace"

      - name: List migration history after reconciliation
        if: ${{ inputs.mode != 'audit-history' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: isolated-migration-source
        run: |
          set -o pipefail
          supabase migration list 2>&1 | tee ../supabase-migration-list-reconciled.txt

      # THE isolation proof. Replaces "exactly one SQL file in the directory" with the
      # stronger, directly relevant claim: exactly ONE local-only migration exists and it is
      # the selected target — plus every remote version now has a local file, the target is
      # genuinely pending (blank Remote), prerequisites are applied, the protected
      # club-operations versions are absent from BOTH sides, and the target file is
      # byte-identical to the source-branch file at all three points it was handled.
      - name: Verify isolated workspace has exactly one pending migration
        if: ${{ inputs.mode != 'audit-history' }}
        run: |
          node .github/scripts/verify-supabase-reconciliation.mjs final \
            --final-list supabase-migration-list-reconciled.txt \
            --migrations-dir "$ISOLATED_SOURCE_DIR/supabase/migrations" \
            --target "$TARGET_MIGRATION" \
            --source-sha "$TARGET_SOURCE_SHA" \
            --staged-sha "$TARGET_STAGED_SHA" \
            --restored-sha "$TARGET_RESTORED_SHA"

      # Safety gate: every run performs the dry run first so reviewers can see the exact
      # migration plan before apply mode reaches the write step.
      - name: Dry run migration push
        if: ${{ inputs.mode != 'audit-history' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: isolated-migration-source
        run: |
          set -o pipefail
          supabase db push --dry-run 2>&1 | tee ../supabase-dry-run.txt

      - name: Stop after dry run
        if: ${{ inputs.mode == 'dry-run' }}
        run: echo "Dry run completed. No migration was applied."

      # Safety gate: apply mode is allowed only when the dry run shows exactly one pending
      # migration, and that migration is the selected one.
      - name: Verify apply migration scope
        if: ${{ inputs.mode == 'apply' }}
        run: node .github/scripts/verify-supabase-dry-run.mjs supabase-dry-run.txt "$TARGET_MIGRATION"

      # ---------------------------------------------------------------------------------
      # RESTORE-POINT EVIDENCE (apply mode only)
      #
      # The original gate accepted exactly one kind of evidence: a managed Supabase backup or
      # PITR window. That gate is correct and is still here — but this project is on the FREE
      # plan, which provides neither, so it can never pass and every apply run stops on it.
      #
      # Upgrading to Pro is not the chosen answer. Supabase's documented answer for Free
      # projects is a logical export taken with `supabase db dump`, so the gate now accepts a
      # second, independently verified kind of evidence: a fresh logical backup created in
      # THIS run, checksummed, and uploaded as an artifact BEFORE anything is written.
      #
      # A LOGICAL DUMP IS NOT PITR. It is a single snapshot with no write-ahead log to replay,
      # so it recovers to the instant the dump ran and no finer. It is accepted because the
      # alternative on a Free project is applying a production migration with no recovery
      # artifact at all. Nothing about the migration-isolation design changes here: the
      # allowlist, the emptied workspace, the read-only history reconciliation, the dry run,
      # the dependency gate and the per-version confirmation all still run first, unchanged.
      #
      # The three evidence-producing steps below are `continue-on-error` on purpose. They must
      # not be able to stop the run by themselves, because the decision belongs to ONE gate —
      # "Verify a restore point exists before writing" — which reads their outcomes and fails
      # closed when neither kind of evidence is usable.
      # ---------------------------------------------------------------------------------

      # Evidence A. READ-ONLY call to the Management API; it never creates or restores a
      # backup. The response is written to a temp file, parsed by a dependency-free script
      # that never sees the token, and deleted immediately afterwards — including on failure.
      # On the Free plan this is expected to report nothing, which is not itself an error.
      - name: Check managed Supabase backup / PITR availability (read-only)
        id: managed_backup
        if: ${{ inputs.mode == 'apply' }}
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          trap 'rm -f supabase-backups.json' EXIT

          http_status="$(curl --silent --show-error \
            --output supabase-backups.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Accept: application/json' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/backups" || echo "000")"

          node .github/scripts/verify-supabase-backups.mjs supabase-backups.json "$http_status"

      # Evidence B, part 1: take the backup. This runs AFTER the project is linked and after
      # every isolation gate and the dry run have passed, and BEFORE the first write — so the
      # snapshot describes production exactly as the migration is about to find it.
      #
      # PLAINTEXT LOCATION IS A SECURITY CONTROL. Every dump is written under $RUNNER_TEMP,
      # which is OUTSIDE $GITHUB_WORKSPACE. This repository is PUBLIC and Actions artifacts are
      # readable by anyone who can read the repository, so a plaintext dump sitting anywhere an
      # artifact path could reach is a data-publication bug waiting to happen. Keeping it out
      # of the workspace entirely means no upload path, glob or `git add` can pick it up —
      # the protection does not depend on anyone writing the right `path:` later.
      #
      # `--linked` is used for every dump and `--db-url` deliberately is NOT: a connection URL
      # would put the database password on the command line, where it would appear in the step
      # log and in the process table. The CLI reads SUPABASE_DB_PASSWORD from the environment
      # instead, so no credential is ever rendered into a log, a filename or a dump.
      - name: Create Free-plan logical production backup
        id: logical_backup
        if: ${{ inputs.mode == 'apply' }}
        continue-on-error: true
        shell: bash
        working-directory: isolated-migration-source
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail

          backup_dir="$RUNNER_TEMP/$PLAINTEXT_BACKUP_SUBDIR"
          status_file="$backup_dir/dump-status.txt"

          rm -rf "$backup_dir"
          mkdir -p "$backup_dir"
          chmod 700 "$backup_dir"
          : > "$status_file"

          echo "BACKUP_CREATED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

          # Record each dump's real exit status. `if` suppresses `set -e` for the command
          # itself so the status can be written, then the failure is re-raised — which means a
          # broken dump aborts the step and the completion sentinel below is never written.
          run_dump() {
            local name="$1"
            shift
            if supabase db dump --linked "$@" -f "$backup_dir/$name"; then
              echo "$name=0" >> "$status_file"
            else
              local rc=$?
              echo "$name=$rc" >> "$status_file"
              return "$rc"
            fi
          }

          # Roles, schema and public data: the three files Supabase documents for a Free-plan
          # logical backup, in the order a restore replays them.
          run_dump roles.sql --role-only
          run_dump schema.sql
          run_dump data.sql --data-only --use-copy --schema public

          # Migration bookkeeping, so a restored database knows which migrations it has.
          run_dump migrations-schema.sql --schema supabase_migrations
          run_dump migrations-data.sql --data-only --use-copy --schema supabase_migrations

          # `supabase db dump` filters Supabase-managed schemas, so the two files above are
          # best-effort. The authoritative pre-migration ledger is the read-only
          # `supabase migration list` output this run already captured; it joins the bundle
          # so the artifact always carries a true record of migration history.
          cp "$GITHUB_WORKSPACE/supabase-migration-list-reconciled.txt" "$backup_dir/migrations-ledger.txt"
          echo "migrations-ledger.txt=0" >> "$status_file"

          # Sentinel: written only if every dump above completed.
          echo "__complete__=0" >> "$status_file"

      # Evidence B, part 2: prove the plaintext bundle is real before it is encrypted. Checks
      # every expected file exists, is non-empty, exceeds a per-file minimum and carries the
      # content it should; checks every dump reported exit status 0 and that the completion
      # sentinel is present; computes the SHA-256 that the round-trip check below will have to
      # reproduce; and writes the manifest.
      #
      # The MANIFEST goes to the upload directory, the plaintext CHECKSUMS stay beside the
      # dumps (and travel inside the encrypted archive). The manifest holds only filenames,
      # sizes, hashes, identifiers and booleans — no rows, no SQL, no credentials.
      #
      # The secrets below are passed so the script can PROVE no credential leaked into a dump.
      # It compares only, never echoes, and the manifest records how many values were scanned
      # — never a value.
      - name: Verify logical backup and write manifest
        id: logical_backup_verify
        if: ${{ inputs.mode == 'apply' }}
        continue-on-error: true
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_DIR"
          node .github/scripts/verify-supabase-logical-backup.mjs \
            --dir "$RUNNER_TEMP/$PLAINTEXT_BACKUP_SUBDIR" \
            --status "$RUNNER_TEMP/$PLAINTEXT_BACKUP_SUBDIR/dump-status.txt" \
            --manifest "$BACKUP_DIR/manifest.json" \
            --checksums "$RUNNER_TEMP/$PLAINTEXT_BACKUP_SUBDIR/SHA256SUMS.txt" \
            --ledger supabase-migration-list-reconciled.txt \
            --target-migration "$TARGET_MIGRATION"

      # Evidence B, part 3: ENCRYPT, then PROVE THE ENCRYPTION IS REVERSIBLE.
      #
      # Artifacts in this PUBLIC repository are readable by anyone who can read the repo, and
      # GitHub's secret masking does nothing for artifact contents — it redacts secret values
      # from logs, not from files. So the bundle is encrypted before it ever reaches the
      # upload directory, and masking is nowhere in the security argument.
      #
      # ENCRYPTION MODE. `gpg --symmetric` alone does NOT give authenticated encryption: it
      # defaults to a Symmetrically Encrypted and Integrity Protected Data packet version 1,
      # which is CFB with an MDC — a SHA-1 checksum inside the ciphertext that detects
      # corruption but is not AEAD. `--force-ocb` switches GnuPG to real authenticated
      # encryption: a v5 symmetric-key ESK packet plus an AEAD Encrypted Data packet (tag 20)
      # using AES-256 in OCB. The verifier walks the produced packets and FAILS unless the
      # data packet really is OCB, so the manifest and the restore notes can never claim a
      # stronger mode than the bytes actually provide.
      #
      # Decrypting an OCB archive needs GnuPG 2.3 or newer; ubuntu-latest ships 2.4.x, and the
      # restore notes state the requirement for whoever recovers this later.
      #
      # `--no-symkey-cache` stops gpg-agent caching the backup passphrase, so the secret does
      # not outlive the two commands that need it.
      #
      # PASSPHRASE HANDLING. The secret is written once to a 0600 file inside a 0700 directory
      # under $RUNNER_TEMP and fed to gpg on a file descriptor. It is never an argv element
      # (/proc/<pid>/cmdline is world-readable), never a filename, never echoed, and never
      # written to the manifest or any artifact. GNUPGHOME is redirected into the same locked
      # directory so gpg leaves nothing in the runner's home. The trap shreds all of it on
      # every exit path, including failure.
      #
      # ROUND TRIP. A backup that cannot be decrypted is not a backup, and the only way to
      # know is to decrypt it. The archive is decrypted with the same secret into a temporary
      # directory and every recovered file is hashed against the SHA-256 recorded BEFORE
      # encryption. The decrypted copies are destroyed as soon as that check has run.
      - name: Encrypt the backup and prove it decrypts
        id: logical_backup_encrypt
        if: ${{ inputs.mode == 'apply' }}
        continue-on-error: true
        shell: bash
        env:
          SUPABASE_BACKUP_PASSPHRASE: ${{ secrets.SUPABASE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_BACKUP_PASSPHRASE:-}" ]; then
            echo "SUPABASE_BACKUP_PASSPHRASE is empty. Refusing to produce an unencrypted production backup."
            exit 1
          fi

          plaintext_dir="$RUNNER_TEMP/$PLAINTEXT_BACKUP_SUBDIR"
          roundtrip_dir="$RUNNER_TEMP/$ROUNDTRIP_SUBDIR"
          key_dir="$RUNNER_TEMP/$BACKUP_KEY_SUBDIR"
          tar_archive="$RUNNER_TEMP/supabase-production-backup.tar.gz"
          encrypted="$GITHUB_WORKSPACE/$BACKUP_DIR/$ENCRYPTED_ARCHIVE_NAME"

          # Every exit path destroys the key material, the decrypted copies and the plaintext
          # tarball — including the paths where gpg or tar fails part-way through.
          cleanup() {
            shred -u "$key_dir/passphrase" 2>/dev/null || true
            rm -rf "$key_dir" "$roundtrip_dir" "$tar_archive"
          }
          trap cleanup EXIT

          (
            umask 077
            mkdir -p "$key_dir/gnupg"
            printf '%s' "$SUPABASE_BACKUP_PASSPHRASE" > "$key_dir/passphrase"
          )
          export GNUPGHOME="$key_dir/gnupg"

          mkdir -p "$GITHUB_WORKSPACE/$BACKUP_DIR"
          tar -czf "$tar_archive" -C "$plaintext_dir" .

          # --passphrase-fd 0 reads the secret from stdin, which is redirected from the locked
          # file. Nothing sensitive appears in argv; the plaintext tarball is the file operand.
          gpg --batch --yes --quiet --no-tty --no-symkey-cache \
            --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --force-ocb --cipher-algo AES256 \
            --digest-algo SHA512 --s2k-digest-algo SHA512 \
            --s2k-mode 3 --s2k-count 65011712 \
            --compress-algo none \
            --output "$encrypted" "$tar_archive" < "$key_dir/passphrase"

          # The plaintext tarball has served its purpose; it does not outlive the encryption.
          rm -f "$tar_archive"

          rm -rf "$roundtrip_dir"
          mkdir -p "$roundtrip_dir"
          chmod 700 "$roundtrip_dir"
          gpg --batch --yes --quiet --no-tty --no-symkey-cache \
            --pinentry-mode loopback --passphrase-fd 0 \
            --decrypt --output "$roundtrip_dir/roundtrip.tar.gz" \
            "$encrypted" < "$key_dir/passphrase"
          tar -xzf "$roundtrip_dir/roundtrip.tar.gz" -C "$roundtrip_dir"
          rm -f "$roundtrip_dir/roundtrip.tar.gz"

          # The secret is no longer needed; destroy it before the verification runs, so the
          # verifier provably cannot see it.
          shred -u "$key_dir/passphrase" 2>/dev/null || true
          rm -rf "$key_dir"

          # Proves: the archive really is an OpenPGP message, it contains no readable dump
          # content, every decrypted file matches its pre-encryption hash, and the upload
          # directory holds nothing but the four permitted files. Also writes SHA256SUMS.txt
          # for the ENCRYPTED archive and the restore notes.
          node .github/scripts/verify-supabase-backup-encryption.mjs \
            --manifest "$GITHUB_WORKSPACE/$BACKUP_DIR/manifest.json" \
            --archive "$encrypted" \
            --decrypted "$roundtrip_dir" \
            --artifact-dir "$GITHUB_WORKSPACE/$BACKUP_DIR"

          # Decrypted verification copies do not outlive the check that needed them.
          rm -rf "$roundtrip_dir"

      # Evidence B, part 4: the backup must be RETRIEVABLE, not merely present on a runner
      # that is about to be destroyed. Upload happens before the push, so a failed migration
      # can never leave the run without its restore artifact.
      #
      # ONLY $BACKUP_DIR is uploaded, and by this point it provably contains only the
      # encrypted archive, the non-sensitive manifest, the encrypted archive's checksum and
      # the restore notes. The plaintext dumps are under $RUNNER_TEMP and are unreachable from
      # this path. Retention is 14 days: long enough to be a usable rollback window for this
      # migration, short enough that an encrypted copy of production does not linger.
      - name: Upload encrypted production backup artifact
        id: logical_backup_artifact
        if: ${{ inputs.mode == 'apply' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: supabase-production-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: production-backup
          retention-days: 14
          if-no-files-found: error

      # Destroy every plaintext production dump BEFORE the migration is allowed to write, and
      # prove it. This is not the safety net — the `always()` step at the end of the job is.
      # This one is unconditional and ungated so that a failure to remove production data stops
      # the run instead of being tidied up quietly afterwards.
      - name: Remove all plaintext production dumps
        id: plaintext_cleanup
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/$PLAINTEXT_BACKUP_SUBDIR" \
                 "$RUNNER_TEMP/$ROUNDTRIP_SUBDIR" \
                 "$RUNNER_TEMP/$BACKUP_KEY_SUBDIR" \
                 "$RUNNER_TEMP/supabase-production-backup.tar.gz"

          for path in "$RUNNER_TEMP/$PLAINTEXT_BACKUP_SUBDIR" "$RUNNER_TEMP/$ROUNDTRIP_SUBDIR" "$RUNNER_TEMP/$BACKUP_KEY_SUBDIR"; do
            if [ -e "$path" ]; then
              echo "Plaintext production data still present after cleanup."
              exit 1
            fi
          done

          # The upload directory must never have held a dump. Checked again here, after the
          # upload, because this is the last moment before the database is written.
          leaked="$(find "$GITHUB_WORKSPACE/$BACKUP_DIR" -maxdepth 1 -type f \
            \( -name '*.sql' -o -name 'migrations-ledger.txt' -o -name 'dump-status.txt' \) | wc -l)"
          if [ "$leaked" -ne 0 ]; then
            echo "Plaintext dump files found in the artifact directory."
            exit 1
          fi

          echo "All plaintext production dumps removed."

      # THE gate. Every leg is required: dump, verification, encryption, round-trip
      # decryption, artifact upload, plaintext removal, and a manifest that belongs to this
      # run and proves the archive is encrypted and dump-free. A managed backup is reported as
      # additional evidence but can no longer authorise a write on its own — accepting it
      # would let a run skip the encryption path, which is the one thing that keeps customer
      # data out of a public artifact.
      - name: Verify a restore point exists before writing
        if: ${{ inputs.mode == 'apply' }}
        run: |
          node .github/scripts/verify-supabase-restore-point.mjs \
            --managed "${{ steps.managed_backup.outcome }}" \
            --logical-dump "${{ steps.logical_backup.outcome }}" \
            --logical-verify "${{ steps.logical_backup_verify.outcome }}" \
            --encryption "${{ steps.logical_backup_encrypt.outcome }}" \
            --artifact "${{ steps.logical_backup_artifact.outcome }}" \
            --plaintext-cleanup "${{ steps.plaintext_cleanup.outcome }}" \
            --manifest "$BACKUP_DIR/manifest.json" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}"

      - name: Apply migration push
        if: ${{ inputs.mode == 'apply' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: isolated-migration-source
        run: supabase db push

      # Post-apply: the remote ledger must report the EXACT selected version in both the
      # Local and Remote columns. A server-generated substitute timestamp shows up here as a
      # mismatch and fails the run. Prerequisites must still be present, and the protected
      # club-operations versions are compared against the pre-push snapshot to prove this
      # run did not apply them.
      - name: Verify applied migration history
        if: ${{ inputs.mode == 'apply' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          (cd isolated-migration-source && supabase migration list 2>&1) | tee supabase-migration-list-after-apply.txt
          node .github/scripts/verify-supabase-ledger.mjs \
            supabase-migration-list-after-apply.txt \
            "$TARGET_MIGRATION" \
            supabase-migration-list.txt

      # Report-only. Advisor findings are printed for a human to read; nothing here repairs,
      # mutates or reconfigures anything in response to them.
      - name: Report Supabase security advisors (read-only)
        if: ${{ inputs.mode == 'apply' }}
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -o pipefail
          trap 'rm -f supabase-advisors.json' EXIT

          http_status="$(curl --silent --show-error \
            --output supabase-advisors.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Accept: application/json' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/advisors/security" || echo "000")"

          if [ "$http_status" != "200" ]; then
            echo "Security advisor check returned HTTP $http_status (reporting only, not a gate)."
            exit 0
          fi

          node -e '
            const body = require("node:fs").readFileSync("supabase-advisors.json", "utf8");
            let parsed;
            try { parsed = JSON.parse(body); } catch { console.log("Advisor response was not valid JSON."); process.exit(0); }
            const list = Array.isArray(parsed?.lints) ? parsed.lints : [];
            console.log(`Security advisor findings: ${list.length}`);
            for (const lint of list.slice(0, 50)) {
              console.log(`  [${lint.level ?? "?"}] ${lint.name ?? "?"} — ${lint.title ?? lint.description ?? ""}`);
            }
          '

      # SAFETY NET. The unconditional cleanup before the gate is the one that matters for the
      # write ordering; this one exists for every path that never reaches it — a dump that
      # failed half-way, an encryption error, a cancelled run. `always()` means plaintext
      # production data is destroyed even when the run is failing, which is exactly when it is
      # most likely to have been left behind. Key material and decrypted copies go with it.
      - name: Remove plaintext production data (safety net)
        if: always()
        shell: bash
        run: |
          shred -u "$RUNNER_TEMP/$BACKUP_KEY_SUBDIR/passphrase" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/$PLAINTEXT_BACKUP_SUBDIR" \
                 "$RUNNER_TEMP/$ROUNDTRIP_SUBDIR" \
                 "$RUNNER_TEMP/$BACKUP_KEY_SUBDIR" \
                 "$RUNNER_TEMP/supabase-production-backup.tar.gz"

      # Read-only audit path: dump only public schema DDL so operators can compare remote
      # history with existing objects.
      - name: Dump remote public schema for audit
        if: ${{ inputs.mode == 'audit-history' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: migration-source
        run: supabase db dump --linked --schema public --file ../remote-public-schema.sql

      - name: Audit prior migration history
        if: ${{ inputs.mode == 'audit-history' }}
        run: node .github/scripts/audit-supabase-history.mjs migration-source

      - name: Remove raw schema dump
        if: ${{ inputs.mode == 'audit-history' && always() }}
        run: rm -f remote-public-schema.sql

      - name: Upload audit artifacts
        if: ${{ inputs.mode == 'audit-history' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-history-audit
          path: |
            supabase-history-audit.txt
            supabase-migration-list.txt
          retention-days: 7
