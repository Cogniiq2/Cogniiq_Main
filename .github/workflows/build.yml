name: Build Verification

on:
  pull_request:
  push:
    branches:
      - main
      - 'correction/**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-public-anon-key-placeholder
      VITE_OURA_CLIENT_ID: ci-public-oura-client-id-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static receptionist migration convergence checks
        run: node .github/scripts/test-receptionist-migration-convergence.mjs

      - name: Invitation status helper unit tests
        run: node .github/scripts/test-invitation-status.mjs

      - name: Owner finance tax engine unit tests
        run: node .github/scripts/test-owner-finance-tax.mjs

      - name: Auth routing / redirect unit tests
        run: node .github/scripts/test-auth-routing.mjs

      - name: Owner offer signed-state derivation tests
        run: node .github/scripts/test-offer-signature-state.mjs

      - name: Automated offer-email send-workflow tests
        run: node .github/scripts/test-automated-offer-email.mjs

      - name: SEO + consent consistency checks
        run: node .github/scripts/test-seo-consistency.mjs

      - name: Customer dashboard UX foundation tests
        run: node .github/scripts/test-customer-dashboard-ux.mjs

      - name: Authentication boot timeout tests
        run: node .github/scripts/test-auth-boot-timeout.mjs

      - name: Customer error-surface and stale-query tests
        run: node .github/scripts/test-customer-error-surface.mjs

      - name: Customer document download handler tests
        run: node .github/scripts/test-customer-document-download-handler.mjs

      - name: Customer document upload handler tests
        run: node .github/scripts/test-customer-document-upload-handler.mjs

      - name: Owner customer-portal integration tests (upload UI + Kundenportal tab)
        run: node .github/scripts/test-owner-customer-portal-integration.mjs

      - name: Commercial publishing UI + duplicate-prevention integration tests
        run: node .github/scripts/test-commercial-publishing-ui.mjs

      # Behavioural component/hook tests (vitest + jsdom). The .mjs scripts above are STRUCTURAL
      # source assertions; these actually render the guards and the access context, so a guard that
      # failed open at runtime while still looking correct in source is caught here.
      - name: Frontend unit tests (vitest)
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  phase0-sql-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi

      - name: Run Phase 0 migration smoke test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bash supabase/tests/run_phase0_migration_smoke.sh

      - name: Run receptionist persistence migration smoke test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bash supabase/tests/run_receptionist_persistence_smoke.sh

      - name: Run receptionist convergence migration smoke test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bash supabase/tests/run_receptionist_convergence_smoke.sh

      - name: Run client platform migration smoke test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bash supabase/tests/run_client_platform_smoke.sh

      - name: Run receptionist entitlement smoke test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bash supabase/tests/run_receptionist_entitlement_smoke.sh

      - name: Run owner finance smoke test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bash supabase/tests/run_owner_finance_smoke.sh

  capability-authorization-sql-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi

      # Applies the real migration chain plus the reusable capability authorization migration to a
      # clean database and asserts the authorization boundary: anon isolation, cross-organization
      # denial, own-context-only reads, platform-admin management, ordinary-member refusal,
      # cross-organization assignment blocked BOTH through the RPC and with RLS bypassed,
      # invitation role transfer exactly once, claim idempotency, capability unions, suspended
      # memberships, immediate revocation, inactive-solution suppression, the role-free invitation
      # flow, existing-customer compatibility, and direct-table bypass attempts.
      - name: Capability authorization SQL security tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bash supabase/tests/run_capability_authorization_smoke.sh

  customer-platform-sql-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PostgreSQL server binaries
        run: |
          if [ -z "$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null)" ]; then
            sudo apt-get update
            sudo apt-get install --yes postgresql
          fi

      # Boots a throwaway local cluster, applies the real migration chain plus the new
      # customer-platform migrations, and asserts the customer authorization boundary
      # (cross-organization denial, suspended members, invisible documents, invoice
      # isolation, internal-field non-exposure, signed-URL authorization).
      - name: Customer platform SQL authorization tests
        run: bash .github/scripts/run-customer-platform-sql-tests.sh

      # Proves the duplicate-organization defect was real (it is reproduced against the
      # PRE-FIX schema first), that the identity fix stops it, and that two genuinely
      # concurrent provisioning sessions converge on ONE organization.
      - name: Provisioning identity + concurrency SQL tests
        run: bash .github/scripts/run-provisioning-identity-sql-tests.sh

      # Proves the staging preflight actually catches drift: it must pass against
      # a correctly migrated database AND fail, with the right check, against each
      # of thirteen deliberately broken states.
      - name: Staging preflight self-test
        run: bash .github/scripts/run-staging-preflight-selftest.sh

      # Proves every seeder interlock refuses (including the CI interlock, which is
      # exercised here precisely because this IS CI) and that the fixtures produce
      # the tenancy they promise and are removed completely.
      - name: Staging seed guard + fixture self-test
        run: bash .github/scripts/run-staging-seed-selftest.sh

  case-d-legacy-convergence-sql-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PostgreSQL server binaries
        run: |
          if [ -z "$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null)" ]; then
            sudo apt-get update
            sudo apt-get install --yes postgresql
          fi

      # Proves 20260731122000_case_d_legacy_convergence.sql safely reconciles the
      # five legacy migrations (tasks / execution_* / oura_*) against hosted
      # Supabase's actual verified state, on a fresh migration chain AND on
      # hosted's exact reproduced partial topology, including proving the real
      # pre-convergence anon exposure, data preservation, and idempotent replay.
      - name: Case D legacy convergence SQL tests
        run: bash .github/scripts/run-case-d-legacy-convergence-sql-tests.sh
