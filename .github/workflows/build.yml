name: Build Verification

on:
  pull_request:
  push:
    branches:
      - main
      - 'correction/**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-public-anon-key-placeholder
      VITE_OURA_CLIENT_ID: ci-public-oura-client-id-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .node-version is the single source of truth for the build Node version,
      # shared with Cloudflare Pages and Netlify. scripts/prerender.mjs uses
      # module.registerHooks, which requires Node >= 22.15.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static receptionist migration convergence checks
        run: node .github/scripts/test-receptionist-migration-convergence.mjs

      # The production migration workflow can write to the live database, so its allowlist,
      # isolation proof and gate wiring are asserted on every build rather than at review
      # time. The three script suites below cover the parsers those gates depend on.
      - name: Supabase production migration workflow static checks
        run: node .github/scripts/test-supabase-production-migration-workflow.mjs

      - name: Supabase dry-run scope verifier tests
        run: node .github/scripts/test-verify-supabase-dry-run.mjs

      - name: Supabase managed backup / PITR gate tests
        run: node .github/scripts/test-verify-supabase-backups.mjs

      # The Free-plan recovery path: the logical `supabase db dump` bundle and the combined
      # gate that decides whether a managed backup OR that bundle authorises a production
      # write. Both must fail closed, so both are exercised on every build.
      - name: Supabase Free-plan logical backup gate tests
        run: node .github/scripts/test-verify-supabase-logical-backup.mjs

      # This repository is public, so the gate that keeps plaintext production dumps out of
      # uploaded artifacts is security-critical and is exercised on every build.
      - name: Supabase backup encryption / round-trip gate tests
        run: node .github/scripts/test-verify-supabase-backup-encryption.mjs

      - name: Supabase restore-point gate tests
        run: node .github/scripts/test-verify-supabase-restore-point.mjs

      - name: Supabase migration ledger + dependency gate tests
        run: node .github/scripts/test-supabase-migration-ledger.mjs

      - name: Supabase isolated-workspace reconciliation tests
        run: node .github/scripts/test-supabase-migration-reconcile.mjs

      - name: Invitation status helper unit tests
        run: node .github/scripts/test-invitation-status.mjs

      - name: Owner finance tax engine unit tests
        run: node .github/scripts/test-owner-finance-tax.mjs

      - name: Auth routing / redirect unit tests
        run: node .github/scripts/test-auth-routing.mjs

      - name: Owner offer signed-state derivation tests
        run: node .github/scripts/test-offer-signature-state.mjs

      - name: Automated offer-email send-workflow tests
        run: node .github/scripts/test-automated-offer-email.mjs

      - name: SEO + consent consistency checks
        run: node .github/scripts/test-seo-consistency.mjs

      - name: Customer dashboard UX foundation tests
        run: node .github/scripts/test-customer-dashboard-ux.mjs

      - name: Authentication boot timeout tests
        run: node .github/scripts/test-auth-boot-timeout.mjs

      - name: Customer error-surface and stale-query tests
        run: node .github/scripts/test-customer-error-surface.mjs

      - name: Customer document download handler tests
        run: node .github/scripts/test-customer-document-download-handler.mjs

      - name: Customer document upload handler tests
        run: node .github/scripts/test-customer-document-upload-handler.mjs

      - name: Owner customer-portal integration tests (upload UI + Kundenportal tab)
        run: node .github/scripts/test-owner-customer-portal-integration.mjs

      - name: Commercial publishing UI + duplicate-prevention integration tests
        run: node .github/scripts/test-commercial-publishing-ui.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Builds the client, prerenders every public route and regenerates
      # public/sitemap.xml from src/lib/routing/publicRoutes.ts.
      - name: Build (client + SSR + prerender)
        run: npm run build

      # The build regenerates the committed sitemap. If it differs from what is
      # checked in, the manifest and the sitemap have drifted apart — or some
      # other tracked file was modified as a build side effect.
      - name: No tracked file was modified by the build
        run: |
          if ! git diff --quiet; then
            echo "::error::The build modified tracked files. Regenerate and commit them:"
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi
          echo "Working tree clean after build."

      - name: Prerender output verification
        run: node .github/scripts/test-prerender-output.mjs

      # Loads the built site in a real headless Chromium and fails on React
      # hydration errors or wrong post-hydration metadata. jsdom cannot catch
      # these: there every lazy chunk is already resolved, so the Suspense
      # boundary is never dehydrated and the real failure never occurs.
      # STATIC_SERVER_ASSET_DELAY_MS reproduces the network ordering a CDN
      # actually produces; without it the race can pass locally and fail in
      # production, which is exactly what happened before.
      # Skips (exit 0) when no Chrome/Chromium is installed — no browser is
      # ever downloaded, here or during a Netlify build.
      - name: Real-browser hydration verification
        env:
          STATIC_SERVER_ASSET_DELAY_MS: '600'
        run: node .github/scripts/test-browser-hydration.mjs

      # HTML must always revalidate so a deploy's new chunk hashes are picked up;
      # hashed assets under /assets/ must NOT, or every navigation re-downloads them.
      - name: Deployment cache-header safety
        run: node .github/scripts/test-deploy-cache-headers.mjs

      # The routing contract against the REAL Cloudflare Pages runtime, which is
      # what actually serves cogniiq.de. `wrangler pages dev dist` executes
      # public/_redirects, public/_headers and functions/_middleware.ts exactly
      # as the edge does. This exists because a fix validated only against a
      # hand-written model shipped a preview in which every private deep link
      # was still blank: Pages canonicalised the "/app-shell.html" rewrite
      # target to a bodyless 307 and the middleware re-emitted it at HTTP 200,
      # so the browser fetched no JS at all.
      - name: Cloudflare Pages routing contract (wrangler pages dev)
        run: node .github/scripts/test-pages-routing.mjs

      # Poppler gives pdftotext/pdftoppm, which the offer-PDF test uses to measure word
      # geometry (overlap, clipping, footer collisions) and to rasterise each page. Without
      # it the PDF tests still run, but silently skip exactly the checks that matter.
      - name: Install poppler-utils (PDF text + raster tooling)
        run: sudo apt-get update -qq && sudo apt-get install --yes poppler-utils

      # The PDF the customer downloads from /d/:token. It used to be produced by the GENERIC
      # transactional renderer, whose keyvalue painter draws each value as one unwrapped
      # right-aligned line and steps Y by a fixed amount — so the payment terms, delivery
      # terms, assumptions and exclusions ran off both page edges and were painted over the
      # labels beneath them, on a single crammed page, with "→" rendered as "?".
      - name: Public offer PDF (premium engine, layout geometry)
        run: node .github/scripts/test-public-offer-pdf.mjs

      # The same download driven through the real browser build: the browser @react-pdf
      # entry point and font registration are not reachable from the Node test.
      - name: Public offer PDF download (real browser)
        run: node .github/scripts/test-public-offer-pdf-browser.mjs

      # A single project module can carry more deliverables and prose than one A4 page
      # holds. The module card used to be wrap={false}, so react-pdf could not break it
      # ("Node of type VIEW can't wrap between pages and it's bigger than available page
      # height") and painted the whole module at one origin — thousands of overlapping
      # lines and an entire deliverables list that no longer existed in the text layer.
      - name: Long project modules paginate (premium PDF)
        run: node .github/scripts/test-long-module-pagination.mjs

      # The customer offer portal (/d/:token) opened from an email must never be a blank
      # white page. Runs against the built artifact in a real browser: a failed lazy chunk
      # once reload-looped forever and painted nothing, which no component test can catch.
      - name: Public document portal verification (real browser)
        run: node .github/scripts/test-public-document-portal.mjs

      # The public marketing site must render light for every visitor. The theme
      # key is shared with the application, so a customer who chose dark inside
      # /app — or, previously, anyone whose OS simply preferred dark — used to get
      # a near-black canvas on every public page. This loads every route in the
      # manifest and fails if any public canvas or the navigation resolves dark,
      # including with a generic cogniiq-theme of `dark` or the legacy `system`.
      # It also asserts the application KEEPS its own dark preference, so a future
      # over-reaching fix cannot silently flatten the private surfaces.
      - name: Public light theme verification
        run: node .github/scripts/test-public-theme.mjs

      # Runs after the build so the hydration tests can check the real dist/ output.
      - name: Unit and component tests
        run: npm test

      # The Netlify deployment gets one forced canonical rewrite per public
      # route; every other build (Cloudflare, local) must stay portable. Both
      # contracts are asserted against a real artifact rather than by modelling
      # either host's request handling.
      - name: Build in Netlify provider mode
        env:
          NETLIFY: 'true'
        run: npm run build

      - name: Prerender output verification (Netlify mode)
        run: node .github/scripts/test-prerender-output.mjs

      - name: Real-browser hydration verification (Netlify mode)
        env:
          STATIC_SERVER_ASSET_DELAY_MS: '600'
        run: node .github/scripts/test-browser-hydration.mjs

      - name: Public light theme verification (Netlify mode)
        run: node .github/scripts/test-public-theme.mjs

  phase0-sql-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi

      - name: Run Phase 0 migration smoke test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bash supabase/tests/run_phase0_migration_smoke.sh

      - name: Run receptionist persistence migration smoke test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bash supabase/tests/run_receptionist_persistence_smoke.sh

      - name: Run receptionist convergence migration smoke test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bash supabase/tests/run_receptionist_convergence_smoke.sh

      - name: Run client platform migration smoke test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bash supabase/tests/run_client_platform_smoke.sh

      - name: Run receptionist entitlement smoke test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bash supabase/tests/run_receptionist_entitlement_smoke.sh

      - name: Run owner finance smoke test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bash supabase/tests/run_owner_finance_smoke.sh

  customer-platform-sql-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PostgreSQL server binaries
        run: |
          if [ -z "$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null)" ]; then
            sudo apt-get update
            sudo apt-get install --yes postgresql
          fi

      # Boots a throwaway local cluster, applies the real migration chain plus the new
      # customer-platform migrations, and asserts the customer authorization boundary
      # (cross-organization denial, suspended members, invisible documents, invoice
      # isolation, internal-field non-exposure, signed-URL authorization).
      - name: Customer platform SQL authorization tests
        run: bash .github/scripts/run-customer-platform-sql-tests.sh

      # Proves the duplicate-organization defect was real (it is reproduced against the
      # PRE-FIX schema first), that the identity fix stops it, and that two genuinely
      # concurrent provisioning sessions converge on ONE organization.
      - name: Provisioning identity + concurrency SQL tests
        run: bash .github/scripts/run-provisioning-identity-sql-tests.sh

      # Proves the staging preflight actually catches drift: it must pass against
      # a correctly migrated database AND fail, with the right check, against each
      # of thirteen deliberately broken states.
      - name: Staging preflight self-test
        run: bash .github/scripts/run-staging-preflight-selftest.sh

      # Proves every seeder interlock refuses (including the CI interlock, which is
      # exercised here precisely because this IS CI) and that the fixtures produce
      # the tenancy they promise and are removed completely.
      - name: Staging seed guard + fixture self-test
        run: bash .github/scripts/run-staging-seed-selftest.sh

  case-d-legacy-convergence-sql-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PostgreSQL server binaries
        run: |
          if [ -z "$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null)" ]; then
            sudo apt-get update
            sudo apt-get install --yes postgresql
          fi

      # Proves 20260731122000_case_d_legacy_convergence.sql safely reconciles the
      # five legacy migrations (tasks / execution_* / oura_*) against hosted
      # Supabase's actual verified state, on a fresh migration chain AND on
      # hosted's exact reproduced partial topology, including proving the real
      # pre-convergence anon exposure, data preservation, and idempotent replay.
      - name: Case D legacy convergence SQL tests
        run: bash .github/scripts/run-case-d-legacy-convergence-sql-tests.sh

  client-service-onboarding-sql-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PostgreSQL server binaries
        run: |
          if [ -z "$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null)" ]; then
            sudo apt-get update
            sudo apt-get install --yes postgresql
          fi

      # Applies 20260830120000 + 20260830121000 in order against a throwaway cluster and
      # asserts what only a database can prove: that the seed migration REFUSES to run
      # before its schema, that a service can be added exactly once, that an engagement
      # snapshots its template version and is never mutated by re-seeding that template,
      # that BLOCKED needs a reason and WAITING_FOR_CLIENT needs its request, that a
      # partial automation cannot be stored without its documented limitation, that the
      # go-live gate genuinely refuses the production statuses, and that anon, a
      # non-owner, and a plain authenticated role reach none of it.
      - name: Client service onboarding SQL tests
        run: bash .github/scripts/run-client-service-onboarding-sql-tests.sh

  invoice-integrity-sql-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PostgreSQL server binaries
        run: |
          if [ -z "$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null)" ]; then
            sudo apt-get update
            sudo apt-get install --yes postgresql
          fi

      # Applies the whole owner-finance chain plus 20260831120000 against a throwaway cluster
      # and asserts what only a database can prove, as an unprivileged `authenticated` role:
      # that no column of an issued invoice is client-writable (and that the guard still
      # refuses even if the grant were restored), that a client cannot INSERT an already-issued
      # invoice, that Storno, payment reconciliation, issuance and the immutable snapshot are
      # all untouched, and that the manual and the automated offer->invoice conversions now
      # produce the identical invoice and cannot duplicate it.
      - name: Invoice integrity SQL tests
        run: bash .github/scripts/run-invoice-integrity-sql-tests.sh

  invoice-preflight-sql-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PostgreSQL server binaries
        run: |
          if [ -z "$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null)" ]; then
            sudo apt-get update
            sudo apt-get install --yes postgresql
          fi

      # owner_invoice_preflight built its missing[] array with `missing || 'literal'`, which
      # Postgres resolves as array||array and which therefore died with "malformed array
      # literal" on the FIRST missing field — so the gate raised in exactly the case it exists
      # to report, and owner_process_offer_acceptance propagated that out of the whole
      # acceptance transaction. This applies 20260901120000 against a throwaway cluster and
      # asserts what only a database can: that each of the seven checks is individually
      # reachable, that many and all-seven report deterministically in check order, that the
      # result shape callers read is unchanged, and that the acceptance pipeline now completes
      # and reports the missing fields instead of aborting.
      - name: Invoice preflight SQL tests
        run: bash .github/scripts/run-invoice-preflight-sql-tests.sh

  receptionist-leads-rls-sql-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PostgreSQL server binaries
        run: |
          if [ -z "$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null)" ]; then
            sudo apt-get update
            sudo apt-get install --yes postgresql
          fi

      # public.cogniiq_receptionist_leads shipped with no RLS and Supabase's default
      # public-schema grants, so anon held full SELECT/INSERT/UPDATE/DELETE/TRUNCATE over
      # 50 rows of third-party contact PII. This applies 20260902120000 against a throwaway
      # cluster and asserts what only a database can: that the exposure was real (it is
      # exercised as anon BEFORE the migration, TRUNCATE included), that afterwards anon
      # holds no privilege at all, that an ordinary authenticated non-owner reads zero rows
      # and is refused every write, that the platform owner keeps the full internal surface,
      # that service-role ingestion is untouched, that the identity sequence is no longer
      # anon-writable, that the pre-existing rows are unchanged, and that a replay is a
      # no-op. TRUNCATE and the sequence are checked explicitly because RLS does not cover
      # either: a policy-only review would call this table safe while anon could still empty it.
      - name: Receptionist leads RLS SQL tests
        run: bash .github/scripts/run-receptionist-leads-rls-sql-tests.sh

  owner-crm-lead-foundation-sql-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PostgreSQL server binaries
        run: |
          if [ -z "$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null)" ]; then
            sudo apt-get update
            sudo apt-get install --yes postgresql
          fi

      # PR 70A adds the pre-customer sales domain. Its security claim — that no
      # browser role can write a CRM table directly, so the validating RPCs cannot
      # be bypassed — is not something source review can settle: a file that reads
      # `enable row level security` plus an owner policy looks safe while an owner's
      # session can still PATCH owner_lead_integration_checks straight to
      # status='complete'. This boots a throwaway cluster with Supabase's real
      # default public-schema grants reproduced, applies 20260903120000, and issues
      # every statement as every role: anon, an ordinary customer, a cogniiq_admin
      # and the real platform owner. It asserts the grant matrix from the live
      # catalogs (TRUNCATE included, which no policy covers), that direct
      # INSERT/UPDATE/DELETE is refused even for the owner, that the sanctioned RPCs
      # work, that each of the five pre-offer gate conditions is refused
      # independently through both the RPC and a raw superuser write, that tri-state
      # capability booleans never decay to false, that duplicates warn without
      # merging or blocking, that a stage change touches nothing outside the lead,
      # that entities stay isolated, and that a replay changes neither the grants nor
      # the data.
      - name: Owner CRM lead foundation SQL tests
        run: bash .github/scripts/run-owner-crm-lead-foundation-sql-tests.sh
