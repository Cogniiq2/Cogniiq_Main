 "<p><b>Die drei Produktregeln, die du auswendig brauchst</b> — sie funktionieren wie Vorzeichen beim Multiplizieren (gerade = „+“, ungerade = „−“):<br>gerade · gerade = gerade · ungerade · ungerade = gerade · gerade · ungerade = ungerade.<br>Dasselbe gilt für Quotienten. Genau darauf beruht die Originalklausur-Aufgabe.</p>");

q("sym-04","symmetrie",2,"Welches Symmetrieverhalten hat <code>f(x) = sin(x) · cos(x)</code>?",
 ["punktsymmetrisch zum Ursprung","achsensymmetrisch zur y-Achse","keine Symmetrie","achsensymmetrisch zur x-Achse","punktsymmetrisch zu (1, 0)"],0,
 "<ol><li><code>sin(x)</code> ist ungerade, <code>cos(x)</code> ist gerade (<code>cos(−x) = cos(x)</code>).</li>"+
 "<li>ungerade · gerade = ungerade → punktsymmetrisch zum Ursprung.</li></ol>"+
 "<p><b>Gegenprobe:</b> <code>sin(x)·cos(x) = ½·sin(2x)</code>, und der Sinus ist ungerade — passt.</p>"+
 "<p><b>Unbedingt merken:</b> <code>sin</code> ist ungerade, <code>cos</code> ist gerade. Anschaulich: Der Cosinus hat bei <code>x = 0</code> seinen Hochpunkt und liegt spiegelbildlich zur y-Achse; der Sinus geht bei 0 durch den Ursprung und steigt auf beiden Seiten entgegengesetzt.</p>");

q("sym-05","symmetrie",2,"Welches Symmetrieverhalten hat <code>f(x) = (x − 2)³</code>?",
 ["punktsymmetrisch zu (2, 0)","punktsymmetrisch zum Ursprung","achsensymmetrisch zur Geraden x = 2","achsensymmetrisch zur y-Achse","keine Symmetrie"],0,
 "<p><b>Immer wenn überall derselbe Klammerausdruck steht, wird substituiert.</b></p>"+
 "<ol><li>Setze <code>u = x − 2</code>. Dann ist <code>g(u) = u³</code>.</li>"+
 "<li><code>u³</code> ist ungerade, also punktsymmetrisch zum Ursprung der u-Welt.</li>"+
 "<li>Der Ursprung <code>u = 0</code> liegt bei <code>x = 2</code>. Also: punktsymmetrisch zu <code>(2, 0)</code>.</li></ol>"+
 "<p><b>Die Merkregel für das Zurückübersetzen:</b> <code>x − a</code> in der Klammer bedeutet Verschiebung um <code>+a</code> nach rechts. Das Symmetriezentrum wandert genau mit. Vorsicht beim Vorzeichen: bei <code>(x + 2)³</code> läge das Zentrum bei <code>(−2, 0)</code>.</p>");

q("sym-06","symmetrie",2,"Welches Symmetrieverhalten hat <code>f(x) = (x − 3)² + 4</code>?",
 ["achsensymmetrisch zur Geraden x = 3","achsensymmetrisch zur y-Achse","punktsymmetrisch zu (3, 4)","punktsymmetrisch zum Ursprung","keine Symmetrie"],0,
 "<ol><li>Substituiere <code>u = x − 3</code>: <code>g(u) = u² + 4</code>.</li>"+
 "<li><code>u² + 4</code> ist gerade (nur gerade Exponenten), also achsensymmetrisch zur u-Achse durch <code>u = 0</code>.</li>"+
 "<li><code>u = 0</code> entspricht <code>x = 3</code> → Spiegelachse ist die <b>senkrechte Gerade x = 3</b>.</li></ol>"+
 "<p><b>Wichtiger Unterschied zur Punktsymmetrie:</b> Bei Achsensymmetrie ist das Ergebnis eine <em>Gerade</em> (<code>x = 3</code>), bei Punktsymmetrie ein <em>Punkt</em> (<code>(3, 0)</code>). Das <code>+4</code> verschiebt hier nur nach oben und ist für die Achse völlig egal — bei Punktsymmetrie wäre es dagegen Teil des Zentrums.</p>");

q("sym-07","symmetrie",3,"Welches Symmetrieverhalten hat <code>f(x) = sin(x + 2) · (x + 2)⁴</code>?",
 ["punktsymmetrisch zu (−2, 0)","punktsymmetrisch zu (2, 0)","achsensymmetrisch zur Geraden x = −2","punktsymmetrisch zum Ursprung","keine Symmetrie"],0,
 "<p>Baugleich mit der Originalklausur, nur mit anderen Zahlen und einer vierten Potenz.</p>"+
 "<ol><li>Substituiere <code>u = x + 2</code>: <code>g(u) = sin(u) · u⁴</code>.</li>"+
 "<li><code>sin(u)</code> ungerade, <code>u⁴</code> gerade → Produkt ungerade → punktsymmetrisch zum Ursprung der u-Welt.</li>"+
 "<li><code>u = 0</code> bedeutet <code>x + 2 = 0</code>, also <code>x = −2</code>. Zentrum: <code>(−2, 0)</code>.</li></ol>"+
 "<p><b>Vorzeichenfalle:</b> <code>(x + 2)</code> verschiebt nach <em>links</em>, das Zentrum liegt bei <code>−2</code>, nicht bei <code>+2</code>. Setze im Zweifel die Klammer null: <code>x + 2 = 0 → x = −2</code>. Dieser eine Handgriff verhindert den häufigsten Fehler der ganzen Aufgabengattung.</p>");

q("sym-08","symmetrie",2,"Welches Symmetrieverhalten hat <code>f(x) = x³ + x²</code>?",
 ["keine der beiden Symmetrien","punktsymmetrisch zum Ursprung","achsensymmetrisch zur y-Achse","achsensymmetrisch zur x-Achse","punktsymmetrisch zu (1, 0)"],0,
 "<ol><li><code>f(−x) = −x³ + x²</code>.</li>"+
 "<li>Das ist weder <code>f(x) = x³ + x²</code> noch <code>−f(x) = −x³ − x²</code>.</li>"+
 "<li>Also weder gerade noch ungerade.</li></ol>"+
 "<p><b>Warum:</b> gerade und ungerade Exponenten sind gemischt. Sobald in einem Polynom beide Sorten vorkommen, entfällt jede Achsen- oder Punktsymmetrie zum Ursprung. Prüfe das immer zuerst — es kostet drei Sekunden und erledigt viele Aufgaben sofort.</p>"+
 "<p><b>Schnelle Gegenprobe mit einer Zahl:</b> <code>f(1) = 2</code>, <code>f(−1) = −1 + 1 = 0</code>. Bei gerader Funktion müsste <code>f(−1) = 2</code> sein, bei ungerader <code>−2</code>. Beides trifft nicht zu. Diese Ein-Zahl-Probe schließt im Test blitzschnell falsche Optionen aus.</p>");

q("sym-09","symmetrie",2,"Welches Symmetrieverhalten hat <code>f(x) = 1/x</code>?",
 ["punktsymmetrisch zum Ursprung","achsensymmetrisch zur y-Achse","keine Symmetrie","achsensymmetrisch zur x-Achse","punktsymmetrisch zu (1, 1)"],0,
 "<ol><li><code>f(−x) = 1/(−x) = −1/x = −f(x)</code>.</li>"+
 "<li>Also ungerade → punktsymmetrisch zum Ursprung.</li></ol>"+
 "<p>Passt zur Schnellregel: <code>1/x = x^(−1)</code>, und <code>−1</code> ist ein ungerader Exponent. Die Regel für gerade und ungerade Exponenten gilt auch für negative Exponenten. Dass die Funktion bei <code>x = 0</code> gar nicht definiert ist, stört die Symmetrie nicht — der Definitionsbereich liegt selbst symmetrisch um null.</p>");

q("sym-10","symmetrie",2,"Welches Symmetrieverhalten hat <code>f(x) = x² + cos(x)</code>?",
 ["achsensymmetrisch zur y-Achse","punktsymmetrisch zum Ursprung","keine Symmetrie","achsensymmetrisch zur Geraden x = 1","punktsymmetrisch zu (0, 1)"],0,
 "<ol><li><code>x²</code> ist gerade, <code>cos(x)</code> ist gerade.</li>"+
 "<li><b>Summenregel:</b> gerade + gerade = gerade. Also achsensymmetrisch zur y-Achse.</li></ol>"+
 "<p><b>Aufgepasst — Summen verhalten sich anders als Produkte:</b> Bei Summen gilt nur gerade + gerade = gerade und ungerade + ungerade = ungerade. <em>Gemischte</em> Summen (z. B. <code>x² + sin(x)</code>) haben gar keine Symmetrie. Bei Produkten dagegen liefert jede Kombination ein Ergebnis. Diese Unterscheidung wird oft verwechselt.</p>");

q("sym-11","symmetrie",3,"Welches Symmetrieverhalten hat <code>f(x) = sin(x)/x</code>?",
 ["achsensymmetrisch zur y-Achse","punktsymmetrisch zum Ursprung","keine Symmetrie","achsensymmetrisch zur x-Achse","punktsymmetrisch zu (1, 0)"],0,
 "<ol><li>Zähler <code>sin(x)</code> ungerade, Nenner <code>x</code> ungerade.</li>"+
 "<li>ungerade / ungerade = <b>gerade</b> — die beiden Minuszeichen kürzen sich weg.</li>"+
 "<li>Also achsensymmetrisch zur y-Achse.</li></ol>"+
 "<p><b>Rechnerisch nachvollzogen:</b> <code>f(−x) = sin(−x)/(−x) = (−sin x)/(−x) = sin(x)/x = f(x)</code>.</p>"+
 "<p>Das ist die Aufgabe, bei der die meisten reflexhaft „ungerade“ ankreuzen, weil überall Ungerades steht. Rechne die Vorzeichen wie beim Multiplizieren: minus geteilt durch minus ergibt plus.</p>");

q("sym-12","symmetrie",1,"Warum kann der Graph einer Funktion nie achsensymmetrisch zur x-Achse sein?",
 ["Weil dann einem x-Wert zwei y-Werte zugeordnet wären.","Weil Funktionen immer durch den Ursprung gehen.","Weil die x-Achse keine Symmetrieachse sein darf.","Weil dann die Ableitung nicht existieren würde.","Das kann sehr wohl vorkommen, etwa bei f(x) = x²."],0,
 "<p>Achsensymmetrie zur x-Achse würde bedeuten: Zu jedem Punkt <code>(x, y)</code> gehört auch <code>(x, −y)</code> zum Graphen. Dann hätte dasselbe <code>x</code> zwei verschiedene Funktionswerte — und genau das ist bei einer Funktion per Definition verboten (jedem x <em>genau ein</em> y).</p>"+
 "<p><b>Warum das für die Klausur zählt:</b> „achsensymmetrisch zur x-Achse“ stand in der Originalklausur als Antwortoption. Es ist ein <b>Freischuss</b>: Diese Option kannst du bei jeder Symmetrieaufgabe sofort streichen, ohne zu rechnen. Damit sind von vier Optionen nur noch drei übrig.</p>");

q("sym-13","symmetrie",2,"Welches Symmetrieverhalten hat <code>f(x) = cos(x − π)</code>?",
 ["achsensymmetrisch zur Geraden x = π","punktsymmetrisch zu (π, 0)","achsensymmetrisch zur y-Achse","punktsymmetrisch zum Ursprung","keine Symmetrie"],0,
 "<ol><li>Substituiere <code>u = x − π</code>: <code>g(u) = cos(u)</code>.</li>"+
 "<li><code>cos</code> ist gerade → achsensymmetrisch zur senkrechten Achse durch <code>u = 0</code>.</li>"+
 "<li><code>u = 0</code> heißt <code>x = π</code>. Also Spiegelachse <code>x = π</code>.</li></ol>"+
 "<p><b>Gerade → Achse, ungerade → Punkt.</b> Diese Zuordnung ist der Kern der ganzen Aufgabengattung: Erst bestimmst du mit den Bausteinregeln, ob die substituierte Funktion gerade oder ungerade ist; erst danach übersetzt du die Verschiebung zurück.</p>");

q("sym-14","symmetrie",3,"Eine Funktion g ist ungerade, eine Funktion h ist gerade. Was gilt für <code>f(x) = g(x) · h(x)</code>?",
 ["f ist ungerade.","f ist gerade.","f hat keine Symmetrie.","f ist gerade, falls g(0) = 0.","Das lässt sich allgemein nicht sagen."],0,
 "<p><b>Der Beweis in einer Zeile</b> — genau die Rechnung, die hinter der Originalklausur steckt:</p>"+
 "<p><code>f(−x) = g(−x) · h(−x) = (−g(x)) · h(x) = −(g(x)·h(x)) = −f(x)</code></p>"+
 "<p>Das eine Minuszeichen aus dem ungeraden Faktor überlebt und steht am Ende vor dem gesamten Produkt. Also ist f ungerade — punktsymmetrisch zum Ursprung.</p>"+
 "<p><b>Vollständige Tabelle für Produkte und Quotienten:</b><br>"+
 "gerade · gerade = gerade<br>ungerade · ungerade = gerade<br>gerade · ungerade = ungerade<br>"+
 "Rechne einfach mit Vorzeichen: gerade = „+“, ungerade = „−“. Das Ergebnis stimmt immer.</p>");

// Ehrliche, Lügner und Normale — der 8-Punkte-Logikblock
q("rae-01","raetsel",1,"Auf der Insel gibt es Ehrliche (sagen immer die Wahrheit), Lügner (lügen immer) und Normale (sagen mal so, mal so). A sagt: <b>„Ich bin ein Lügner.“</b> Was ist A?",
 ["A ist ein Normaler.","A ist ein Lügner.","A ist ein Ehrlicher.","Das lässt sich nicht bestimmen.","Die Situation ist unmöglich."],0,
 "<p><b>Der Grundgriff: jede Rolle einzeln durchspielen und auf Widerspruch prüfen.</b></p>"+
 "<ol><li><b>Wäre A ein Ehrlicher?</b> Dann müsste die Aussage wahr sein, A wäre also ein Lügner. Aber A sollte Ehrlicher sein. Widerspruch.</li>"+
 "<li><b>Wäre A ein Lügner?</b> Dann müsste die Aussage falsch sein. Sie lautet „Ich bin ein Lügner“ — und die wäre ja wahr. Ein Lügner darf nichts Wahres sagen. Widerspruch.</li>"+
 "<li><b>Wäre A ein Normaler?</b> Dann ist die Aussage falsch (A ist kein Lügner), und ein Normaler darf lügen. Kein Widerspruch.</li></ol>"+
 "<p><b>Der Satz, den du in jeder Aufgabe brauchst:</b> Niemand außer einem Normalen kann „Ich bin ein Lügner“ sagen. Ehrliche dürfen nichts Falsches sagen, Lügner nichts Wahres — und diese Aussage ist für sie jeweils das Verbotene. Auf einer Insel <em>ohne</em> Normale wäre die Situation schlicht unmöglich.</p>");

q("rae-02","raetsel",2,"Nur Ehrliche und Lügner. A sagt: <b>„Wir beide sind Lügner“</b> (über sich und B). Was folgt?",
 ["A ist ein Lügner, B ist ein Ehrlicher.","A und B sind beide Lügner.","A ist ein Ehrlicher, B ist ein Lügner.","A und B sind beide Ehrliche.","Nicht bestimmbar."],0,
 "<ol><li><b>Annahme: A ist Ehrlicher.</b> Dann wäre die Aussage wahr, also wäre A ein Lügner. Widerspruch — A ist kein Ehrlicher.</li>"+
 "<li><b>Also ist A ein Lügner.</b> Dann ist seine Aussage falsch.</li>"+
 "<li><b>Was heißt „falsch“ hier genau?</b> Die Aussage „A und B sind Lügner“ ist eine Und-Verknüpfung. Sie ist bereits dann falsch, wenn <em>mindestens einer</em> der beiden kein Lügner ist. A <em>ist</em> Lügner — also muss B der Ehrliche sein.</li></ol>"+
 "<p><b>Das ist der entscheidende Punkt bei „und“-Aussagen:</b> Die Verneinung von „beide sind X“ ist <em>nicht</em> „beide sind nicht X“, sondern „mindestens einer ist nicht X“ (Regel von De Morgan). Wer hier falsch verneint, kommt zwangsläufig auf ein falsches Ergebnis.</p>");

q("rae-03","raetsel",2,"Nur Ehrliche und Lügner. A sagt: <b>„Mindestens einer von uns beiden ist ein Lügner“</b> (über sich und B). Was folgt?",
 ["A ist ein Ehrlicher, B ist ein Lügner.","A ist ein Lügner, B ist ein Ehrlicher.","Beide sind Lügner.","Beide sind Ehrliche.","Nicht bestimmbar."],0,
 "<ol><li><b>Annahme: A ist Lügner.</b> Dann ist seine Aussage falsch. Die Verneinung von „mindestens einer ist Lügner“ lautet „<em>keiner</em> ist Lügner“ — dann wäre aber auch A kein Lügner. Widerspruch.</li>"+
 "<li><b>Also ist A ein Ehrlicher</b>, und seine Aussage ist wahr: Mindestens einer der beiden ist ein Lügner.</li>"+
 "<li>A selbst ist es nicht — also ist B der Lügner.</li></ol>"+
 "<p><b>Vergleiche bewusst mit der vorigen Aufgabe:</b> Fast derselbe Satz („beide“ statt „mindestens einer“) führt zum genau umgekehrten Ergebnis. Deshalb musst du bei diesen Rätseln jedes Quantorenwort — <em>alle, beide, mindestens einer, keiner, genau einer</em> — wörtlich nehmen.</p>");

q("rae-04","raetsel",2,"Nur Ehrliche und Lügner. A sagt: <b>„B ist ein Lügner.“</b> B sagt: <b>„A ist ein Lügner.“</b> Was folgt?",
 ["Genau einer von beiden ist ein Lügner; wer, lässt sich nicht bestimmen.","Beide sind Lügner.","Beide sind Ehrliche.","A ist der Lügner.","B ist der Lügner."],0,
 "<ol><li><b>Annahme: A ist Ehrlicher.</b> Dann stimmt seine Aussage, B ist Lügner. B sagt „A ist ein Lügner“ — das ist falsch, und ein Lügner sagt Falsches. Alles passt.</li>"+
 "<li><b>Annahme: A ist Lügner.</b> Dann ist seine Aussage falsch, B ist also Ehrlicher. B sagt „A ist ein Lügner“ — das ist wahr, und ein Ehrlicher sagt Wahres. Passt ebenfalls.</li></ol>"+
 "<p><b>Beide Fälle sind widerspruchsfrei</b>, also ist die Zuordnung nicht eindeutig. Sicher ist nur: Genau einer der beiden lügt — denn in beiden Szenarien ist es immer einer und nie beide.</p>"+
 "<p><b>Lehre daraus:</b> Wenn nach dem Durchspielen mehr als ein Fall übrig bleibt, ist „nicht bestimmbar“ die richtige Antwort — nicht ein Ratefehler. Prüfe aber vorher, ob es eine <em>gemeinsame</em> Erkenntnis aller offenen Fälle gibt; genau die ist hier gefragt.</p>");

q("rae-05","raetsel",3,"Nur Ehrliche und Lügner. A sagt: <b>„Wenn ich ein Ehrlicher bin, dann ist B ein Lügner.“</b> Was folgt?",
 ["A ist ein Ehrlicher, B ist ein Lügner.","A ist ein Lügner, B ist ein Ehrlicher.","Beide sind Ehrliche.","Beide sind Lügner.","Nicht bestimmbar."],0,
 "<p>Hier musst du wissen, wann eine <b>Wenn-dann-Aussage falsch</b> ist: nur dann, wenn die Bedingung erfüllt ist, die Folge aber nicht. In allen anderen Fällen ist sie wahr — insbesondere ist sie <b>automatisch wahr, wenn die Bedingung falsch ist</b>.</p>"+
 "<ol><li><b>Annahme: A ist Lügner.</b> Dann müsste seine Aussage falsch sein. Falsch wäre sie nur, wenn „Ich bin ein Ehrlicher“ zuträfe — A ist aber Lügner, die Bedingung ist also falsch. Damit ist die gesamte Wenn-dann-Aussage <b>wahr</b>. Ein Lügner kann nichts Wahres sagen. Widerspruch.</li>"+
 "<li><b>Also ist A ein Ehrlicher</b>, und seine Aussage ist wahr.</li>"+
 "<li>Da A tatsächlich Ehrlicher ist, ist die Bedingung erfüllt — also muss auch die Folge gelten: B ist ein Lügner.</li></ol>"+
 "<p><b>Das ist die anspruchsvollste Bauart dieser Rätsel</b> und genau deshalb prüfungsrelevant. Merke: Eine Wenn-dann-Aussage mit falscher Bedingung ist wahr. Ein Lügner kann sie deshalb nie aussprechen.</p>");

q("rae-06","raetsel",3,"Genau einer von A, B, C ist Ehrlicher, einer Lügner, einer Normaler. <b>A: „C ist ein Lügner.“ B: „A ist ein Ehrlicher.“ C: „Ich bin ein Normaler.“</b> Wer ist was?",
 ["A Ehrlicher, B Normaler, C Lügner","A Lügner, B Normaler, C Ehrlicher","A Normaler, B Ehrlicher, C Lügner","A Ehrlicher, B Lügner, C Normaler","A Lügner, B Ehrlicher, C Normaler","A Normaler, B Lügner, C Ehrlicher"],0,
 "<p><b>Beginne immer bei der Aussage über die eigene Person</b> — die schränkt am stärksten ein.</p>"+
 "<ol><li><b>C sagt „Ich bin ein Normaler.“</b> Ein Ehrlicher könnte das nicht sagen (wäre falsch). Ein Normaler könnte es sagen (wäre wahr). Ein Lügner könnte es sagen (wäre falsch — er ist ja kein Normaler). Also ist C <b>Normaler oder Lügner</b>, aber kein Ehrlicher.</li>"+
 "<li><b>Fall C = Normaler.</b> Dann ist A's Aussage („C ist Lügner“) falsch, A ist also nicht Ehrlicher — A muss Lügner sein, B wäre Ehrlicher. Aber B sagt „A ist ein Ehrlicher“, was dann falsch wäre. Ein Ehrlicher darf nichts Falsches sagen. <b>Widerspruch.</b></li>"+
 "<li><b>Fall C = Lügner.</b> Dann ist A's Aussage wahr, A ist also Ehrlicher oder Normaler. B sagt „A ist ein Ehrlicher“.<br>· Wäre A Normaler, wäre B's Aussage falsch, B müsste Lügner sein — die Rolle hat aber schon C. Widerspruch.<br>· Also ist <b>A Ehrlicher</b>, und für B bleibt <b>Normaler</b>. Probe: B sagt etwas Wahres, das darf ein Normaler. Alles passt.</li></ol>"+
 "<p><b>Ergebnis: A Ehrlicher, B Normaler, C Lügner.</b> Beachte das Muster: Der Widerspruch entsteht beide Male beim <em>Ehrlichen</em> oder <em>Lügner</em> — nie beim Normalen, denn der darf alles sagen. Prüfe deshalb die beiden strengen Rollen zuerst.</p>");

q("rae-07","raetsel",3,"Genau einer von A, B, C ist Ehrlicher, einer Lügner, einer Normaler. <b>A: „Ich bin kein Lügner.“ B: „Ich bin kein Ehrlicher.“ C: „Ich bin kein Normaler.“</b> Wer ist was?",
 ["A Lügner, B Normaler, C Ehrlicher","A Ehrlicher, B Normaler, C Lügner","A Normaler, B Lügner, C Ehrlicher","A Ehrlicher, B Lügner, C Normaler","A Lügner, B Ehrlicher, C Normaler","A Normaler, B Ehrlicher, C Lügner"],0,
 "<p>Alle drei reden über sich selbst — arbeite die strengen Rollen der Reihe nach ab.</p>"+
 "<ol><li><b>B sagt „Ich bin kein Ehrlicher.“</b> Wäre B Ehrlicher, wäre die Aussage falsch — verboten. Wäre B Lügner, wäre die Aussage wahr („kein Ehrlicher“ stimmt ja) — für einen Lügner ebenfalls verboten. Also ist <b>B ein Normaler</b>.</li>"+
 "<li><b>C sagt „Ich bin kein Normaler.“</b> B ist bereits der Normale, C also Ehrlicher oder Lügner. Wäre C Lügner, wäre die Aussage wahr — verboten. Also ist <b>C ein Ehrlicher</b>, und die Aussage stimmt.</li>"+
 "<li>Für A bleibt <b>Lügner</b>. Probe: A sagt „Ich bin kein Lügner“ — das ist falsch, und genau das muss ein Lügner tun. Passt.</li></ol>"+
 "<p><b>Dieselbe Lösungsstruktur wie in der Originalklausur.</b> Der Schlüssel ist immer dieselbe Frage: <em>Welche Rollen kann diese Person aufgrund ihrer eigenen Aussage nicht haben?</em> Sobald eine Rolle eindeutig vergeben ist, fällt der Rest wie eine Kette.</p>");

q("rae-08","raetsel",2,"Nur Ehrliche und Lügner. A sagt: <b>„Ich bin ein Ehrlicher.“</b> Was folgt?",
 ["Nichts – jeder von beiden könnte das sagen.","A ist ein Ehrlicher.","A ist ein Lügner.","Die Situation ist unmöglich.","A ist ein Normaler."],0,
 "<ol><li><b>Wäre A Ehrlicher:</b> Die Aussage wäre wahr — genau das, was ein Ehrlicher tun muss. Möglich.</li>"+
 "<li><b>Wäre A Lügner:</b> Die Aussage „Ich bin ein Ehrlicher“ wäre falsch — genau das, was ein Lügner tun muss. Ebenfalls möglich.</li></ol>"+
 "<p><b>Also liefert diese Aussage null Information.</b> Auf der Insel behauptet <em>jeder</em>, ehrlich zu sein.</p>"+
 "<p><b>Das ist das genaue Gegenstück zu „Ich bin ein Lügner“:</b> Diesen Satz kann niemand sagen, jenen kann jeder sagen. Beide Extremfälle solltest du sofort erkennen — sie tauchen als Bausteine in größeren Rätseln auf und sparen dort viel Zeit.</p>");

q("rae-09","raetsel",3,"Nur Ehrliche und Lügner. A sagt: <b>„B und ich gehören zur selben Sorte.“</b> Was folgt sicher?",
 ["B ist ein Ehrlicher.","B ist ein Lügner.","A ist ein Ehrlicher.","A ist ein Lügner.","Nichts folgt."],0,
 "<ol><li><b>Annahme: A ist Ehrlicher.</b> Dann ist die Aussage wahr, also gehört B zur selben Sorte — B ist Ehrlicher.</li>"+
 "<li><b>Annahme: A ist Lügner.</b> Dann ist die Aussage falsch, die beiden gehören also <em>nicht</em> zur selben Sorte — B ist demnach Ehrlicher.</li></ol>"+
 "<p><b>In beiden Fällen ist B ein Ehrlicher</b>, obwohl offen bleibt, was A ist. Genau das ist gefragt: nicht die vollständige Zuordnung, sondern die Aussage, die in <em>jedem</em> möglichen Fall gilt.</p>"+
 "<p><b>Technik zum Mitnehmen:</b> Wenn beide Annahmen widerspruchsfrei sind, schreibe für jeden Fall auf, was folgt, und suche die Schnittmenge. Was in allen Fällen gleich ist, ist gesichert — der Rest bleibt offen.</p>");

q("rae-10","raetsel",3,"Genau einer von A, B, C ist Ehrlicher, einer Lügner, einer Normaler. <b>A: „B ist ein Lügner.“ B: „Ich bin kein Lügner.“</b> C schweigt. Wer ist der Lügner?",
 ["A","B","C","Nicht bestimmbar","Es gibt keinen Lügner."],0,
 "<ol><li><b>B sagt „Ich bin kein Lügner.“</b> Wäre B der Lügner, wäre diese Aussage falsch — das ist für einen Lügner erlaubt. Kein Widerspruch, B <em>könnte</em> der Lügner sein.<br>Wäre B Ehrlicher oder Normaler, wäre die Aussage wahr — ebenfalls erlaubt. Aus B's Aussage folgt also nichts.</li>"+
 "<li><b>Weiter über A.</b> Angenommen, A wäre Ehrlicher. Dann ist B tatsächlich Lügner, und C ist Normaler. Prüfung: B (Lügner) sagt „Ich bin kein Lügner“ — falsch, erlaubt. Alles widerspruchsfrei.</li>"+
 "<li><b>Andere Möglichkeit prüfen.</b> Angenommen, A wäre Lügner. Dann ist seine Aussage falsch, B ist also kein Lügner — passt, denn A ist es ja selbst. B wäre dann Ehrlicher oder Normaler, C das jeweils andere. Auch das ist widerspruchsfrei.</li></ol>"+
 "<p><b>Zwei verschiedene Lösungen bleiben übrig</b> (einmal ist B der Lügner, einmal A). Damit ist die Frage <b>nicht bestimmbar</b>.</p>"+
 "<p><b>Warum diese Aufgabe wichtig ist:</b> Nicht jedes Rätsel hat eine eindeutige Lösung, und im Test steht „nicht bestimmbar“ oft zur Auswahl. Höre erst auf zu suchen, wenn du <em>alle</em> Möglichkeiten geprüft hast — nicht schon bei der ersten, die passt.</p>");

q("rae-11","raetsel",2,"Nur Ehrliche und Lügner. A sagt über B: <b>„Er ist ein Ehrlicher.“</b> B sagt über A: <b>„Er ist ein Lügner.“</b> Was folgt?",
 ["Die Situation ist unmöglich.","A ist Ehrlicher, B ist Lügner.","A ist Lügner, B ist Ehrlicher.","Beide sind Lügner.","Nicht bestimmbar."],0,
 "<ol><li><b>Annahme: A ist Ehrlicher.</b> Dann stimmt seine Aussage, B ist Ehrlicher. Dann müsste auch B's Aussage stimmen: A wäre ein Lügner. Aber wir sind von „A ist Ehrlicher“ ausgegangen. Widerspruch.</li>"+
 "<li><b>Annahme: A ist Lügner.</b> Dann ist seine Aussage falsch, B ist also Lügner. Dann müsste B's Aussage falsch sein, A wäre also <em>kein</em> Lügner. Widerspruch.</li></ol>"+
 "<p><b>Beide Fälle scheitern — auf einer reinen Ehrlichen-Lügner-Insel ist diese Situation unmöglich.</b> Mit einem Normalen unter den beiden wäre sie dagegen sofort auflösbar; genau deshalb führt die Klausuraufgabe die dritte Rolle ein.</p>"+
 "<p><b>Merke:</b> „Unmöglich“ ist ein zulässiges Ergebnis. Wenn <em>jede</em> Annahme in einen Widerspruch läuft, hast du nicht falsch gerechnet — die Angabe ist in sich widersprüchlich.</p>");

q("rae-12","raetsel",3,"Genau einer von A, B, C ist Ehrlicher, einer Lügner, einer Normaler. <b>A: „Ich bin ein Ehrlicher.“ B: „A sagt die Wahrheit.“ C: „Ich bin ein Lügner.“</b> Wer ist was?",
 ["Nicht eindeutig bestimmbar","A Ehrlicher, B Normaler, C Lügner","A Normaler, B Lügner, C Ehrlicher","A Lügner, B Normaler, C Ehrlicher","A Ehrlicher, B Lügner, C Normaler"],0,
 "<ol><li><b>C sagt „Ich bin ein Lügner.“</b> Wie in Aufgabe 1: Weder ein Ehrlicher noch ein Lügner kann das sagen. Also ist <b>C der Normale</b> — das steht sofort fest.</li>"+
 "<li>Damit sind A und B in irgendeiner Reihenfolge Ehrlicher und Lügner.</li>"+
 "<li><b>Fall A = Ehrlicher, B = Lügner.</b> A's Aussage („Ich bin Ehrlicher“) ist wahr ✓. B sagt „A sagt die Wahrheit“ — das wäre wahr, aber B ist Lügner. Widerspruch.</li>"+
 "<li><b>Fall A = Lügner, B = Ehrlicher.</b> A sagt „Ich bin Ehrlicher“ — falsch ✓, genau richtig für einen Lügner. B sagt „A sagt die Wahrheit“ — das wäre falsch, aber B ist Ehrlicher. Widerspruch.</li></ol>"+
 "<p><b>Beide Fälle scheitern, die Angabe ist widersprüchlich</b> — es gibt keine gültige Zuordnung, also ist nichts eindeutig bestimmbar.</p>"+
 "<p><b>Die Technik, die hier alles trägt:</b> Wenn eine Person eine Rolle <em>eindeutig</em> festlegt (hier C durch die Lügner-Selbstaussage), setze sie sofort und arbeite mit dem Rest weiter. Aus drei mal zwei mal eins = sechs Möglichkeiten werden so nur noch zwei.</p>");

// Technisches Verständnis: Steht die Aussage im Text oder folgt sie direkt daraus?
var JA = ["Ja – das steht so im Text oder folgt direkt daraus","Nein – das steht so nicht im Text"];
var NEIN = ["Nein – das steht so nicht im Text","Ja – das steht so im Text oder folgt direkt daraus"];

passage("tv-cache","Caches and Locality",
`Modern processors execute instructions far faster than main memory can supply data, and the gap between the two has widened steadily for decades. Caches exist to hide it. They work because real programs exhibit locality: data used recently is likely to be used again soon, and data stored near a recently accessed address is likely to be accessed next.

A cache hit costs a handful of cycles; a miss that reaches main memory costs hundreds. One might conclude that caches should simply be made as large as possible, but designers rarely do this. A larger cache takes longer to search and occupies chip area that could serve other purposes, so the additional capacity is paid for with additional latency. The usual compromise is a hierarchy of several levels, each larger and slower than the one above it.

Not every workload benefits. Streaming computations that touch each item exactly once gain nothing from a cache, since nothing is ever reused, and they may actively harm overall performance by displacing data that other parts of the program still need.`);

q("tv-c1","tv",2,"Steht das im Text?<br><br><b>„Ein Cache-Treffer ist deutlich günstiger als ein Zugriff auf den Hauptspeicher.“</b>",
 JA,0,
 "<p><b>Ja.</b> Wörtlich im Text: „A cache hit costs a handful of cycles; a miss that reaches main memory costs <b>hundreds</b>.“ Eine Handvoll gegen mehrere Hundert Takte — das ist genau die Aussage.</p>"+
 "<p><b>Vorgehen bei solchen Aussagen:</b> Suche die Zahl oder den Vergleich im Text und lege beide nebeneinander. Wenn Größenordnung <em>und</em> Richtung des Vergleichs übereinstimmen, ist die Aussage gedeckt. Hier stimmt beides.</p>",
 "tv-cache");

q("tv-c2","tv",2,"Steht das im Text?<br><br><b>„Caches sollten grundsätzlich so groß wie möglich gebaut werden, weil mehr Kapazität immer mehr Leistung bedeutet.“</b>",
 NEIN,0,
 "<p><b>Nein — der Text sagt sogar ausdrücklich das Gegenteil.</b> „One might conclude that caches should simply be made as large as possible, <b>but designers rarely do this</b>.“ Begründung im Text: Ein größerer Cache braucht länger zum Durchsuchen und kostet Chipfläche.</p>"+
 "<p><b>Die Falle heißt Scheinschlussfolgerung.</b> Der Text formuliert einen naheliegenden Gedanken (<em>one might conclude</em>) ausdrücklich nur, um ihn anschließend zu widerlegen. Wer beim Überfliegen nur den ersten Halbsatz erwischt, kreuzt „Ja“ an.</p>"+
 "<p><b>Signalwörter, die dich warnen müssen:</b> <em>but, however, although, one might think, in fact</em>. Was hinter ihnen steht, kippt in der Regel die Aussage davor. Lies bei jeder Aussage den Satz zu Ende, bevor du entscheidest.</p>",
 "tv-cache");

q("tv-c3","tv",2,"Steht das im Text?<br><br><b>„Alle Programme profitieren von einem Cache.“</b>",
 NEIN,0,
 "<p><b>Nein.</b> Der letzte Absatz sagt genau das Gegenteil: „<b>Not every workload benefits.</b> Streaming computations that touch each item exactly once gain nothing from a cache.“</p>"+
 "<p><b>Die Falle heißt Übergeneralisierung</b> — sie ist der zweithäufigste Trick in diesem Aufgabentyp. Der Text sagt „manche“ oder „nicht alle“, die Aussage macht daraus „alle“.</p>"+
 "<p><b>Praktische Regel:</b> Absolutwörter wie <em>alle, immer, nie, jeder, ausschließlich</em> sind ein Alarmsignal. Sie sind selten gedeckt, weil Fachtexte fast immer einschränkend formulieren. Suche gezielt nach einer Ausnahme im Text — findest du eine, ist die Aussage falsch.</p>",
 "tv-cache");

q("tv-c4","tv",2,"Steht das im Text?<br><br><b>„Der Geschwindigkeitsunterschied zwischen Prozessor und Hauptspeicher ist über Jahrzehnte hinweg gewachsen.“</b>",
 JA,0,
 "<p><b>Ja.</b> Erster Satz: „the gap between the two has <b>widened steadily for decades</b>“ — der Abstand hat über Jahrzehnte stetig zugenommen.</p>"+
 "<p><b>Warum diese Aussage leicht ist:</b> Sie ist eine reine Übersetzung, ohne Bewertung und ohne Verallgemeinerung. Solche Aussagen sind in der Klausur die geschenkten Punkte — sie zuerst abhaken und die Zeit für die kniffligen aufsparen.</p>",
 "tv-cache");

passage("tv-debt","Technical Debt",
`The metaphor of technical debt was introduced by Ward Cunningham to explain to non-programmers why development slows down over time. Shipping quickly with a design one knows to be imperfect resembles borrowing money: it buys speed today and charges interest later, paid in the form of every future change taking longer than it should.

Cunningham was insistent on a restriction that is now widely ignored. The metaphor applies only when the team understands the domain well enough to know that it is taking a deliberate shortcut. Code written out of ignorance of the problem is not debt; it is simply bad code, and calling it debt suggests a considered decision that was never made.

Repayment means refactoring, and refactoring competes with new features for the same scarce engineering hours. That competition, rather than any technical difficulty, is why repayment is so often postponed. It is also worth noting that not all debt deserves repayment: a module scheduled for deletion next quarter can be left exactly as it is.`);

q("tv-d1","tv",2,"Steht das im Text?<br><br><b>„Laut Cunningham liegt technische Schuld nur dann vor, wenn die Abkürzung bewusst gewählt wurde.“</b>",
 JA,0,
 "<p><b>Ja.</b> „The metaphor applies <b>only</b> when the team understands the domain well enough to know that it is taking a <b>deliberate shortcut</b>.“ Das Wort <em>only</em> macht daraus genau die Einschränkung, die die Aussage behauptet.</p>"+
 "<p><b>Auf Einschränkungswörter achten:</b> <em>only, unless, provided that, except</em> tragen im Fachtext oft die eigentliche Aussage. Wenn eine Prüfungsaussage genau diese Einschränkung wiedergibt, ist sie in aller Regel gedeckt.</p>",
 "tv-debt");

q("tv-d2","tv",2,"Steht das im Text?<br><br><b>„Auch schlecht geschriebener Code aus Unwissenheit zählt laut Text als technische Schuld.“</b>",
 NEIN,0,
 "<p><b>Nein — der Text widerspricht ausdrücklich:</b> „Code written out of ignorance of the problem <b>is not debt</b>; it is simply bad code.“</p>"+
 "<p><b>Die Falle ist eine Umkehrung der Einschränkung.</b> Der Text zieht eine Grenze (bewusst = Schuld, unwissend = nicht Schuld), die Aussage hebt diese Grenze auf. Solche Aussagen prüfst du am schnellsten, indem du im Text nach dem verneinenden Satz suchst — er steht fast immer direkt neben der Definition.</p>"+
 "<p><b>Achtung, Weltwissen ausblenden:</b> Im echten Berufsleben nennen viele Teams jeden Murks „technische Schuld“. Genau davor warnt der Text sogar. Gefragt ist aber ausschließlich, was <em>im Text</em> steht — nicht, was üblich ist.</p>",
 "tv-debt");

q("tv-d3","tv",2,"Steht das im Text?<br><br><b>„Das Abtragen technischer Schuld konkurriert mit neuen Funktionen um dieselbe knappe Entwicklungszeit.“</b>",
 JA,0,
 "<p><b>Ja.</b> „refactoring <b>competes with new features for the same scarce engineering hours</b>“ — wörtlich dieselbe Aussage.</p>"+
 "<p>Der Text geht sogar noch einen Schritt weiter und nennt genau diese Konkurrenz als Grund für das ständige Aufschieben („That competition, <b>rather than any technical difficulty</b>“). Auch das wäre als Aussage gedeckt — der Text benennt die Ursache ausdrücklich.</p>",
 "tv-debt");

q("tv-d4","tv",2,"Steht das im Text?<br><br><b>„Technische Schuld sollte immer so früh wie möglich abgetragen werden.“</b>",
 NEIN,0,
 "<p><b>Nein.</b> Der letzte Satz sagt das Gegenteil: „<b>not all debt deserves repayment</b>: a module scheduled for deletion next quarter can be left exactly as it is.“</p>"+
 "<p><b>Zwei Fallen auf einmal:</b> erstens das Absolutwort <em>immer</em>, zweitens eine Handlungsempfehlung, die der Text nirgends ausspricht. Fachtexte dieser Art beschreiben meist Zusammenhänge und geben selten Ratschläge — eine Aussage im Befehlston („sollte“, „muss“) ist deshalb besonders verdächtig.</p>"+
 "<p><b>Prüfmuster:</b> Wenn eine Aussage ein <em>Sollen</em> enthält, suche im Text nach einer Stelle, die tatsächlich eine Empfehlung ausspricht. Findest du nur Beschreibungen, lautet die Antwort Nein.</p>",
 "tv-debt");

passage("tv-drift","Model Drift",
`A machine learning model deployed in production carries an assumption that is rarely stated: that the future will resemble the data it was trained on. When that assumption fails — customers change their habits, a sensor is recalibrated, a competitor adjusts its prices — the model's accuracy decays, sometimes within weeks.

Practitioners distinguish two cases. In data drift the distribution of the inputs changes. In concept drift the relationship between inputs and the target changes, while the inputs themselves may look entirely ordinary. The second case is considerably harder to detect for exactly that reason: nothing about the incoming data appears unusual.

Measuring accuracy directly would settle the question, but doing so requires labels, and labels frequently arrive weeks after the prediction or never arrive at all. Teams therefore fall back on proxy signals such as shifts in the distribution of the model's outputs. The standard remedy is retraining on recent data. This is not free: recent data may no longer contain the rare events that the older training set captured, and a retrained model can lose the ability to handle them.`);

q("tv-m1","tv",2,"Steht das im Text?<br><br><b>„Konzeptdrift ist schwerer zu erkennen als Datendrift, weil die Eingabedaten unauffällig bleiben können.“</b>",
 JA,0,
 "<p><b>Ja.</b> „The second case is considerably <b>harder to detect</b> for exactly that reason: nothing about the incoming data appears unusual.“ Sowohl der Vergleich (schwerer) als auch die Begründung (unauffällige Eingaben) stehen wörtlich da.</p>"+
 "<p><b>Wichtig:</b> Die Aussage enthält ein <em>weil</em>, behauptet also eine Ursache. Bei Kausalaussagen musst du beides prüfen — die Behauptung <em>und</em> die Begründung. Hier trägt der Text beides, deshalb Ja.</p>",
 "tv-drift");

q("tv-m2","tv",2,"Steht das im Text?<br><br><b>„Die Genauigkeit eines Modells lässt sich im laufenden Betrieb jederzeit direkt messen.“</b>",
 NEIN,0,
 "<p><b>Nein.</b> Der Text: „Measuring accuracy directly would settle the question, <b>but</b> doing so requires labels, and labels frequently arrive weeks after the prediction <b>or never arrive at all</b>.“</p>"+
 "<p>Genau deshalb weichen Teams laut Text auf Ersatzsignale aus. Wäre direkte Messung jederzeit möglich, wäre dieser ganze Absatz überflüssig.</p>"+
 "<p><b>Nützliche Gegenprobe:</b> Frage dich, ob der Text noch Sinn ergäbe, wenn die Aussage stimmte. Ergibt er dann keinen Sinn mehr, ist die Aussage falsch. Dieser Test funktioniert auch dann, wenn du die entscheidende Stelle nicht sofort wiederfindest.</p>",
 "tv-drift");

q("tv-m3","tv",2,"Steht das im Text?<br><br><b>„Ein auf neuen Daten neu trainiertes Modell kann die Fähigkeit verlieren, seltene Ereignisse zu behandeln.“</b>",
 JA,0,
 "<p><b>Ja.</b> „recent data may no longer contain the rare events that the older training set captured, and a retrained model <b>can lose the ability to handle them</b>.“</p>"+
 "<p><b>Beachte das vorsichtige „kann“</b> in Aussage und Text. Stünde in der Aussage „verliert immer“, wäre sie falsch — der Text sagt nur, dass es passieren kann. Die Stärke der Behauptung muss zur Stärke der Textstelle passen: <em>may</em> ↔ <em>kann</em>, <em>always</em> ↔ <em>immer</em>.</p>",
 "tv-drift");

q("tv-m4","tv",2,"Steht das im Text?<br><br><b>„Modelle verlieren an Genauigkeit, weil ihre Algorithmen mit der Zeit veralten.“</b>",
 NEIN,0,
 "<p><b>Nein.</b> Der Text nennt eine völlig andere Ursache: Nicht das Modell altert, sondern die <em>Welt verändert sich</em> — „customers change their habits, a sensor is recalibrated, a competitor adjusts its prices“. Der Algorithmus bleibt derselbe; er passt nur nicht mehr zur Realität.</p>"+
 "<p><b>Die Falle heißt untergeschobene Ursache</b> und ist besonders tückisch, weil das <em>Ergebnis</em> stimmt: Die Genauigkeit sinkt tatsächlich, das steht im Text. Falsch ist allein die Begründung.</p>"+
 "<p><b>Merke:</b> Bei jeder Aussage mit <em>weil, deshalb, aufgrund</em> prüfst du zwei Dinge getrennt — steht die Wirkung im Text, und steht <em>diese</em> Ursache im Text? Nur wenn beides zutrifft, lautet die Antwort Ja.</p>",
 "tv-drift");

passage("tv-consensus","Consensus Protocols",
`Distributed systems must agree on shared state even when some of their machines fail. Protocols such as Paxos and Raft achieve this by requiring a majority: as long as more than half the nodes can communicate, the system continues to make progress, and the remaining minority can be safely ignored. Without a majority, no progress is possible at all. This is why clusters are almost always sized with an odd number of nodes — an odd cluster tolerates the same number of failures as the next larger even one, at lower cost.

A theoretical result known as FLP shows that in a fully asynchronous network, no deterministic protocol can guarantee both correctness and termination if even a single process may fail. Practical systems sidestep the result rather than solve it, using timeouts to decide when a node should be presumed dead. This trades a theoretical guarantee for behaviour that is adequate in practice.

Raft was published well after Paxos, and its stated design goal was understandability. Its authors argued that Paxos was so difficult to reason about that implementations frequently diverged from the specification.`);

q("tv-k1","tv",2,"Steht das im Text?<br><br><b>„Raft wurde in erster Linie mit dem Ziel entwickelt, verständlicher zu sein.“</b>",
 JA,0,
 "<p><b>Ja.</b> „its <b>stated design goal was understandability</b>“ — das erklärte Entwurfsziel war Verständlichkeit. Die Begründung liefert der Text gleich mit: Paxos sei so schwer zu durchdringen, dass Implementierungen von der Spezifikation abwichen.</p>"+
 "<p>Achte darauf, dass der Text über das <em>Ziel</em> spricht, nicht über das Ergebnis. Die Aussage tut dasselbe („mit dem Ziel“) und ist damit exakt gedeckt.</p>",
 "tv-consensus");

q("tv-k2","tv",2,"Steht das im Text?<br><br><b>„Konsensprotokolle können auch dann Fortschritt erzielen, wenn keine Mehrheit erreichbar ist.“</b>",
 NEIN,0,
 "<p><b>Nein.</b> Der Text sagt unmissverständlich das Gegenteil: „<b>Without a majority, no progress is possible at all.</b>“</p>"+
 "<p><b>Diese Fallenart ist die einfachste:</b> die direkte Umkehrung eines Satzes aus dem Text. Sie ist trotzdem gefährlich, wenn man den Text nur überflogen hat, denn die Begriffe (Mehrheit, Fortschritt) stimmen ja alle — nur die Verneinung fehlt.</p>"+
 "<p><b>Gegenmittel:</b> Achte beim Lesen besonders auf Verneinungen (<em>no, not, without, never, unable</em>) und markiere sie. Genau an diesen Stellen entstehen die Umkehrfallen.</p>",
 "tv-consensus");

q("tv-k3","tv",2,"Steht das im Text?<br><br><b>„Praktische Systeme umgehen das FLP-Resultat mithilfe von Zeitschranken.“</b>",
 JA,0,
 "<p><b>Ja.</b> „Practical systems <b>sidestep</b> the result rather than solve it, <b>using timeouts</b> to decide when a node should be presumed dead.“</p>"+
 "<p><b>Beachte die feine Wortwahl:</b> Der Text sagt „umgehen“ (<em>sidestep</em>), ausdrücklich nicht „lösen“ (<em>rather than solve it</em>). Die Aussage benutzt ebenfalls „umgehen“ und ist damit korrekt. Stünde dort „lösen das FLP-Problem“, wäre sie falsch — ein einziges Verb entscheidet.</p>",
 "tv-consensus");

q("tv-k4","tv",2,"Steht das im Text?<br><br><b>„Cluster werden mit einer ungeraden Anzahl von Knoten ausgelegt, weil das FLP-Resultat es verlangt.“</b>",
 NEIN,0,
 "<p><b>Nein.</b> Beide Tatsachen stehen im Text, aber sie gehören nicht zusammen. Die ungerade Knotenzahl begründet der Text mit der <b>Mehrheitsregel</b>: „an odd cluster tolerates the same number of failures as the next larger even one, at lower cost“. Das FLP-Resultat steht in einem völlig anderen Absatz und handelt von asynchronen Netzen.</p>"+
 "<p><b>Die Falle heißt Querverbindung:</b> Zwei korrekte Aussagen aus verschiedenen Absätzen werden mit einem <em>weil</em> zusammengeklebt. Weil beide Teile für sich richtig sind, wirkt der Satz beim Überfliegen vertraut.</p>"+
 "<p><b>Gegenmittel:</b> Bei jedem <em>weil</em> prüfst du, ob Ursache und Wirkung im Text <em>im selben Zusammenhang</em> stehen. Stammen sie aus verschiedenen Absätzen, ist der Zusammenhang meist hinzugedichtet.</p>",
 "tv-consensus");

passage("tv-static","Static Analysis",
`A static analyser examines source code without executing it. Because it reasons about all possible runs of a program rather than the particular runs a test happens to exercise, it can expose defects that testing would never reach — a race condition that occurs once in a million executions is invisible to a test suite but plainly visible to an analyser that considers every interleaving.

That same generality forces an uncomfortable trade-off. An analyser that never misses a genuine defect must, as a matter of logic, also produce warnings about code that is in fact correct. These false positives are not a sign of a badly built tool; they are the price of the guarantee. In practice teams abandon analysers whose false-positive rate is high, not because the warnings are wrong in principle but because the effort of examining each one exceeds what the tool returns.

Type systems are a deliberately restricted form of static analysis. They have achieved far wider adoption than general analysers, largely because their rules are simple enough that a programmer can predict what the checker will say before running it.`);

q("tv-s1","tv",2,"Steht das im Text?<br><br><b>„Statische Analyse führt das Programm aus, um Fehler zu finden.“</b>",
 NEIN,0,
 "<p><b>Nein.</b> Gleich der erste Satz: „A static analyser examines source code <b>without executing it</b>.“ Genau das ist die Definition von <em>statisch</em> — im Gegensatz zu <em>dynamisch</em>, wo man das Programm laufen lässt.</p>"+
 "<p><b>Wenn dir ein Fachbegriff unbekannt ist,</b> steht seine Erklärung fast immer im ersten Satz, in dem er auftaucht. Genau deshalb lohnt es sich, den ersten Absatz einmal <em>langsam</em> zu lesen und den Rest schneller.</p>",
 "tv-static");

q("tv-s2","tv",2,"Steht das im Text?<br><br><b>„Ein Werkzeug, das nie einen echten Fehler übersieht, meldet zwangsläufig auch korrekten Code.“</b>",
 JA,0,
 "<p><b>Ja.</b> „An analyser that <b>never misses a genuine defect must, as a matter of logic, also produce warnings about code that is in fact correct</b>.“ Das <em>zwangsläufig</em> der Aussage entspricht dem <em>must, as a matter of logic</em> des Textes.</p>"+
 "<p><b>Das ist der Kern des Absatzes:</b> Es handelt sich nicht um eine Schwäche schlechter Werkzeuge, sondern um einen logisch unvermeidlichen Preis („they are the price of the guarantee“). Wer diesen Zusammenhang erfasst hat, beantwortet auch die nächste Aussage sicher.</p>",
 "tv-static");

q("tv-s3","tv",2,"Steht das im Text?<br><br><b>„Teams geben Analysewerkzeuge mit vielen Fehlalarmen auf, weil der Aufwand für die Prüfung den Nutzen übersteigt.“</b>",
 JA,0,
 "<p><b>Ja.</b> „teams abandon analysers whose false-positive rate is high, <b>not because the warnings are wrong in principle but because the effort of examining each one exceeds what the tool returns</b>.“</p>"+
 "<p><b>Der Text nennt die Ursache ausdrücklich</b> — und grenzt sie sogar gegen eine falsche Ursache ab. Bei Aussagen mit <em>weil</em> ist das der Idealfall: Wenn der Text selbst eine Begründung liefert und sie mit der Aussage übereinstimmt, lautet die Antwort Ja.</p>",
 "tv-static");

q("tv-s4","tv",2,"Steht das im Text?<br><br><b>„Typsysteme sind weiter verbreitet als allgemeine Analysewerkzeuge, weil sie mehr Fehler finden.“</b>",
 NEIN,0,
 "<p><b>Nein.</b> Die Verbreitung stimmt („far wider adoption“), die Begründung nicht. Laut Text liegt sie daran, dass „their rules are <b>simple enough that a programmer can predict</b> what the checker will say“ — an der Vorhersagbarkeit, nicht an der Fehlerausbeute.</p>"+
 "<p>Der Text sagt sogar, Typsysteme seien eine <em>bewusst eingeschränkte</em> Form („deliberately restricted“) — sie finden also eher <em>weniger</em>, nicht mehr.</p>"+
 "<p><b>Wieder das Muster untergeschobene Ursache</b> — inzwischen zum dritten Mal. Genau darauf laufen diese Aufgaben immer wieder hinaus: Die Hälfte des Satzes stimmt, die andere Hälfte ist erfunden. Zerlege deshalb jede Aussage in Behauptung und Begründung und prüfe beide einzeln.</p>",

/* ── Zustand ─────────────────────────────────────────────────────────── */
var KEY = "tum-annahmetest-v1";
var S = load();

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var o = JSON.parse(raw);
      if(o && o.seen){ o.exams = o.exams||[]; o.plan = o.plan||{}; return o; }
    }
  }catch(e){}
  return {seen:{}, exams:[], plan:{}, live:null};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function rec(id){
  if(!S.seen[id]) S.seen[id] = {n:0, ok:0, streak:0, wrong:0};
  return S.seen[id];
}

/* ── Hilfsfunktionen ─────────────────────────────────────────────────── */
function byId(id){ for(var i=0;i<QUESTIONS.length;i++) if(QUESTIONS[i].id===id) return QUESTIONS[i]; return null; }
function inTopic(t){ return QUESTIONS.filter(function(x){ return x.topic===t; }); }
function hash(s){ var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=(h*16777619)>>>0; } return h; }
function rng(seed){ var s=seed>>>0||1; return function(){ s^=s<<13; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }
function shuffle(arr, rand){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor((rand?rand():Math.random())*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
var PIN = /^(keine der genannten|nichts folgt|nicht bestimmbar|nicht entscheidbar|none —)/i;

/* Antwortreihenfolge: pro Frage stabil gemischt, "keine der genannten" bleibt hinten. */
function arrange(qq){
  var idx = qq.opts.map(function(_,i){ return i; });
  var free = idx.filter(function(i){ return !PIN.test(qq.opts[i]); });
  var pinned = idx.filter(function(i){ return PIN.test(qq.opts[i]); });
  return shuffle(free, rng(hash(qq.id))).concat(pinned);
}

function pad(n){ return (n<10?"0":"")+n; }
/* Kalendertage bis zum Testtag — überall dieselbe Zahl. */
function daysLeft(){
  var a = new Date(), b = TEST_AT;
  var d0 = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
  var d1 = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((d1 - d0)/86400000);
}
function mmss(sec){ sec=Math.max(0,sec); return pad(Math.floor(sec/60))+":"+pad(sec%60); }
function today(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function deDate(iso){
  var p = iso.split("-"), d = new Date(+p[0], +p[1]-1, +p[2]);
  var wd = ["So","Mo","Di","Mi","Do","Fr","Sa"][d.getDay()];
  return wd+" "+p[2]+"."+p[1]+".";
}

/* ── Statistik ───────────────────────────────────────────────────────── */
function statOf(list){
  var mastered=0, seen=0, ok=0, tries=0;
  list.forEach(function(x){
    var r = S.seen[x.id];
    if(!r) return;
    seen++; ok += r.ok; tries += r.n;
    if(r.streak >= 2) mastered++;
  });
  return {total:list.length, seen:seen, mastered:mastered,
          pct:list.length? Math.round(mastered/list.length*100):0,
          acc: tries? Math.round(ok/tries*100):null};
}
function wrongPool(){
  return QUESTIONS.filter(function(x){
    var r = S.seen[x.id];
    return r && r.wrong>0 && r.streak<2;
  });
}
function priority(x){
  var r = S.seen[x.id];
  if(!r) return 2;                    // noch nie gesehen
  if(r.streak === 0) return 3;         // zuletzt falsch
  if(r.streak === 1) return 1.2;       // einmal richtig, noch nicht sitzend
  return 0.15;                         // beherrscht, nur zur Auffrischung
}
function pick(pool, n){
  var scored = pool.map(function(x){ return {x:x, s:priority(x)+Math.random()*0.6}; });
  scored.sort(function(a,b){ return b.s - a.s; });
  return scored.slice(0,n).map(function(o){ return o.x; });
}

/* ── Sitzung ─────────────────────────────────────────────────────────── */
var SES = null, TICK = null;

function startPractice(topic){
  var pool = topic==="alle" ? QUESTIONS.slice()
    : topic==="kern" ? QUESTIONS.filter(function(x){ return KERN.indexOf(x.topic) >= 0; })
    : inTopic(topic);
  var chosen = pick(pool, Math.min(10, pool.length));
  chosen = groupPassages(shuffle(chosen));
  SES = {mode:"practice", topic:topic, ids:chosen.map(function(x){return x.id;}), i:0, ans:{}, done:false};
  go("run");
}
function startReview(){
  var pool = wrongPool();
  if(!pool.length) return;
  var chosen = groupPassages(shuffle(pool).slice(0, Math.min(15, pool.length)));
  SES = {mode:"review", topic:"fehler", ids:chosen.map(function(x){return x.id;}), i:0, ans:{}, done:false};
  go("run");
}
/* Fragen zum selben Text bleiben beieinander. */
function groupPassages(list){
  var out=[], byP={}, order=[];
  list.forEach(function(x){
    if(!x.pid){ out.push(x); return; }
    if(!byP[x.pid]){ byP[x.pid]=[]; order.push(x.pid); }
    byP[x.pid].push(x);
  });
  order.forEach(function(p){ out = out.concat(byP[p]); });
  return out;
}

function buildExam(){
  var out = [];
  /* Aufgabe 1: Symmetrie (4 P) und Ableitung (8 P) */
  out = out.concat(shuffle(inTopic("symmetrie")).slice(0,1));
  out = out.concat(shuffle(inTopic("ableitung")).slice(0,1));
  /* Aufgabe 2: ein Logikrätsel (8 P) */
  out = out.concat(shuffle(inTopic("raetsel")).slice(0,1));
  /* Aufgabe 3: ein Fachtext mit allen vier Aussagen (je 1 P) */
  var texte = {};
  inTopic("tv").forEach(function(x){ if(x.pid) texte[x.pid] = 1; });
  var pid = shuffle(Object.keys(texte))[0];
  out = out.concat(QUESTIONS.filter(function(x){ return x.pid === pid; }));
  return out;
}
function startExam(){
  var qs = buildExam();
  SES = {mode:"exam", ids:qs.map(function(x){return x.id;}), i:0, ans:{},
         ends:Date.now()+90*60*1000, done:false};
  S.live = SES; save();
  go("run");
}
function resumeExam(){ SES = S.live; go("run"); }
function startOriginal(){
  var ids = ["org-1a","org-1b","org-2","org-3a","org-3b","org-3c","org-3d"]
    .filter(function(id){ return byId(id); });
  SES = {mode:"practice", topic:"original", ids:ids, i:0, ans:{}, done:false};
  go("run");
}

function answer(pos){
  var qq = byId(SES.ids[SES.i]);
  /* In der Übung zählt die erste Antwort; in der Simulation darf man sie ändern. */
  if(SES.mode !== "exam" && SES.ans[qq.id] !== undefined) return;
  SES.ans[qq.id] = pos;
  if(SES.mode !== "exam"){
    var r = rec(qq.id);
    r.n++;
    if(pos === qq.ans){ r.ok++; r.streak++; } else { r.streak = 0; r.wrong++; }
    save();
  } else { S.live = SES; save(); }
  render();
}
function next(){
  if(SES.i < SES.ids.length-1){ SES.i++; render(); }
  else finish();
}
function prev(){ if(SES.i>0){ SES.i--; render(); } }

function finish(){
  SES.done = true;
  if(SES.mode === "exam"){
    var right = 0, pts = 0;
    SES.ids.forEach(function(id){
      var qq = byId(id), given = SES.ans[id], r = rec(id);
      r.n++;
      if(given === qq.ans){ right++; pts += (PUNKTE[qq.topic] || 1); r.ok++; r.streak++; }
      else { r.streak = 0; r.wrong++; }
    });
    SES.points = pts;
    SES.right = right;
    S.exams.push({at:Date.now(), points:pts, right:right, of:SES.ids.length});
    S.live = null;
  }
  save();
  render();
}

function go(v){ VIEW = v; window.scrollTo(0,0); render(); }

function renderChrome(){
  var d = daysLeft();
  document.getElementById("hcount").innerHTML =
      d > 1  ? "<b>noch "+d+" Tage</b><span class=\"upto\"> bis zum Test</span>"
    : d === 1? "<b>morgen</b><span class=\"upto\"> ist der Test</span>"
    : d === 0? "<b>heute</b><span class=\"upto\"> ist der Test</span>"
    :          "<b>Viel Erfolg.</b>";

  var nw = wrongPool().length;
  document.getElementById("tabs").innerHTML = TABS.map(function(t){
    var cur = (VIEW===t.id || (VIEW==="run" && t.id==="ueben"));
    return '<button onclick="go(\''+t.id+'\')" aria-current="'+(cur?"true":"false")+'">'+t.n+
      (t.id==="fehler" && nw ? '<span class="pill">'+nw+'</span>' : '')+'</button>';
  }).join("");
}

function render(){
  renderChrome();
  var v = document.getElementById("view");
  if(TICK){ clearInterval(TICK); TICK = null; }
  if(VIEW==="run" && SES && !SES.done) v.innerHTML = viewRun();
  else if(VIEW==="run" && SES && SES.done) v.innerHTML = viewResult();
  else if(VIEW==="ueben")    v.innerHTML = viewUeben();
  else if(VIEW==="pruefung") v.innerHTML = viewPruefung();
  else if(VIEW==="fehler")   v.innerHTML = viewFehler();
  else if(VIEW==="wissen")   v.innerHTML = viewWissen();
  else                       v.innerHTML = viewStart();

  if(VIEW==="run" && SES && !SES.done && SES.mode==="exam") TICK = setInterval(tickExam, 1000);
}

function tickExam(){
  var el = document.getElementById("timer");
  if(!el || !SES || SES.done){ clearInterval(TICK); TICK=null; return; }
  var left = Math.round((SES.ends - Date.now())/1000);
  if(left <= 0){ clearInterval(TICK); TICK=null; finish(); return; }
  el.textContent = mmss(left);
  el.className = "timer" + (left < 300 ? " low" : "");
}

  /* Reihenfolge wie in TOPICS: die vier Prüfungsblöcke zuerst. */
  var sorted = THEORIE.slice().sort(function(a,b){
    return TOPICS.findIndex(function(t){return t.id===a.topic;}) -
           TOPICS.findIndex(function(t){return t.id===b.topic;});
  });
  var body = "", group = "";
  sorted.forEach(function(t){
    var g = (TOPIC_BY[t.topic]||{}).g || "Weitere";
    if(g !== group){
      group = g;
      body += '<p class="eyebrow" style="margin:1.4rem 0 .5rem">'+group+'</p>';
    }
    var items = t.items.map(function(it){ return '<dt>'+it[0]+'</dt><dd>'+it[1]+'</dd>'; }).join("");
    body += '<details class="th"><summary>'+t.title+'</summary>'+
      '<div class="thbody"><dl>'+items+'</dl>'+
      '<div class="row" style="margin-top:1rem"><button class="btn ghost" onclick="startPractice(\''+t.topic+'\')">Dazu üben</button></div>'+
      '</div></details>';
  });

  return '<div class="stack"><section><h2>Crashkurs</h2>'+
    '<p class="lead">Alles, was ohne Taschenrechner im Kopf verfügbar sein muss. '+
    'Die vier Blöcke unter „Prüfungsrelevant“ decken die Originalklausur vollständig ab — wenn die Zeit knapp ist, lies nur diese.</p>'+
    '<div style="margin-top:.4rem">'+body+'</div></section>'+footer();
}

/* ── Ansicht: laufende Sitzung ───────────────────────────────────────── */
function viewRun(){
  var qq = byId(SES.ids[SES.i]);
  var order = arrange(qq);
  var given = SES.ans[qq.id];
  var revealed = (SES.mode !== "exam") && given !== undefined;

  var opts = order.map(function(orig, k){
    var letter = "ABCDE".charAt(k), cls = "opt";
    if(revealed){
      if(orig === qq.ans) cls += " right";
      else if(orig === given) cls += " wrong";
    }
    var pressed = (given === orig) ? "true" : "false";
    return '<button class="'+cls+'" aria-pressed="'+pressed+'" onclick="answer('+orig+')"'+
      (revealed?' disabled':'')+'>'+
      '<span class="k">'+letter+'</span><span>'+qq.opts[orig]+'</span></button>';
  }).join("");

  var pas = qq.pid && PASSAGES[qq.pid] ? '<div class="passage"><h3>'+PASSAGES[qq.pid].title+'</h3>'+
      PASSAGES[qq.pid].text.split("\n\n").map(function(p){ return '<p>'+p+'</p>'; }).join("")+'</div>' : '';

  var verdict = "";
  if(revealed){
    var ok = given === qq.ans;
    verdict = '<div class="verdict '+(ok?"ok":"no")+'">'+
      '<span class="tag">'+(ok?"Richtig":"Falsch — richtig ist "+ "ABCDE".charAt(order.indexOf(qq.ans)))+'</span>'+
      '<div class="exp">'+qq.exp+'</div></div>';
  }

  var label = SES.topic==="original" ? "Originalklausur 2022"
            : SES.mode==="exam" ? "Prüfungssimulation"
            : SES.mode==="review" ? "Fehlerarchiv"
            : TOPIC_BY[qq.topic].n;
  var wert = PUNKTE[qq.topic];
  var wertBadge = (SES.mode==="exam" && wert) ? '<span class="pts">'+wert+' P.</span>' : '';

  var timer = SES.mode==="exam"
    ? '<span id="timer" class="timer">'+mmss(Math.round((SES.ends-Date.now())/1000))+'</span>' : '';

  var lastQ = SES.i === SES.ids.length-1;
  var nextBtn = SES.mode==="exam"
    ? (lastQ ? '<button class="btn" onclick="confirmFinish()">Abgeben</button>'
             : '<button class="btn'+(given===undefined?' ghost':'')+'" onclick="next()">Weiter</button>')
    : '<button class="btn" onclick="next()"'+(given===undefined?' disabled':'')+'>'+(lastQ?"Auswerten":"Weiter")+'</button>';

  var answered = Object.keys(SES.ans).length;

  return '<div class="stack">'+
    '<div class="qhead"><span>'+label+'</span>'+wertBadge+timer+
      '<span class="prog">'+(SES.i+1)+' / '+SES.ids.length+
      (SES.mode==="exam"? ' · '+answered+' beantwortet':'')+'</span></div>'+
    '<div class="card">'+ pas +
      '<p class="qtext">'+qq.text+'</p>'+
      '<div class="opts">'+opts+'</div>'+
      verdict+
      '<div class="qfoot">'+
        (SES.i>0? '<button class="btn quiet" onclick="prev()">← Zurück</button>':'')+
        nextBtn+
        (SES.mode!=="exam"? '<button class="btn quiet" onclick="quit()">Beenden</button>':'')+
        '<span class="hint"><kbd>A</kbd>–<kbd>E</kbd> antworten · <kbd>Enter</kbd> weiter</span>'+
      '</div>'+
    '</div>'+
  '</div>';
}
function quit(){ if(SES) SES.done = true; render(); }
function confirmFinish(){
  var open = SES.ids.length - Object.keys(SES.ans).length;
  if(open && !confirm(open+" Aufgaben sind noch unbeantwortet. Trotzdem abgeben?")) return;
  finish();
}

/* ── Ansicht: Auswertung ─────────────────────────────────────────────── */
function viewResult(){
  var ids = SES.ids.filter(function(id){ return SES.ans[id]!==undefined || SES.mode==="exam"; });
  var right = ids.filter(function(id){ return SES.ans[id] === byId(id).ans; }).length;
  var pts = SES.mode==="exam" ? SES.points : Math.round(right/Math.max(1,ids.length)*100);

  var rows = ids.map(function(id){
    var qq = byId(id), given = SES.ans[id], ok = given === qq.ans;
    var order = arrange(qq);
    var line = ok ? '<i>'+qq.opts[qq.ans]+'</i>'
      : (given===undefined ? '<s>nicht beantwortet</s> → <i>'+qq.opts[qq.ans]+'</i>'
         : '<s>'+qq.opts[given]+'</s> → <i>'+qq.opts[qq.ans]+'</i>');
    return '<div class="rev"><span class="mk '+(ok?"ok":"no")+'">'+(ok?"✓":"✗")+'</span>'+
      '<span><span class="q">'+qq.text.replace(/<pre[\s\S]*?<\/pre>/g," …")+'</span>'+
      '<span class="a">'+line+'</span>'+
      (!ok? '<div class="exp" style="margin-top:.35rem">'+qq.exp+'</div>':'')+
      '</span></div>';
  }).join("");

  var quote = SES.mode==="exam" ? Math.round(pts/GESAMT*100) : pts;
  var verdictText = SES.mode==="exam"
    ? (pts>=18 ? "Das trägt. Halte das Niveau und arbeite nur noch das Fehlerarchiv ab."
      : pts>=12 ? "Solide Basis. Schau dir an, welche der drei Aufgaben dich Punkte gekostet hat — dort liegt der ganze Rest."
      : "Noch Luft nach oben. Die Ableitung allein ist 8 Punkte wert und rein handwerklich: Nimm dir den Crashkurs Ableitungen vor und übe den Block am Stück.")
    : "Alles Falsche liegt jetzt im Fehlerarchiv und kommt automatisch wieder — es verschwindet erst nach zwei richtigen Antworten in Folge.";

  return '<div class="stack">'+
    '<section class="hero">'+
      '<p class="eyebrow">'+(SES.mode==="exam"?"Simulation abgeschlossen":"Runde abgeschlossen")+'</p>'+
      '<div class="score" style="margin-top:.5rem"><b>'+pts+'</b><span>'+(SES.mode==="exam"?"von "+GESAMT+" Punkten":"% richtig")+' · '+right+' von '+ids.length+' Aufgaben</span></div>'+
      '<div class="meter'+(quote>=60?' good':'')+'" style="margin-top:.9rem"><i style="width:'+quote+'%"></i></div>'+
      '<p class="lead">'+verdictText+'</p>'+
      '<div class="row" style="margin-top:1rem">'+
        '<button class="btn" onclick="go(\'start\')">Zur Übersicht</button>'+
        (wrongPool().length? '<button class="btn ghost" onclick="startReview()">Fehler wiederholen</button>':'')+
      '</div>'+
    '</section>'+
    '<section><p class="eyebrow" style="margin-bottom:.3rem">Durchsicht</p>'+
      '<div class="card" style="padding-top:.2rem">'+rows+'</div></section>'+
    footer();
}

/* ── Fuß ─────────────────────────────────────────────────────────────── */
function footer(){
  var st = statOf(QUESTIONS);
  return '<div class="foot"><span>'+QUESTIONS.length+' Aufgaben · '+Object.keys(PASSAGES).length+' englische Fachtexte · Fortschritt lokal im Browser gespeichert</span>'+
    '<span style="margin-left:auto">'+st.seen+' bearbeitet</span>'+
    '<button class="btn quiet" onclick="resetAll()">Zurücksetzen</button></div>';
}
function resetAll(){
  if(!confirm("Gesamten Fortschritt löschen?")) return;
  S = {seen:{}, exams:[], plan:{}, live:null}; save(); go("start");
}

/* ── Tastatur ────────────────────────────────────────────────────────── */
document.addEventListener("keydown", function(e){
  if(VIEW!=="run" || !SES || SES.done) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  var qq = byId(SES.ids[SES.i]);
  var k = e.key.toUpperCase();
  var pos = "ABCDE".indexOf(k);
  if(pos<0 && /^[1-5]$/.test(k)) pos = +k - 1;
  if(pos >= 0 && pos < qq.opts.length){
    e.preventDefault();
    answer(arrange(qq)[pos]);
  } else if(e.key === "Enter"){
    e.preventDefault();
    if(SES.mode==="exam" || SES.ans[qq.id]!==undefined) next();
  } else if(e.key === "ArrowLeft"){ prev(); }
});

/* ── Start ───────────────────────────────────────────────────────────── */
if(S.live && S.live.ends > Date.now()){ /* laufende Simulation bleibt in der Prüfungsansicht abrufbar */ }
else if(S.live){ S.live = null; save(); }
render();

</script>
