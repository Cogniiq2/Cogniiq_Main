<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annahmetest Garching</title>
<style>
:root{
  --paper:#FAFAFB; --card:#FFFFFF; --raise:#F2F4F7;
  --ink:#14171C; --ink-2:#5A6270; --ink-3:#878E9B;
  --line:#E2E5EA; --line-2:#CFD5DE;
  --accent:#1E5FA8; --accent-ink:#1E5FA8; --accent-soft:#EBF2FA; --accent-line:#B9D2EC;
  --good:#14804A; --good-soft:#E8F4ED; --good-line:#A7D5BC;
  --bad:#AF261E; --bad-soft:#FBECEA; --bad-line:#EBB7B2;
  --warn:#8A5A00;
  --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(20,23,28,.05), 0 6px 18px -10px rgba(20,23,28,.18);
  --display:"Iowan Old Style",Georgia,ui-serif,serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1216; --card:#161A20; --raise:#1D222A;
    --ink:#E9EBEF; --ink-2:#98A1AF; --ink-3:#79828F;
    --line:#262C35; --line-2:#333B46;
    --accent:#7FB3EE; --accent-ink:#9CC6F5; --accent-soft:#15263A; --accent-line:#2C4666;
    --good:#5FD096; --good-soft:#10261C; --good-line:#265C41;
    --bad:#F08A82; --bad-soft:#2A1614; --bad-line:#5E2A25;
    --warn:#D9A441;
    --on-accent:#0F1216;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1216; --card:#161A20; --raise:#1D222A;
  --ink:#E9EBEF; --ink-2:#98A1AF; --ink-3:#79828F;
  --line:#262C35; --line-2:#333B46;
  --accent:#7FB3EE; --accent-ink:#9CC6F5; --accent-soft:#15263A; --accent-line:#2C4666;
  --good:#5FD096; --good-soft:#10261C; --good-line:#265C41;
  --bad:#F08A82; --bad-soft:#2A1614; --bad-line:#5E2A25;
  --warn:#D9A441;
  --on-accent:#0F1216;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px -10px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.6;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:var(--display); font-weight:600; text-wrap:balance; margin:0; letter-spacing:-.01em}
code,kbd,.mono{font-family:var(--mono)}
code{font-size:.94em; background:var(--raise); padding:.08em .34em; border-radius:4px}
pre.code{
  font-family:var(--mono); font-size:.86rem; line-height:1.55; background:var(--raise);
  border:1px solid var(--line); border-radius:var(--r); padding:.7rem .85rem; margin:.7rem 0 0;
  overflow-x:auto; white-space:pre; color:var(--ink);
}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}

/* ── chrome ─────────────────────────────────────────── */
header.bar{
  position:sticky; top:0; z-index:30; background:var(--paper);
  border-bottom:1px solid var(--line);
}
.bar-in{
  max-width:52rem; margin:0 auto; padding:.55rem 1.1rem;
  display:flex; align-items:center; gap:.9rem;
}
.brand{font-family:var(--display); font-size:1.02rem; font-weight:600; white-space:nowrap}
.brand span{color:var(--ink-3); font-family:var(--mono); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; margin-left:.5rem}
.count{
  margin-left:auto; font-family:var(--mono); font-size:.75rem; letter-spacing:.02em;
  color:var(--ink-2); text-align:right; min-width:0; line-height:1.35;
}
.count b{color:var(--accent-ink); font-weight:600; white-space:nowrap}
nav.tabs{
  max-width:52rem; margin:0 auto; padding:0 1.1rem; display:flex; gap:.15rem; overflow-x:auto;
  scrollbar-width:none;
}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  padding:.5rem .62rem .62rem; font-size:.86rem; color:var(--ink-2);
  border-bottom:2px solid transparent; white-space:nowrap;
}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-current="true"]{color:var(--ink); border-bottom-color:var(--accent); font-weight:500}
nav.tabs .pill{
  font-family:var(--mono); font-size:.68rem; background:var(--bad-soft); color:var(--bad);
  border:1px solid var(--bad-line); border-radius:20px; padding:0 .32rem; margin-left:.3rem;
}
main{max-width:52rem; margin:0 auto; padding:1.6rem 1.1rem 5rem}

/* ── building blocks ────────────────────────────────── */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:1.1rem 1.15rem}
.stack{display:flex; flex-direction:column; gap:1rem}
.row{display:flex; align-items:center; gap:.6rem; flex-wrap:wrap}
.eyebrow{
  font-family:var(--mono); font-size:.7rem; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-3);
}
.lead{color:var(--ink-2); margin:.35rem 0 0; max-width:60ch}
.btn{
  display:inline-flex; align-items:center; gap:.4rem; padding:.55rem .95rem; border-radius:8px;
  background:var(--accent); color:var(--on-accent); font-size:.9rem; font-weight:500;
  border:1px solid var(--accent);
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line-2)}
.btn.ghost:hover{background:var(--raise); filter:none}
.btn.quiet{background:transparent; color:var(--ink-2); border-color:transparent; padding-inline:.4rem}
.btn.quiet:hover{color:var(--ink); background:var(--raise)}
.btn[disabled]{opacity:.45; cursor:not-allowed; filter:none}

.meter{height:5px; background:var(--line); border-radius:3px; overflow:hidden}
.meter i{display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .35s ease}
.meter.good i{background:var(--good)}

/* ── dashboard ──────────────────────────────────────── */
.hero{
  border:1px solid var(--line); border-radius:var(--r); background:var(--card);
  padding:1.35rem 1.25rem; box-shadow:var(--shadow);
}
.hero h1{font-size:1.75rem; line-height:1.2}
.dday{
  display:flex; align-items:baseline; gap:.55rem; font-family:var(--mono);
  margin-top:.9rem; padding-top:.9rem; border-top:1px solid var(--line);
}
.dday b{font-size:2.1rem; font-weight:600; color:var(--accent-ink); line-height:1; font-variant-numeric:tabular-nums}
.dday span{font-size:.8rem; color:var(--ink-2)}
.facts{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr)); gap:.1rem;
  margin-top:1rem; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--line);
}
.fact{background:var(--card); padding:.65rem .8rem}
.fact dt{font-family:var(--mono); font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
.fact dd{margin:.15rem 0 0; font-size:.92rem; font-weight:500}

.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(13rem,1fr)); gap:.75rem}
.tile{
  text-align:left; background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:.9rem 1rem; display:flex; flex-direction:column; gap:.25rem; transition:border-color .15s;
}
.tile:hover{border-color:var(--accent-line)}
.tile strong{font-size:1rem; font-weight:600}
.tile em{font-style:normal; color:var(--ink-2); font-size:.83rem}
.tile .big{font-family:var(--mono); font-size:1.45rem; color:var(--accent-ink); font-variant-numeric:tabular-nums}

/* topic + plan lists */
.list{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--card)}
.item{
  display:grid; grid-template-columns:1fr auto; gap:.2rem .8rem; align-items:center;
  padding:.7rem .9rem; border-top:1px solid var(--line); text-align:left; width:100%;
}
.item:first-child{border-top:none}
.item:hover{background:var(--raise)}
.item .nm{font-weight:500; font-size:.94rem}
.item .sub{grid-column:1/2; font-size:.78rem; color:var(--ink-3); font-family:var(--mono)}
.item .pct{font-family:var(--mono); font-size:.82rem; color:var(--ink-2); font-variant-numeric:tabular-nums}
.item .bar{grid-column:1/-1; margin-top:.3rem}

.plan{list-style:none; margin:0; padding:0}
.plan li{display:flex; gap:.75rem; padding:.75rem .9rem; border-top:1px solid var(--line); align-items:flex-start}
.plan li:first-child{border-top:none}
.plan .day{
  font-family:var(--mono); font-size:.68rem; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-3); min-width:4.4rem; padding-top:.15rem;
}
.plan .what{font-size:.9rem}
.plan .what b{font-weight:600}
.plan .what p{margin:.15rem 0 0; color:var(--ink-2); font-size:.83rem}
.plan li.now{background:var(--accent-soft)}
.plan li.now .day{color:var(--accent-ink)}
.plan li.ok .what b,.plan li.ok .what p{color:var(--ink-3)}
.plan .tick{
  margin-left:auto; align-self:center; flex:none; width:1.5rem; height:1.5rem; border-radius:50%;
  border:1px solid var(--line-2); color:var(--good); font-size:.8rem; line-height:1;
  display:grid; place-items:center; background:var(--card);
}
.plan .tick:hover{border-color:var(--good)}
.plan .tick[aria-pressed="true"]{background:var(--good-soft); border-color:var(--good-line)}

/* ── question view ──────────────────────────────────── */
.qhead{
  display:flex; align-items:center; gap:.7rem; margin-bottom:.9rem;
  font-family:var(--mono); font-size:.74rem; color:var(--ink-3); letter-spacing:.04em;
}
.qhead .prog{margin-left:auto; font-variant-numeric:tabular-nums}
.qhead .timer{color:var(--ink-2); font-variant-numeric:tabular-nums}
.qhead .timer.low{color:var(--bad); font-weight:600}
.passage{
  background:var(--raise); border:1px solid var(--line); border-radius:var(--r);
  padding:1rem 1.1rem; margin-bottom:.9rem; max-height:19rem; overflow-y:auto;
}
.passage h3{font-size:.98rem; margin-bottom:.5rem}
.passage p{margin:0 0 .7rem; font-size:.9rem; line-height:1.65; color:var(--ink)}
.passage p:last-child{margin-bottom:0}
.qtext{font-size:1.08rem; line-height:1.5; margin:0 0 1rem; font-weight:500; text-wrap:pretty}
.opts{display:flex; flex-direction:column; gap:.45rem}
.opt{
  display:grid; grid-template-columns:1.55rem 1fr; gap:.6rem; align-items:start; text-align:left;
  padding:.68rem .8rem; border:1px solid var(--line); border-radius:8px; background:var(--card);
  font-size:.94rem; line-height:1.45; transition:border-color .12s, background .12s;
}
.opt:hover:not([disabled]){border-color:var(--accent-line); background:var(--accent-soft)}
.opt .k{
  font-family:var(--mono); font-size:.78rem; color:var(--ink-3); border:1px solid var(--line-2);
  border-radius:4px; width:1.45rem; height:1.45rem; display:grid; place-items:center; margin-top:.02rem;
}
.opt[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.opt[aria-pressed="true"] .k{border-color:var(--accent); color:var(--accent-ink)}
.opt.right{border-color:var(--good-line); background:var(--good-soft)}
.opt.right .k{border-color:var(--good); color:var(--good)}
.opt.wrong{border-color:var(--bad-line); background:var(--bad-soft)}
.opt.wrong .k{border-color:var(--bad); color:var(--bad)}
.opt[disabled]{cursor:default}

.verdict{margin-top:1rem; border-left:3px solid var(--line-2); padding:.15rem 0 .15rem .9rem}
.verdict.ok{border-left-color:var(--good)}
.verdict.no{border-left-color:var(--bad)}
.verdict .tag{font-family:var(--mono); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase}
.verdict.ok .tag{color:var(--good)}
.verdict.no .tag{color:var(--bad)}
.verdict p{margin:.25rem 0 0; font-size:.9rem; color:var(--ink-2); line-height:1.6}
.exp{font-size:.9rem; color:var(--ink-2); line-height:1.65}
.exp p{margin:.5rem 0 0}
.exp p:first-child{margin-top:.3rem}
.exp ol{margin:.55rem 0 0; padding-left:1.35rem; display:flex; flex-direction:column; gap:.42rem}
.exp li{padding-left:.1rem}
.exp b{color:var(--ink); font-weight:600}
.exp code{color:var(--ink); font-size:.92em}
.pts{
  font-family:var(--mono); font-size:.68rem; color:var(--accent-ink);
  background:var(--accent-soft); border:1px solid var(--accent-line);
  border-radius:20px; padding:.05rem .42rem;
}
.orig{
  display:block; font-family:var(--mono); font-size:.68rem; letter-spacing:.07em;
  text-transform:uppercase; color:var(--accent-ink); margin-bottom:.6rem; font-weight:500;
}
.qfoot{display:flex; align-items:center; gap:.6rem; margin-top:1.2rem; flex-wrap:wrap}
.hint{font-family:var(--mono); font-size:.72rem; color:var(--ink-3); margin-left:auto}
.hint kbd{border:1px solid var(--line-2); border-radius:3px; padding:0 .25rem; font-size:.95em}

/* ── results ────────────────────────────────────────── */
.score{display:flex; align-items:baseline; gap:.6rem; font-family:var(--mono)}
.score b{font-size:2.6rem; font-weight:600; line-height:1; font-variant-numeric:tabular-nums}
.score span{color:var(--ink-2); font-size:.85rem}
.rev{border-top:1px solid var(--line); padding:.7rem 0; display:grid; grid-template-columns:1.4rem 1fr; gap:.6rem}
.rev .mk{font-family:var(--mono); font-size:.8rem}
.rev .mk.ok{color:var(--good)} .rev .mk.no{color:var(--bad)}
.rev .q{font-size:.9rem; font-weight:500}
.rev .a{font-size:.83rem; color:var(--ink-2); margin-top:.15rem}
.rev .a i{font-style:normal; color:var(--good)}
.rev .a s{color:var(--bad); text-decoration-color:var(--bad-line)}

/* ── theory ─────────────────────────────────────────── */
details.th{border:1px solid var(--line); border-radius:var(--r); background:var(--card); overflow:hidden}
details.th+details.th{margin-top:.5rem}
details.th summary{
  padding:.75rem .95rem; cursor:pointer; font-weight:500; font-size:.96rem;
  display:flex; align-items:center; gap:.6rem; list-style:none;
}
details.th summary::-webkit-details-marker{display:none}
details.th summary::after{content:"+"; margin-left:auto; font-family:var(--mono); color:var(--ink-3)}
details.th[open] summary::after{content:"−"}
details.th[open] summary{border-bottom:1px solid var(--line)}
.thbody{padding:.3rem .95rem 1rem}
.thbody dl{margin:0}
.thbody dt{font-weight:600; font-size:.9rem; margin-top:.9rem}
.thbody dd{margin:.15rem 0 0; font-size:.89rem; color:var(--ink-2); line-height:1.62}
.thbody dd code{color:var(--ink)}

.empty{text-align:center; padding:2.5rem 1rem; color:var(--ink-2)}
.empty p{max-width:34ch; margin:.4rem auto 0; font-size:.9rem}
.foot{margin-top:2.5rem; padding-top:1rem; border-top:1px solid var(--line); font-size:.78rem; color:var(--ink-3); display:flex; gap:.8rem; flex-wrap:wrap; align-items:center}
.foot a{color:var(--ink-2)}

@media (max-width:430px){
  .count .upto{display:none}
  .brand span{display:none}
}
@media (max-width:560px){
  .hero h1{font-size:1.45rem}
  main{padding-top:1.1rem}
  .qtext{font-size:1rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>

<header class="bar">
  <div class="bar-in">
    <div class="brand">Annahmetest <span>Garching</span></div>
    <div class="count" id="hcount"></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="view"></main>

<script>
var QUESTIONS=[], PASSAGES={}, THEORIE=[];
function q(id,topic,diff,text,opts,ans,exp,pid){
  QUESTIONS.push({id:id,topic:topic,diff:diff,text:text,opts:opts,ans:ans,exp:exp,pid:pid||null});
}
function passage(id,title,text){ PASSAGES[id]={id:id,title:title,text:text}; }
function theorie(topic,title,items){ THEORIE.push({topic:topic,title:title,items:items}); }
// Algebra, Gleichungen, Ungleichungen | Potenzen, Wurzeln, Logarithmen
q("alg-01","algebra",1,"Welche Lösungsmenge hat <code>x² − 5x + 6 = 0</code>?",
 ["{2; 3}","{−2; −3}","{1; 6}","{−1; −6}","{2; −3}"],0,
 "Vieta: gesucht sind zwei Zahlen mit Summe 5 und Produkt 6 → 2 und 3. Kein Umweg über die p-q-Formel nötig.");

q("alg-02","algebra",1,"Welche Lösungen hat <code>x² + 4x − 12 = 0</code>?",
 ["x = 2 und x = −6","x = −2 und x = 6","x = 3 und x = −4","x = 4 und x = −3","x = 1 und x = −12"],0,
 "Summe der Lösungen = −4, Produkt = −12 → 2 und −6. Probe: 2 + (−6) = −4 ✓, 2 · (−6) = −12 ✓.");

q("alg-03","algebra",1,"<code>(3a − 2b)²</code> ist gleich",
 ["9a² − 12ab + 4b²","9a² − 6ab + 4b²","9a² − 12ab − 4b²","3a² − 12ab + 2b²","9a² + 4b²"],0,
 "Binomische Formel: (u−v)² = u² − 2uv + v² mit u = 3a, v = 2b. Der Mischterm ist 2 · 3a · 2b = 12ab.");

q("alg-04","algebra",1,"Für <code>x ≠ 3</code> lässt sich <code>(x² − 9)/(x − 3)</code> vereinfachen zu",
 ["x + 3","x − 3","x² + 3","3x","1"],0,
 "Zähler ist die dritte binomische Formel: (x−3)(x+3). Der Faktor (x−3) kürzt sich.");

q("alg-05","algebra",2,"Das Gleichungssystem <code>2x + 3y = 12</code> und <code>x − y = 1</code> hat die Lösung",
 ["x = 3, y = 2","x = 2, y = 3","x = 4, y = 3","x = 5, y = 4","x = 1, y = 0"],0,
 "Aus der zweiten Gleichung x = y + 1, eingesetzt: 2(y+1) + 3y = 12 → 5y = 10 → y = 2, x = 3.");

q("alg-06","algebra",1,"Die Ungleichung <code>3 − 2x > 7</code> ist erfüllt für",
 ["x < −2","x > −2","x < 2","x > 2","x < −5"],0,
 "−2x > 4, dann durch −2 teilen — dabei dreht sich das Ungleichheitszeichen: x < −2.");

q("alg-07","algebra",2,"Wie groß ist die Summe aller Lösungen von <code>|2x − 6| = 4</code>?",
 ["6","4","10","2","0"],0,
 "2x − 6 = 4 → x = 5; 2x − 6 = −4 → x = 1. Summe 6. (Kurz: die Lösungen liegen symmetrisch um x = 3.)");

q("alg-08","algebra",2,"Welchen Wert hat x in <code>1/x + 1/(2x) = 3</code>?",
 ["1/2","1/3","2","3","2/3"],0,
 "Linke Seite zusammenfassen: 2/(2x) + 1/(2x) = 3/(2x). Also 3/(2x) = 3 → 2x = 1 → x = 1/2.");

q("alg-09","algebra",3,"Wie viele reelle Lösungen hat <code>√(x + 7) = x − 5</code>?",
 ["genau eine","genau zwei","keine","unendlich viele","genau drei"],0,
 "Quadrieren: x + 7 = x² − 10x + 25 → x² − 11x + 18 = 0 → x = 9 oder x = 2. Probe: x = 2 liefert √9 = 3 ≠ −3, ist also Scheinlösung. Nur x = 9 bleibt.");

q("alg-10","algebra",2,"<code>x³ − x</code> vollständig faktorisiert ergibt",
 ["x(x − 1)(x + 1)","x(x² + 1)","(x − 1)(x + 1)","x²(x − 1)","x(x − 1)²"],0,
 "Erst x ausklammern: x(x² − 1), dann dritte binomische Formel auf x² − 1 anwenden.");

q("alg-11","algebra",2,"Der Scheitelpunkt der Parabel <code>y = x² − 6x + 5</code> liegt bei",
 ["(3 | −4)","(−3 | −4)","(3 | 4)","(6 | 5)","(−3 | 14)"],0,
 "Quadratische Ergänzung: x² − 6x + 9 − 9 + 5 = (x−3)² − 4. Oder: x_S = −b/(2a) = 6/2 = 3, dann y einsetzen.");

q("alg-12","algebra",2,"Für welche Werte von k hat <code>x² + kx + 9 = 0</code> genau eine reelle Lösung?",
 ["k = 6 oder k = −6","k = 3 oder k = −3","k = 9","k = 0","k = 18"],0,
 "Genau eine Lösung ⇔ Diskriminante null: k² − 4·1·9 = 0 → k² = 36 → k = ±6.");

q("alg-13","algebra",3,"Wenn <code>x + 1/x = 3</code>, welchen Wert hat dann <code>x² + 1/x²</code>?",
 ["7","9","6","11","3"],0,
 "Quadrieren: (x + 1/x)² = x² + 2 + 1/x² = 9. Also x² + 1/x² = 9 − 2 = 7.");

q("alg-14","algebra",1,"Die Summe der Lösungen von <code>2x² − 8x + 6 = 0</code> beträgt",
 ["4","8","3","−4","6"],0,
 "Vieta: Summe = −b/a = 8/2 = 4. (Die Lösungen sind 1 und 3.)");

q("alg-15","algebra",1,"<code>(2/3) : (4/9)</code> ergibt",
 ["3/2","8/27","2/3","4/9","1/6"],0,
 "Division durch einen Bruch = Multiplikation mit dem Kehrwert: (2/3)·(9/4) = 18/12 = 3/2.");

q("alg-16","algebra",2,"Löst man <code>A = P · (1 + r)</code> nach r auf, erhält man",
 ["r = A/P − 1","r = A/P + 1","r = (A − 1)/P","r = P/A − 1","r = A − P"],0,

passage("p1","Platform Economics",
`Two decades ago, the most valuable companies in the world owned factories, pipelines and fleets. Today many of them own almost nothing physical at all. What they own is a platform: a piece of infrastructure that lets other people transact with each other, and a set of rules governing how those transactions happen.

The economics of platforms are unusual because of network effects. A telephone is useless if nobody else has one, mildly useful if a hundred people do, and indispensable once everybody does. Value grows with the number of participants rather than with the number of units produced. This creates a striking asymmetry: the first years of a platform are brutally difficult, because there is nothing to attract users except the promise of users who have not yet arrived. Economists call this the cold-start problem, and most platforms die of it.

Those that survive tend to enjoy a period of extraordinary returns, since each additional user makes the service more attractive to the next one. But the same dynamic that builds a platform can trap it. Because users cluster where other users already are, markets tip toward a single dominant provider, and dominance invites regulatory attention. The very network effects that once looked like a defensible advantage become, in the language of competition authorities, a barrier to entry.

A further complication is that platform operators are not neutral. They set fees, rank results and decide which sellers are visible. Increasingly they also compete with the very sellers who depend on them — a conflict that regulators in Brussels and Washington have begun to treat as structural rather than incidental.`);

 "p1");

passage("p2","The Limits of Measurement",
`In 1975 the British economist Charles Goodhart made an observation about monetary policy that has since escaped its original field entirely. When a measure becomes a target, he noted, it ceases to be a good measure. The principle now bears his name, and examples of it are easy to find wherever institutions try to manage what they cannot directly observe.

Consider a hospital judged by the length of time patients wait in the emergency department. The metric is a reasonable proxy for quality of care: shorter waits generally mean better staffing and smoother processes. But once funding depends on it, administrators acquire an interest in the number itself rather than in what the number was meant to represent. Patients may be admitted to a ward prematurely to stop the clock, or triaged in ways that improve the average while leaving the sickest no better off.

None of this requires dishonesty. Goodhart's law operates through ordinary, rational responses to incentives, which is precisely what makes it so difficult to design around. Adding more metrics rarely helps, since each new target invites its own distortions, and a dashboard of twenty numbers is no more faithful than a dashboard of one.

The uncomfortable conclusion is that measurement and management stand in unavoidable tension. Numbers are indispensable for running large organisations, yet the act of relying on them changes the behaviour they were meant to describe. The practical response is not to abandon measurement but to hold it loosely: to treat metrics as evidence requiring interpretation rather than as verdicts requiring compliance.`);

passage("p3","Why Software Projects Run Late",
`Frederick Brooks, who managed the development of IBM's OS/360 operating system, drew a conclusion from that troubled project which has proved remarkably durable: adding manpower to a late software project makes it later. The reasoning is straightforward. New members must be trained, which consumes the time of the people who are already productive, and the number of communication channels within a team grows faster than the team itself. A group of three people has three pairs to coordinate; a group of twelve has sixty-six.

Brooks was careful about the scope of his claim. Work that can be cleanly partitioned — harvesting a field, say — does scale with the number of workers. Software rarely partitions cleanly, because the components interact and the interactions must be negotiated between the people who own them. Where coordination dominates, extra hands add more cost than capacity.

Later research complicated the picture without overturning it. Studies of open-source projects found that some very large teams remain productive, but they tend to be organised into small, loosely coupled units with stable interfaces between them, so that most work requires no negotiation at all. In other words, the projects that scale are those that have engineered their communication requirements downward rather than simply accepting them.

That reframing matters. Brooks's law is often quoted as an argument against hiring, which was never the point. It is an argument about architecture: the structure of a system and the structure of the organisation that builds it are two descriptions of the same thing.`);

passage("p4","Data and Consent",
`The standard mechanism for protecting personal data online is notice and consent: a service explains what it collects, and the user agrees. The arrangement has an appealing logic. It respects autonomy, it is cheap to implement, and it places the decision with the person whose data is at stake.

It also fails in practice, for reasons that are now well documented. One study estimated that reading the privacy policies encountered by an average user in a single year would take roughly 200 hours. Consent obtained under those conditions is formally valid and substantively empty. Worse, the disclosures that matter least — the boilerplate about cookies — are the ones users see most often, while genuinely consequential transfers happen further down a supply chain the user never encounters.

There is also a structural problem that no amount of clearer wording can solve. Data about one person is frequently informative about others. A user who discloses their own genome discloses a great deal about their siblings, who were never asked. Consent is individual; the consequences are collective.

Some regulators have accordingly shifted emphasis from consent to obligation: rules about what organisations may do with data regardless of what users have agreed to, including purpose limitation and data minimisation. The change is subtle but important. It moves the burden from the person least able to evaluate the risk to the party best positioned to manage it.`);

 "p4");

passage("p5","The Productivity Paradox",
`In 1987 Robert Solow remarked that the computer age could be seen everywhere except in the productivity statistics. At the time, American firms had been investing heavily in information technology for more than a decade, yet measured productivity growth had slowed rather than accelerated. The observation became known as the productivity paradox, and it has resurfaced with every subsequent wave of technology.

Three explanations compete. The first is mismeasurement: national accounts were designed for an economy of physical goods and capture improvements in quality, variety and convenience poorly. If a service becomes free but better, statistics may record a decline. The second is redistribution: some investment buys competitive position rather than output, as when two firms spend heavily to take customers from each other and the sector as a whole gains nothing.

The third, and the one that has aged best, is lag. General-purpose technologies deliver their gains only after complementary investments have been made — in skills, in processes, and above all in reorganisation. Electricity illustrates the pattern. Factories initially installed electric motors in buildings designed around a central steam engine, and saw modest returns. Only when plants were redesigned around distributed power, roughly forty years later, did productivity jump.

The lesson is not that technology fails to deliver, but that the delivery depends on organisational change that is slow, costly and easy to postpone. The bottleneck is rarely the machine.`);

 ["Binomische Formeln","(a+b)² = a² + 2ab + b² · (a−b)² = a² − 2ab + b² · (a+b)(a−b) = a² − b². Die dritte ist im Test die wertvollste — sie verwandelt jede Differenz von Quadraten in ein Produkt und kürzt Brüche sofort."],
 ["Quadratische Gleichungen","Für x² + px + q = 0: x = −p/2 ± √((p/2)² − q). Schneller ist fast immer Vieta: Summe der Lösungen = −p, Produkt = q. Bei ganzzahligen Aufgaben zwei Zahlen suchen, die passen — das geht in Sekunden statt in einer Minute."],
 ["Diskriminante","D = b² − 4ac. D > 0: zwei Lösungen · D = 0: eine · D < 0: keine reelle. Fragen nach „genau eine Lösung“ sind immer Diskriminanten-Fragen."],
 ["Scheitelpunkt","x_S = −b/(2a), y_S durch Einsetzen. a > 0 → Minimum, a < 0 → Maximum."],
 ["Ungleichungen","Multiplikation oder Division mit einer negativen Zahl dreht das Zeichen um. Bei quadratischen Ungleichungen Nullstellen bestimmen und das Vorzeichen zwischen ihnen prüfen."],
 ["Beträge","|x − a| ≤ r bedeutet a − r ≤ x ≤ a + r: alle Punkte mit Abstand höchstens r von a. So gelesen braucht man keine Fallunterscheidung."],
 ["Wurzelgleichungen","Nach dem Quadrieren zwingend die Probe machen — Quadrieren erzeugt Scheinlösungen."]
]);

theorie("potenz","Potenzen, Wurzeln, Logarithmen",[
 ["Potenzgesetze","aᵐ · aⁿ = aᵐ⁺ⁿ · aᵐ : aⁿ = aᵐ⁻ⁿ · (aᵐ)ⁿ = aᵐⁿ · a⁻ⁿ = 1/aⁿ · a⁰ = 1."],
 ["Wurzeln als Potenzen","ⁿ√(aᵐ) = a^(m/n). Bei Zahlen wie 8^(2/3) immer zuerst die Wurzel ziehen, dann potenzieren — die Zwischenwerte bleiben klein."],
 ["Logarithmusgesetze","log(ab) = log a + log b · log(a/b) = log a − log b · log(aⁿ) = n · log a. log_b(x) beantwortet die Frage „b hoch was ergibt x?“."],
 ["Exponentialgleichungen","Beide Seiten auf dieselbe Basis bringen, dann Exponenten gleichsetzen. Geht das nicht, logarithmieren."],
 ["Einschachteln statt rechnen","Ohne Taschenrechner: log₂ 6 liegt zwischen 2 und 3, weil 4 < 6 < 8. Für Auswahlaufgaben reicht das fast immer."],
 ["Auswendig","2¹ bis 2¹⁰ = 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024. Dazu 3² bis 3⁵ = 9, 27, 81, 243 und die Quadratzahlen bis 20² = 400."]
]);

theorie("prozent","Prozent, Zins & Dreisatz",[
 ["Grundformel","Prozentwert = Grundwert · Prozentsatz. Der Grundwert ist immer der Wert, auf den sich die Angabe bezieht — bei Veränderungen der <em>alte</em> Wert."],
 ["Mit Faktoren rechnen","+25 % ist · 1,25, −20 % ist · 0,8. Mehrere Änderungen werden multipliziert, niemals addiert: −20 % und −10 % ergeben zusammen −28 %."],
 ["Rückwärtsrechnen","Wenn 96 € der Preis nach 20 % Rabatt ist, gilt 96 : 0,8 = 120 €. Der häufigste Fehler ist, stattdessen 20 % auf 96 € aufzuschlagen."],
 ["Zinseszins","K_n = K₀ · (1 + p)ⁿ. 72er-Regel: Verdopplungszeit ≈ 72 : Zinssatz in Prozent."],
 ["Proportional oder umgekehrt","Mehr Arbeiter → weniger Zeit (umgekehrt proportional): Produkt konstant. Mehr Ware → mehr Preis (proportional): Quotient konstant. Vor jedem Dreisatz kurz prüfen, welcher Fall vorliegt."],
 ["Kopfrechen-Bausteine","10 %, 5 % und 1 % bilden und addieren. Brüche kennen: 12,5 % = 1/8 · 16⅔ % = 1/6 · 33⅓ % = 1/3."],
 ["Mischungen und Mittelwerte","Nie Prozentsätze mitteln — immer absolute Mengen addieren und durch die Gesamtmenge teilen. Dasselbe gilt für Geschwindigkeiten."]
]);

theorie("analysis","Analysis",[
 ["Ableitungsregeln","xⁿ → n·xⁿ⁻¹ · eˣ → eˣ · ln x → 1/x · sin x → cos x · cos x → −sin x."],
 ["Produkt- und Kettenregel","(u·v)' = u'v + uv'. Kettenregel: äußere mal innere Ableitung, z. B. e^(2x) → 2e^(2x)."],
 ["Kurvendiskussion","f'(x) = 0 → Kandidat für Extremstelle. f''(x) > 0 → Minimum, f''(x) < 0 → Maximum. f''(x) = 0 mit Vorzeichenwechsel → Wendepunkt."],
 ["Integrale","∫xⁿ dx = xⁿ⁺¹/(n+1) + C, außer n = −1: dort ∫(1/x)dx = ln|x| + C. Bestimmtes Integral: Stammfunktion an der oberen minus an der unteren Grenze."],
 ["Grenzwerte bei Brüchen","Gleicher Grad → Verhältnis der Leitkoeffizienten. Nennergrad größer → 0. Zählergrad größer → ±∞."],
 ["0/0-Situationen","Faktorisieren und kürzen, nicht einsetzen: (x²−4)/(x−2) = x + 2."],
 ["Anschaulich prüfen","Ableitung = Steigung, Integral = Fläche. Bei einfachen Funktionen ist eine Skizze schneller als die Rechnung."]
]);

theorie("geo","Geometrie & Trigonometrie",[
 ["Flächen","Dreieck ½·g·h · Trapez ½·(a+c)·h · Kreis πr² · Parallelogramm g·h."],
 ["Körper","Quader a·b·c · Zylinder πr²h · Kugel (4/3)πr³ · Würfeloberfläche 6a²."],
 ["Pythagoras","a² + b² = c². Tripel auswendig: 3-4-5, 5-12-13, 8-15-17 und alle Vielfachen davon."],
 ["Skalierung","Längen mal k → Flächen mal k², Volumina mal k³. Eine der häufigsten Testfragen überhaupt."],
 ["Trigonometrie","sin = Gegenkathete/Hypotenuse, cos = Ankathete/Hypotenuse, tan = Gegen/Ankathete. Werte: sin 30° = 1/2, sin 45° = √2/2, sin 60° = √3/2, tan 45° = 1."],
 ["Trigonometrischer Pythagoras","sin²α + cos²α = 1 — damit lässt sich aus einem Wert der andere bestimmen."],
 ["Geraden","m = Δy/Δx. Schnitt mit der x-Achse: y = 0 setzen. Winkelsumme im n-Eck: (n−2)·180°."]
]);

theorie("stoch","Stochastik & Kombinatorik",[
 ["Laplace","P = günstige Fälle / mögliche Fälle, wenn alle Ergebnisse gleich wahrscheinlich sind."],
 ["Und / Oder","„Und“ bei Unabhängigkeit → multiplizieren. „Oder“ → addieren, dabei die Schnittmenge einmal abziehen: P(A∪B) = P(A) + P(B) − P(A∩B)."],
 ["Gegenereignis","Bei „mindestens ein …“ immer über 1 − P(keines) rechnen. Beispiel: mindestens eine Sechs bei 3 Würfen = 1 − (5/6)³."],
 ["Ohne Zurücklegen","Im zweiten Zug sinken Zähler und Nenner: 3/8 · 2/7."],
 ["Zählprinzipien","Reihenfolge wichtig, ohne Wiederholung → n·(n−1)·… Reihenfolge egal → Binomialkoeffizient (n über k) = n!/(k!(n−k)!). Mit Wiederholung → nᵏ."],
 ["Binomialkoeffizient im Kopf","(n über 2) = n(n−1)/2, (n über 3) = n(n−1)(n−2)/6. Damit sind Handschlag- und Team-Aufgaben Sekundensache."],
 ["Erwartungswert","E = Σ Wert · Wahrscheinlichkeit. Fairer Würfel: 3,5. Bei Spielen den Einsatz abziehen."],
 ["Totale Wahrscheinlichkeit","Anteile mal Teilwahrscheinlichkeiten addieren: 0,6·0,2 + 0,4·0,5 = 0,32."]
]);

theorie("folgen","Folgen & Reihen",[
 ["Arithmetisch","aₙ = a₁ + (n−1)·d. Achtung: n−1 Schritte, nicht n. Summe = n·(a₁ + aₙ)/2."],
 ["Geometrisch","aₙ = a₁ · qⁿ⁻¹. Summe der ersten n Glieder = a₁·(qⁿ − 1)/(q − 1)."],
 ["Unendliche geometrische Reihe","Nur für |q| < 1: Summe = a₁/(1 − q). Beispiel 1 + ½ + ¼ + … = 2."],
 ["Gauß","1 + 2 + … + n = n(n+1)/2. Damit auch 2 + 4 + … + 2n = n(n+1)."],
 ["Anzahl der Glieder","(letztes − erstes)/Schrittweite + 1. Das vergessene „+1“ ist ein Klassiker."]
]);

theorie("logik","Aussagenlogik & Mengen",[
 ["Implikation","A → B ist nur falsch, wenn A wahr und B falsch ist. Gleichwertig: ¬A ∨ B."],
 ["Kontraposition","A → B ist äquivalent zu ¬B → ¬A. Umkehrung (B → A) und Negation (¬A → ¬B) sind es <em>nicht</em> — hier entstehen die meisten Fehler."],
 ["De Morgan","¬(A ∧ B) = ¬A ∨ ¬B · ¬(A ∨ B) = ¬A ∧ ¬B. Beim Verneinen kippt „und“ zu „oder“."],
 ["Quantoren verneinen","„alle sind“ → „mindestens einer ist nicht“. „einige sind“ → „keiner ist“."],
 ["Notwendig vs. hinreichend","„Nur wenn B, dann A“ heißt A → B (B ist notwendig). „Wenn B, dann A“ heißt B → A (B ist hinreichend). Das Wörtchen „nur“ dreht die Richtung um."],
 ["Mengen","|A ∪ B| = |A| + |B| − |A ∩ B|. Bei drei Mengen ein Venn-Diagramm zeichnen und von innen nach außen füllen."],
 ["Teilmengen zählen","Eine n-elementige Menge hat 2ⁿ Teilmengen, davon (n über k) mit genau k Elementen."]
]);

theorie("schluss","Schlussfolgerndes Denken",[
 ["Gültige Schlüsse","Modus ponens: A → B, A, also B. Modus tollens: A → B, ¬B, also ¬A. Kettenschluss: A → B, B → C, also A → C."],
 ["Ungültige Schlüsse","Aus B folgt nicht A. Aus ¬A folgt nicht ¬B. Diese beiden Fehlschlüsse sind die Standardablenker im Test."],
 ["Syllogismen","Kreise zeichnen. Gültig ist nur, was in <em>jeder</em> möglichen Anordnung stimmt. Aus zwei „einige“-Sätzen folgt nie etwas Sicheres."],
 ["Rangordnungen","Sofort eine Kette bilden (A > B > C) statt jede Aussage einzeln zu prüfen."],
 ["Wahrheit und Lüge","Eine Annahme treffen, konsequent durchziehen, auf Widerspruch prüfen. Selbstbezügliche Aussagen wie „ich lüge“ sind der Schlüssel."],
 ["Modulo-Aufgaben","Wochentage und Zyklen über den Rest der Division durch 7 (bzw. die Zykluslänge)."]
]);

theorie("reihen","Zahlenreihen & Muster",[
 ["Prüfreihenfolge","1. Differenzen bilden. 2. Sind die Differenzen konstant? 3. Sind die Differenzen selbst eine Reihe? 4. Quotienten prüfen. 5. An Zahlenfamilien denken."],
 ["Zahlenfamilien","Quadrate 1, 4, 9, 16, 25 · Kuben 1, 8, 27, 64 · Primzahlen 2, 3, 5, 7, 11 · Fakultäten 1, 2, 6, 24, 120 · Fibonacci 1, 1, 2, 3, 5, 8 · Dreieckszahlen 1, 3, 6, 10, 15."],
 ["Zwei verschränkte Regeln","Steigt und fällt die Reihe abwechselnd, liegen meist zwei Regeln im Wechsel vor (z. B. ×2, dann −1). Dann jedes zweite Glied getrennt betrachten."],
 ["Kombinierte Regeln","Sehr häufig ist ×2 + 1 oder ×3 − 2. Erkennbar daran, dass die Differenzen sich verdoppeln bzw. verdreifachen."],
 ["Buchstabenreihen","Buchstaben in Positionszahlen umschreiben (A = 1 … Z = 26) und wie eine Zahlenreihe behandeln."],
 ["Zeitmanagement","Wenn nach 45 Sekunden kein Muster erkennbar ist: markieren, weitergehen, später zurückkommen."]

theorie("algo","Algorithmisches Denken",[
 ["Binärzahlen","Stellenwerte von rechts: 1, 2, 4, 8, 16, 32, 64, 128. Umrechnen dezimal → binär: immer die größte passende Zweierpotenz abziehen."],
 ["Bits und Werte","n Bit ergeben 2ⁿ verschiedene Werte, größter Wert 2ⁿ − 1. Jedes zusätzliche Bit verdoppelt den Bereich."],
 ["Pseudocode lesen","Eine kleine Wertetabelle anlegen und die ersten zwei bis drei Durchläufe von Hand mitschreiben. Danach ist das Muster fast immer sichtbar."],
 ["Schleifen zählen","Verschachtelte Schleifen multiplizieren ihre Durchläufe. Bei „solange“-Schleifen genau auf die Abbruchbedingung achten — der letzte Durchlauf wird oft übersehen."],
 ["mod und Ganzzahldivision","17 mod 5 = 2 (Rest), 17 : 5 = 3 (abgeschnitten). „mod 2 == 0“ testet auf gerade Zahlen, „mod k == 0“ auf Vielfache."],
 ["Wachstum einschätzen","Halbieren bis 1 → log₂ n Schritte (bei 1000 rund 10). Jeder mit jedem → n²/2 Vergleiche. Alle Anordnungen → n!."],
 ["Rekursion","Von unten aufbauen: f(1), f(2), f(3) … statt von oben einzusetzen."]
]);

theorie("english","English Reading Comprehension",[
 ["Vorgehen","Erst die Fragen überfliegen, dann den Text einmal zügig lesen und pro Absatz drei Wörter als Randnotiz denken. Danach gezielt zurückspringen. Wer den Text zweimal vollständig liest, verliert im 90-Minuten-Takt zu viel Zeit."],
 ["Hauptaussage","Die richtige Antwort deckt den <em>ganzen</em> Text ab. Antworten, die nur einen Absatz oder ein Beispiel beschreiben, sind falsch — auch wenn sie stimmen."],
 ["Detailfragen","Die Antwort steht wörtlich im Text, meist umformuliert. Die Stelle wirklich aufsuchen, statt aus der Erinnerung zu antworten."],
 ["Inferenzfragen","Gesucht ist der kleinste Schritt über den Text hinaus, der zwingend folgt — nicht die interessanteste Interpretation."],
 ["Vokabel im Kontext","Das umgebende Satzgefüge liefert die Bedeutung, besonders Gegensatzwörter wie <em>rather than</em>, <em>whereas</em>, <em>yet</em>."],
 ["Ablenker erkennen","Typisch sind: extreme Wörter (always, never, all, must), inhaltlich richtige Aussagen, die aber nicht im Text stehen, und Antworten, die eine Beispielzahl zur allgemeinen Regel machen."],
 ["Haltung des Autors","Auf wertende Formulierungen achten („has aged best“, „was never the point“). Sie beantworten Tonfall-Fragen fast im Alleingang."]
]);

theorie("wi","Wahlbereich Wirtschaftsinformatik",[
 ["Deckungsbeitrag","DB je Stück = Preis − variable Stückkosten. Gesamt-DB = DB je Stück · Menge. Er deckt zuerst die Fixkosten."],
 ["Break-even","Gewinnschwelle = Fixkosten : Deckungsbeitrag je Stück. Darunter Verlust, darüber Gewinn."],
 ["Kostenarten","Fixkosten sind mengenunabhängig, variable Kosten steigen mit der Menge. Pro Stück sinken Fixkosten mit wachsender Menge (Fixkostendegression)."],
 ["Kennzahlen","Umsatzrendite = Gewinn/Umsatz · Konversionsrate = Abschlüsse/Besucher · Amortisationszeit = Investition/jährlicher Rückfluss."],
 ["Abschreibung","Linear: Anschaffungswert : Nutzungsdauer pro Jahr. Buchwert = Anschaffungswert − bisherige Abschreibungen."],
 ["Gewichtete Veränderungen","Anteile mit ihren Wachstumsfaktoren multiplizieren und addieren: 0,6·1,1 + 0,4·0,9 = 1,02."],
 ["Engpassdenken","In einer Prozesskette bestimmt die langsamste Station den Durchsatz. Mitteln ist hier immer falsch."],
 ["Tabellen lesen","Zuerst die Gesamtsumme bilden, dann Anteile. Auf Einheiten achten (Tsd. €, Mio. €) — Einheitenfehler kosten mehr Punkte als Rechenfehler."]
]);

theorie("ableitung","Ableitungen: Quotienten- & Kettenregel",[
 ["Die drei Regeln","<b>Produktregel:</b> (u·v)′ = u′v + <b>u</b>v′ — hier steht ein Plus.<br><b>Quotientenregel:</b> (u/v)′ = (u′v − uv′) / v² — hier steht ein Minus, und die Reihenfolge ist entscheidend.<br><b>Kettenregel:</b> äußere Ableitung mal innere Ableitung."],
 ["Eselsbrücke Quotientenregel","„NAZ minus ZAN, durch N-Quadrat dann“ — <b>N</b>enner mal <b>A</b>bleitung <b>Z</b>ähler, minus <b>Z</b>ähler mal <b>A</b>bleitung <b>N</b>enner, geteilt durch Nenner zum Quadrat. Wer die Reihenfolge dreht, bekommt exakt das falsche Vorzeichen — und genau diese Variante steht in der Klausur als Antwortoption bereit."],
 ["ln(kx)′ = 1/x","Der wichtigste Einzelbaustein der Originalklausur. Jeder konstante Faktor im Logarithmus verschwindet beim Ableiten: ln(2x)′ = ln(7x)′ = ln(x)′ = 1/x. Grund: ln(kx) = ln k + ln x, und eine Konstante hat die Ableitung null."],
 ["Allgemein ln und e","ln(u)′ = u′/u — Ableitung des Inneren über das Innere. e^u′ = u′·e^u — die e-Funktion bleibt stehen und wird mit der inneren Ableitung multipliziert."],
 ["Wurzeln","√(u)′ = u′/(2√u). Bei u = x² ± c kürzt sich die Zwei immer weg, es bleibt x/√(x² ± c). Steht die Wurzel im Nenner, nie die Quotientenregel benutzen, sondern als negative Potenz schreiben: 1/√u = u^(−½)."],
 ["Trigonometrie","sin′ = cos · cos′ = −sin. Das Minus entsteht nur beim Ableiten des Cosinus. Bei sin(2x) oder cos(x²) die innere Ableitung nicht vergessen."],
 ["Doppelbrüche auflösen","Entsteht im Zähler ein Bruch (typisch bei Wurzeln), erweitere Zähler <em>und</em> Nenner mit dem störenden Term. Genau dieser Schritt führt in der Originalklausur von der rohen Quotientenregel auf die angebotene Antwortform."],
 ["Antwort nicht gefunden?","Deine Lösung sieht anders aus als alle Optionen? Erst ausklammern, kürzen und erweitern, bevor du an einen Rechenfehler glaubst. Die Klausur bietet die Lösung fast nie in der Form an, in der sie beim Ableiten entsteht."],
 ["Kontrolle ohne Taschenrechner","Setze eine Zahl ein, die die Wurzel glatt macht (bei √(x²−5) etwa x = 3, denn √4 = 2). Rechne den Wert mit zwei Kandidaten aus — meist unterscheiden sie sich sofort deutlich."]
]);

theorie("symmetrie","Symmetrie von Funktionen",[
 ["Die zwei Definitionen","<b>gerade</b>: f(−x) = f(x) → achsensymmetrisch zur y-Achse.<br><b>ungerade</b>: f(−x) = −f(x) → punktsymmetrisch zum Ursprung.<br>Merkhilfe: <em>gerade → Gerade (Achse)</em>, <em>ungerade → Punkt</em>."],
 ["Schnellregel für Polynome","Nur gerade Exponenten (x⁰, x², x⁴) → gerade. Nur ungerade Exponenten (x¹, x³, x⁵) → ungerade. Gemischt → keine der beiden Symmetrien. Konstanten zählen als x⁰, sind also gerade."],
 ["Die Standardbausteine","sin, tan und 1/x sind <b>ungerade</b>. cos und alle x-Potenzen mit geradem Exponenten sind <b>gerade</b>. e^x ist weder noch."],
 ["Produkte rechnen wie Vorzeichen","Setze gerade = „+“ und ungerade = „−“ und multipliziere: gerade·gerade = gerade, ungerade·ungerade = gerade, gerade·ungerade = ungerade. Für Quotienten gilt dasselbe. Bei <b>Summen</b> funktioniert das <em>nicht</em>: dort bleibt nur gerade+gerade = gerade und ungerade+ungerade = ungerade, gemischte Summen haben gar keine Symmetrie."],
 ["Verschobene Funktionen — der Klausurtrick","Steht überall derselbe Klammerausdruck, substituiere ihn: bei f(x) = sin(x−1)·(x−1)² setze u = x−1. Bestimme die Symmetrie von g(u), und übersetze am Ende zurück: u = 0 entspricht x = 1, das Zentrum liegt also bei (1, 0)."],
 ["Vorzeichenfalle beim Zurückübersetzen","Setze die Klammer null und löse nach x auf. (x − 2) → Zentrum bei x = 2. (x + 2) → Zentrum bei x = <b>−2</b>. Dieser eine Handgriff verhindert den häufigsten Fehler der Aufgabengattung."],
 ["Achse oder Punkt?","Ist die substituierte Funktion gerade, lautet die Antwort „achsensymmetrisch zur Geraden x = a“. Ist sie ungerade, lautet sie „punktsymmetrisch zu (a, 0)“. Bei Achsensymmetrie ist eine additive Konstante egal, bei Punktsymmetrie gehört sie ins Zentrum."],
 ["Der Freischuss","„Achsensymmetrisch zur x-Achse“ ist bei einer Funktion <b>immer</b> falsch — dann hätte ein x zwei y-Werte. Diese Option kannst du ohne jede Rechnung streichen."],
 ["Ein-Zahl-Probe","Unsicher? Rechne f(1) und f(−1). Bei gerader Funktion müssen beide gleich sein, bei ungerader entgegengesetzt. Stimmt weder das eine noch das andere, liegt keine Symmetrie zum Ursprung vor."]
]);

theorie("raetsel","Ehrliche, Lügner & Normale",[
 ["Die drei Rollen","<b>Ehrlicher:</b> jede Aussage wahr. <b>Lügner:</b> jede Aussage falsch. <b>Normaler:</b> darf beides — aus seinen Aussagen folgt nie ein Widerspruch. Der Normale ist der Joker und deshalb nie der Ansatzpunkt."],
 ["Das Grundverfahren","Nimm eine Person, unterstelle ihr nacheinander jede Rolle und prüfe, ob ein Widerspruch entsteht. Beginne bei der Person, die etwas <em>über sich selbst</em> sagt — solche Aussagen schränken am stärksten ein."],
 ["Zuerst die strengen Rollen prüfen","Widersprüche entstehen fast immer beim Ehrlichen oder beim Lügner, weil nur sie Verbote haben. Prüfe deshalb: Darf ein Lügner diesen Satz sagen (ist er also falsch)? Darf ein Ehrlicher ihn sagen (ist er also wahr)?"],
 ["Zwei Sätze, die alles entscheiden","„<b>Ich bin ein Lügner</b>“ kann weder ein Ehrlicher (wäre falsch) noch ein Lügner (wäre wahr) sagen → die Person ist ein <b>Normaler</b>.<br>„<b>Ich bin ein Ehrlicher</b>“ kann <em>jeder</em> sagen und liefert null Information."],
 ["Aussagen über Aussagen","„Was A gesagt hat, ist wahr“ überträgt den Wahrheitswert: Ist A's Aussage wahr, ist auch B's Aussage wahr — unabhängig davon, wer A und B sind. So verkettest du zwei Personen in einem Schritt."],
 ["Und, oder, mindestens","Die Verneinung von „<em>beide</em> sind Lügner“ ist „<em>mindestens einer</em> ist kein Lügner“ — nicht „keiner ist Lügner“ (De Morgan). Die Verneinung von „mindestens einer“ ist „keiner“. Fast jedes Rätsel dieser Art hängt genau an dieser Umformung."],
 ["Wenn-dann-Aussagen","Eine Wenn-dann-Aussage ist nur falsch, wenn die Bedingung zutrifft und die Folge nicht. Ist die Bedingung falsch, ist die gesamte Aussage <b>wahr</b>. Folge: Ein Lügner kann eine Wenn-dann-Aussage über sich selbst („Wenn ich ehrlich bin, dann …“) niemals aussprechen."],
 ["Alle Fälle prüfen","Höre nicht bei der ersten passenden Lösung auf. Bleiben mehrere widerspruchsfreie Fälle übrig, lautet die Antwort „nicht bestimmbar“ — oder du suchst die Aussage, die in <em>allen</em> offenen Fällen gilt."],
 ["Systematisch bei drei Personen","Bei genau einem Ehrlichen, einem Lügner und einem Normalen gibt es nur 3 · 2 · 1 = 6 Möglichkeiten. Notfalls schreibst du alle sechs untereinander und streichst durch — das dauert keine fünf Minuten und ist bei 8 Punkten die Zeit wert."]
]);

theorie("tv","Technisches Verständnis",[
 ["Die Aufgabenstellung genau lesen","Gefragt ist ausschließlich: Steht das so im Text oder folgt es <em>direkt</em> daraus? Ob die Aussage in der Wirklichkeit zutrifft, ist ausdrücklich <b>irrelevant</b>. Schalte dein Fachwissen bewusst ab — es führt hier systematisch in die Irre."],
 ["Vorgehen","Text einmal in Ruhe lesen und dabei Verneinungen, Vergleiche und Begründungen markieren. Dann Aussage für Aussage die zugehörige Textstelle aufsuchen und wörtlich vergleichen. Nie aus der Erinnerung antworten — bei vier Aussagen zu einem kurzen Text ist dafür genug Zeit."],
 ["Falle 1: Begriffsvertauschung","Ein einziges Substantiv wird ausgetauscht: „Kollaps konventioneller <b>Methoden</b>“ wird zu „Kollaps konventioneller <b>Designs</b>“. Gegenmittel: Unterstreiche das zentrale Substantiv der Aussage und suche genau dieses Wort im Text."],
 ["Falle 2: Bewertung umgedreht","Ein Nachteil wird als Vorteil ausgegeben. Achte auf Signalwörter im Text: <em>although, but, however, a serious problem, drops</em> — sie zeigen, auf welcher Seite der Bilanz etwas steht."],
 ["Falle 3: Übergeneralisierung","Aus „manche“ oder „nicht alle“ wird „alle“. Absolutwörter (<em>alle, immer, nie, jeder</em>) sind fast immer ein Alarmsignal. Suche gezielt nach einer Ausnahme im Text."],
 ["Falle 4: untergeschobene Ursache","Die Wirkung stimmt, die Begründung ist erfunden. Bei jedem <em>weil, deshalb, aufgrund</em> prüfst du zwei Dinge getrennt: Steht die Wirkung im Text? Und steht <b>diese</b> Ursache im Text?"],
 ["Falle 5: Querverbindung","Zwei richtige Aussagen aus verschiedenen Absätzen werden mit einem „weil“ verbunden. Prüfe, ob Ursache und Wirkung im Text im <em>selben</em> Zusammenhang stehen."],
 ["Falle 6: Handlungsempfehlung","Der Text beschreibt, die Aussage fordert („sollte“, „muss“). Fachtexte dieser Art geben selten Ratschläge — eine Aussage im Befehlston ist besonders verdächtig."],
 ["Stärke muss passen","<em>may</em> ↔ <em>kann</em>, <em>often</em> ↔ <em>häufig</em>, <em>must</em> ↔ <em>zwangsläufig</em>. Eine Aussage, die mehr behauptet als der Text hergibt, ist falsch; eine, die <em>weniger</em> behauptet, ist meist gedeckt."],
 ["Sinnprobe","Frage dich: Ergäbe der Text noch Sinn, wenn diese Aussage stimmte? Wird ein ganzer Absatz dadurch überflüssig, ist die Aussage falsch. Das funktioniert auch, wenn du die genaue Stelle nicht wiederfindest."],
 ["Unbekannte Fachwörter","Die Erklärung steht fast immer im ersten Satz, in dem der Begriff auftaucht. Den ersten Absatz langsam lesen, den Rest schneller."]
]);

// Originalklausur TUM Eignungsfeststellungsverfahren, IN0000 Endterm, 30.08.2022
// Alle drei Aufgaben im Wortlaut, mit vollständigem Lösungsweg.

q("org-1a","symmetrie",3,
 "<span class=\"orig\">Originalklausur 2022 · Aufgabe 1a · 4 Punkte</span>Bestimmen Sie das Symmetrieverhalten der folgenden Funktion:<pre class=\"code\">f(x) = sin(x − 1) · (x − 1)²</pre>",
 ["Die Funktion ist punktsymmetrisch zu (1, 0).",
  "Die Funktion ist achsensymmetrisch zur y-Achse.",
  "Die Funktion ist punktsymmetrisch zum Ursprung.",
  "Die Funktion ist achsensymmetrisch zur x-Achse."],0,
 "<p><b>Der Trick: substituieren.</b> Überall steht <code>x − 1</code>. Setze <code>u = x − 1</code>, dann wird die Funktion zu <code>g(u) = sin(u) · u²</code>. Damit ist die Verschiebung erst einmal weg und du hast eine ganz normale Symmetriefrage.</p>"+
 "<ol>"+
 "<li><b>Bausteine einordnen.</b> <code>sin(u)</code> ist ungerade (punktsymmetrisch zum Ursprung), <code>u²</code> ist gerade (achsensymmetrisch zur y-Achse).</li>"+
 "<li><b>Produktregel für Symmetrie.</b> ungerade · gerade = <b>ungerade</b>. Also ist <code>g(u)</code> ungerade, d. h. <code>g(−u) = −g(u)</code>.</li>"+
 "<li><b>Zurückübersetzen.</b> <code>u = 0</code> entspricht <code>x = 1</code>. Der Ursprung der u-Welt liegt in der x-Welt bei <code>(1, 0)</code>. Aus „punktsymmetrisch zum Ursprung“ wird also <b>punktsymmetrisch zu (1, 0)</b>.</li>"+
 "</ol>"+
 "<p><b>Gegenprobe in Zahlen</b> (immer machen, kostet 20 Sekunden): <code>f(1 + t) = sin(t) · t²</code> und <code>f(1 − t) = sin(−t) · (−t)² = −sin(t) · t²</code>. Die beiden sind genau entgegengesetzt — das ist die Definition von Punktsymmetrie zu (1, 0).</p>"+
 "<p><b>Warum die anderen falsch sind:</b> Achsensymmetrie zur y-Achse hieße <code>f(−x) = f(x)</code> — probiere <code>x = 1</code>: <code>f(1) = 0</code>, aber <code>f(−1) = sin(−2)·4 ≈ −3,64</code>. Punktsymmetrie zum <em>Ursprung</em> wäre nur richtig, wenn nirgends die Verschiebung um 1 stünde. Und „achsensymmetrisch zur x-Achse“ ist bei einer Funktion <b>nie</b> möglich — dann hätte sie zu einem x zwei y-Werte.</p>");

q("org-1b","ableitung",3,
 "<span class=\"orig\">Originalklausur 2022 · Aufgabe 1b · 8 Punkte</span>Bestimmen Sie die Ableitung f′(x):<pre class=\"code\">        √(x² − 5)\nf(x) = ───────────\n         ln(2x)</pre>",
 ["f′(x) = (x²·ln(2x) − x² + 5) / (x · ln(2x)² · √(x² − 5))",
  "f′(x) = ( (x/√(x²−5))·ln(2x) − √(x²−5) ) / ln(2x)²",
  "f′(x) = ( ln(2x)·2x − √(x²−5) ) / ( ln(2x)² · x · √(x²−5) )",
  "f′(x) = x² / √(x² − 5)"],0,
 "<p>Das ist die teuerste Aufgabe der Klausur — 8 von 24 Punkten. Sie ist reine Handwerksarbeit: Quotientenregel, und in beiden Bausteinen steckt eine Kettenregel.</p>"+
 "<ol>"+
 "<li><b>Zerlegen.</b> Zähler <code>u = √(x² − 5)</code>, Nenner <code>v = ln(2x)</code>. Quotientenregel: <code>f′ = (u′·v − u·v′) / v²</code>.</li>"+
 "<li><b>u′ (Kettenregel).</b> <code>u = (x² − 5)^½</code>, also <code>u′ = ½·(x² − 5)^(−½) · 2x = x / √(x² − 5)</code>. Die innere Ableitung von <code>x² − 5</code> ist <code>2x</code>, und die 2 kürzt sich gegen das ½.</li>"+
 "<li><b>v′ — hier fällt die halbe Kohorte rein.</b> <code>v = ln(2x)</code>, also <code>v′ = (1/(2x)) · 2 = <b>1/x</b></code>. Der Faktor 2 im Logarithmus verschwindet vollständig. Merke: <code>ln(kx)′ = 1/x</code> für jede Konstante k.</li>"+
 "<li><b>Einsetzen.</b> <code>f′ = [ (x/√(x²−5))·ln(2x) − √(x²−5)·(1/x) ] / ln(2x)²</code>. Das ist bereits richtig — steht aber so nicht zur Auswahl.</li>"+
 "<li><b>Auf die Form der Antworten bringen.</b> Erweitere Zähler und Nenner mit <code>x · √(x² − 5)</code>:<br>Zähler: <code>x²·ln(2x) − (x² − 5) = x²·ln(2x) − x² + 5</code><br>Nenner: <code>x · ln(2x)² · √(x² − 5)</code></li>"+
 "</ol>"+
 "<p><b>Der schnelle Weg im Test:</b> Rechne <code>v′</code> aus und schau, welche Option <code>1/x</code> überhaupt enthält. Die Variante ohne <code>1/x</code> stammt von jemandem, der <code>v′ = 1</code> gesetzt hat. Die Variante mit <code>2x</code> im Zähler hat die Wurzelableitung vergessen. Und <code>x²/√(x²−5)</code> ist überhaupt keine Quotientenregel — dort fehlt der Nenner komplett.</p>"+
 "<p><b>Kontrolle ohne Taschenrechner:</b> Wenn du unsicher bist, setze eine leichte Zahl ein, z. B. <code>x = 3</code>. Dann ist <code>√(9−5) = 2</code> — die Wurzel wird glatt. So lassen sich zwei Kandidaten oft in einer Minute unterscheiden.</p>");

q("org-2","raetsel",3,
 "<span class=\"orig\">Originalklausur 2022 · Aufgabe 2 · 8 Punkte</span>Auf der Insel der Ehrlichen und Lügner gibt es <b>Ehrliche</b>, die immer die Wahrheit sagen, <b>Lügner</b>, die immer lügen, und <b>normale Menschen</b>, die manchmal lügen. Von den drei Personen A, B, C ist genau einer ein Ehrlicher, genau einer ein Lügner und genau einer ein normaler Mensch. Sie sagen nacheinander:<pre class=\"code\">A: Ich bin ein normaler Mensch.\nB: Diese Aussage von A ist wahr.\nC: Ich bin kein normaler Mensch.</pre>Wer ist was?",
 ["A ist ein Lügner, B ist ein Normaler, C ist ein Ehrlicher",
  "A ist ein Normaler, B ist ein Ehrlicher, C ist ein Lügner",
  "A ist ein Normaler, B ist ein Lügner, C ist ein Ehrlicher",
  "A ist ein Ehrlicher, B ist ein Normaler, C ist ein Lügner",
  "A ist ein Ehrlicher, B ist ein Lügner, C ist ein Normaler",
  "A ist ein Lügner, B ist ein Ehrlicher, C ist ein Normaler"],0,
 "<p><b>Die drei Regeln, aus denen alles folgt:</b> Ein Ehrlicher sagt <em>nur</em> Wahres. Ein Lügner sagt <em>nur</em> Falsches. Ein Normaler darf beides — aus seinen Aussagen folgt daher nie ein Widerspruch, er ist der „Joker“.</p>"+
 "<p><b>Schritt 1 — A einschränken.</b> A sagt „Ich bin ein normaler Mensch.“<br>"+
 "· Wäre A <b>Ehrlicher</b>, wäre die Aussage wahr, also wäre A normal. Aber A ist Ehrlicher. Widerspruch — A ist kein Ehrlicher.<br>"+
 "· Wäre A <b>Lügner</b>, wäre die Aussage falsch, also wäre A nicht normal. Stimmt, A ist ja Lügner. Kein Widerspruch — möglich.<br>"+
 "· Wäre A <b>Normaler</b>, wäre die Aussage wahr, und ein Normaler darf Wahres sagen. Auch möglich.<br>"+
 "Es bleiben zwei Fälle.</p>"+
 "<p><b>Schritt 2 — Fall „A ist Normaler“ durchspielen.</b> Dann ist A's Aussage wahr, also ist auch B's Aussage („A's Aussage ist wahr“) wahr. Ein Lügner kann nichts Wahres sagen, also ist B <b>Ehrlicher</b>. Für C bleibt <b>Lügner</b>. Aber C sagt „Ich bin kein normaler Mensch“ — und ein Lügner ist tatsächlich kein Normaler, die Aussage wäre also <b>wahr</b>. Ein Lügner darf nichts Wahres sagen. <b>Widerspruch — dieser Fall fällt weg.</b></p>"+
 "<p><b>Schritt 3 — Fall „A ist Lügner“ durchspielen.</b> Dann ist A's Aussage falsch, also ist B's Aussage („A's Aussage ist wahr“) ebenfalls <b>falsch</b>. Ein Ehrlicher kann nichts Falsches sagen, also ist B <b>Normaler</b> (der darf lügen). Für C bleibt <b>Ehrlicher</b>. Probe: C sagt „Ich bin kein normaler Mensch“ — als Ehrlicher ist C tatsächlich kein Normaler, die Aussage ist wahr. <b>Alles passt.</b></p>"+
 "<p><b>Ergebnis: A = Lügner, B = Normaler, C = Ehrlicher.</b></p>"+
 "<p><b>Die Standardtechnik für jedes solche Rätsel:</b> Nimm die Person, über deren Rolle die Aussage am meisten verrät (meist die mit einer Aussage über sich selbst), schließe daraus Rollen aus, und spiele die verbleibenden Fälle bis zum Widerspruch durch. Wichtig: Der Widerspruch entsteht fast immer beim <em>Lügner</em>, weil er als Einziger nichts Wahres sagen darf — prüfe ihn zuerst.</p>");

passage("orig-text","Design Validation (Originalklausur 2022, Aufgabe 3)",
`The currently practiced methods for design validation in most sites are still the Veteran techniques of simulation and testing. Although provably effective in the very early stages of debugging, when the design is still infested with multiple bugs, their effectiveness drops quickly as the design becomes clearer, and they require an alarmingly increasing amount of time to uncover the more subtle bugs. A serious problem with these techniques is that one is never sure when they have reached their limits or even an estimate of how many bugs may still lurk in the design. As the complexity of designs drastically increases, say from having .5 million gates per chip to advanced designs with 5 million gates per chip, some far-seeing managers foresee the complete collapse of these conventional methods and their total inability to scale up.`);

q("org-3a","tv",3,
 "<span class=\"orig\">Originalklausur 2022 · Aufgabe 3 · je 1 Punkt</span>Steht die folgende Aussage so im Text oder ist sie eine direkte Folgerung daraus?<br><br><b>„Ein Vorteil von Tests ist, dass sie subtile Designfehler (‚bugs‘) aufspüren.“</b>",
 ["Nein","Ja"],0,
 "<p><b>Nein.</b> Der Text sagt zwar, dass die Methoden subtile Fehler aufspüren — aber er stellt das ausdrücklich als <em>Nachteil</em> dar, nicht als Vorteil: „they require an <b>alarmingly increasing amount of time</b> to uncover the more subtle bugs“. Sie brauchen dafür also erschreckend viel Zeit.</p>"+
 "<p>Der Vorteil, den der Text nennt, ist ein ganz anderer: „provably effective in the <b>very early stages</b> of debugging, when the design is still infested with multiple bugs“ — stark bei <em>vielen groben</em> Fehlern am Anfang.</p>"+
 "<p><b>Die Fallenart, die du hier erkennen musst:</b> Vorzeichenwechsel. Eine Information aus dem Text wird korrekt wiedergegeben, aber ihre Bewertung wird umgedreht (Nachteil → Vorteil). Achte im Text immer auf Signalwörter wie <em>although</em>, <em>drops</em>, <em>a serious problem</em> — sie markieren, auf welcher Seite der Bilanz etwas steht.</p>");

q("org-3b","tv",3,
 "<span class=\"orig\">Originalklausur 2022 · Aufgabe 3 · je 1 Punkt</span>Steht die folgende Aussage so im Text oder ist sie eine direkte Folgerung daraus?<br><br><b>„Manche Manager sagen vorher, dass gängige Methoden sich nicht auf Designs mit mehr als 5 Millionen Gattern pro Chip anwenden lassen.“</b>",
 ["Ja","Nein"],0,
 "<p><b>Ja.</b> Der Text: „some far-seeing <b>managers foresee</b> the complete collapse of these conventional methods and their total inability to scale up“ — und zwar im Zusammenhang mit dem Sprung auf „advanced designs with 5 million gates per chip“.</p>"+
 "<p>Prüfe die Aussage Stück für Stück gegen den Text:<br>"+
 "· „Manche Manager“ ↔ „some … managers“ ✓<br>"+
 "· „sagen vorher“ ↔ „foresee“ ✓<br>"+
 "· „gängige Methoden“ ↔ „conventional methods“ ✓<br>"+
 "· „lassen sich nicht anwenden“ ↔ „complete collapse … total inability to scale up“ ✓</p>"+
 "<p><b>Zum kritischen Punkt „mehr als 5 Millionen“:</b> Der Text nennt 5 Millionen als das Niveau, bei dem der Zusammenbruch erwartet wird. Wenn die Methoden schon bei 5 Millionen versagen und generell nicht mehr mitskalieren, dann erst recht darüber — das ist eine direkte Folgerung. Achtung: Das ist die schwierigste der vier Aussagen; wenn du hier zwischen zwei Lesarten schwankst, entscheide danach, ob die Aussage <em>mehr</em> behauptet als der Text hergibt (dann Nein) oder <em>weniger</em> (dann Ja). Hier behauptet sie weniger.</p>");

q("org-3c","tv",3,
 "<span class=\"orig\">Originalklausur 2022 · Aufgabe 3 · je 1 Punkt</span>Steht die folgende Aussage so im Text oder ist sie eine direkte Folgerung daraus?<br><br><b>„Manche Manager sagen den Kollaps konventioneller Designs vorher.“</b>",
 ["Nein","Ja"],0,
 "<p><b>Nein — und diese Aussage ist die wichtigste Lektion der ganzen Aufgabe.</b> Der Text sagt: „the complete collapse of these conventional <b>methods</b>“ — der Zusammenbruch der konventionellen <em>Methoden</em> (also von Simulation und Testing). Die Aussage behauptet dagegen den Kollaps konventioneller <b>Designs</b> (also der Chips selbst). Ein einziges ausgetauschtes Substantiv, und die Aussage ist falsch.</p>"+
 "<p><b>Diese Falle heißt Begriffsvertauschung</b> und ist der mit Abstand häufigste Trick in diesem Aufgabentyp. Der Satz klingt beim Überfliegen fast identisch mit dem Original, weil alle anderen Wörter stimmen. Gegenmittel: Unterstreiche in jeder Aussage das <b>Substantiv</b>, um das es geht, und suche genau dieses Wort im Text. Hier: „Designs“ — im Text steht an dieser Stelle „methods“.</p>"+
 "<p>Im Text kommen beide Wörter mehrfach vor („design validation“, „the design is still infested“, „conventional methods“). Genau das macht die Verwechslung so leicht.</p>");

q("org-3d","tv",3,
 "<span class=\"orig\">Originalklausur 2022 · Aufgabe 3 · je 1 Punkt</span>Steht die folgende Aussage so im Text oder ist sie eine direkte Folgerung daraus?<br><br><b>„Bei subtileren Designfehlern (‚bugs‘) kommen Simulationen zum Einsatz.“</b>",
 ["Ja","Nein"],0,
 "<p><b>Ja.</b> Der Text beschreibt Simulation und Testing als „the currently practiced methods“ — sie sind also das, was tatsächlich eingesetzt wird. Und er sagt weiter, dass sie „an alarmingly increasing amount of time <b>to uncover the more subtle bugs</b>“ brauchen. Damit werden sie bei subtilen Fehlern eingesetzt — sie sind dabei nur langsam.</p>"+
 "<p><b>Wichtig für den Aufgabentyp:</b> Gefragt ist nur, ob die Aussage im Text steht oder direkt daraus folgt — <em>nicht</em>, ob sie eine gute Idee beschreibt. Dass der Text den Einsatz bei subtilen Fehlern <em>kritisiert</em>, ändert nichts daran, dass er ihn beschreibt.</p>"+
 "<p><b>Vergleiche bewusst mit Aussage 1</b> („Ein Vorteil von Tests ist …“). Beide handeln von subtilen Fehlern, aber nur eine bewertet. Die bewertende ist falsch, die rein beschreibende ist richtig. Genau an dieser Grenze entscheidet sich dieser Aufgabentyp.</p>");

// Ableitungen im Klausurformat: gegeben f, gesucht f' — Quotienten- und Kettenregel
q("abl-01","ableitung",1,"Wie lautet die Ableitung von <code>f(x) = ln(2x)</code>?",
 ["f′(x) = 1/x","f′(x) = 2/x","f′(x) = 1/(2x)","f′(x) = 2·ln(x)","f′(x) = ln(2)/x"],0,
 "<p><b>Die wichtigste Einzelheit der ganzen Originalklausur.</b> Kettenregel: äußere Ableitung mal innere Ableitung.</p>"+
 "<ol><li>Äußere Funktion <code>ln(…)</code>, abgeleitet <code>1/(…)</code> — hier also <code>1/(2x)</code>.</li>"+
 "<li>Innere Funktion <code>2x</code>, abgeleitet <code>2</code>.</li>"+
 "<li>Multiplizieren: <code>(1/(2x)) · 2 = 1/x</code>.</li></ol>"+
 "<p><b>Merke ein für alle Mal:</b> Ein konstanter Faktor im Logarithmus verschwindet beim Ableiten. <code>ln(2x)′ = ln(5x)′ = ln(x)′ = 1/x</code>. Grund: <code>ln(kx) = ln k + ln x</code>, und die Konstante <code>ln k</code> fällt weg.</p>");

q("abl-02","ableitung",2,"Wie lautet die Ableitung von <code>f(x) = √(x² + 1)</code>?",
 ["f′(x) = x / √(x² + 1)","f′(x) = 2x / √(x² + 1)","f′(x) = 1 / (2√(x² + 1))","f′(x) = √(2x)","f′(x) = x² / √(x² + 1)"],0,
 "<ol><li>Als Potenz schreiben: <code>f = (x² + 1)^½</code>.</li>"+
 "<li>Äußere Ableitung: <code>½ · (x² + 1)^(−½) = 1/(2√(x² + 1))</code>.</li>"+
 "<li>Innere Ableitung von <code>x² + 1</code>: <code>2x</code>.</li>"+
 "<li>Multiplizieren: <code>2x / (2√(x² + 1)) = x / √(x² + 1)</code> — die 2 kürzt sich.</li></ol>"+
 "<p><b>Faustformel zum Auswendiglernen:</b> <code>√(u)′ = u′ / (2√u)</code>. Bei <code>u = x² ± c</code> kürzt sich die 2 immer weg, es bleibt schlicht <code>x/√(x² ± c)</code>. Genau dieser Baustein kam in der Originalklausur vor.</p>");

q("abl-03","ableitung",2,"Wie lautet die Ableitung von <code>f(x) = ln(3x) / x</code>?",
 ["f′(x) = (1 − ln(3x)) / x²","f′(x) = (ln(3x) − 1) / x²","f′(x) = 3/x²","f′(x) = 1/x²","f′(x) = (1 − 3·ln(3x)) / x²"],0,
 "<p>Quotientenregel <code>f′ = (u′v − uv′)/v²</code> mit <code>u = ln(3x)</code>, <code>v = x</code>.</p>"+
 "<ol><li><code>u′ = 1/x</code> (die 3 verschwindet, siehe Regel zu ln).</li>"+
 "<li><code>v′ = 1</code>.</li>"+
 "<li>Zähler: <code>(1/x)·x − ln(3x)·1 = 1 − ln(3x)</code>.</li>"+
 "<li>Nenner: <code>x²</code>.</li></ol>"+
 "<p><b>Die klassische Verwechslung</b> ist die Reihenfolge im Zähler: erst <code>u′v</code>, dann <b>minus</b> <code>uv′</code>. Wer das dreht, landet bei <code>(ln(3x) − 1)/x²</code> — derselbe Bruch mit umgekehrtem Vorzeichen. Eselsbrücke: „<b>N</b>enner mal Ableitung <b>Z</b>ähler minus <b>Z</b>ähler mal Ableitung <b>N</b>enner“ — also NAZ minus ZAN.</p>");

q("abl-04","ableitung",2,"Wie lautet die Ableitung von <code>f(x) = x / ln(x)</code>?",
 ["f′(x) = (ln(x) − 1) / ln(x)²","f′(x) = (1 − ln(x)) / ln(x)²","f′(x) = 1 / ln(x)²","f′(x) = ln(x)/x","f′(x) = (ln(x) − x) / ln(x)²"],0,
 "<p>Quotientenregel mit <code>u = x</code> (also <code>u′ = 1</code>) und <code>v = ln(x)</code> (also <code>v′ = 1/x</code>).</p>"+
 "<ol><li>Zähler: <code>1 · ln(x) − x · (1/x) = ln(x) − 1</code>. Beachte, wie sich das <code>x</code> gegen <code>1/x</code> wegkürzt — dieser Effekt tritt fast immer auf, wenn ein <code>x</code> auf ein <code>ln</code> trifft.</li>"+
 "<li>Nenner: <code>ln(x)²</code>.</li></ol>"+
 "<p>Vergleiche mit der vorigen Aufgabe: Dort stand ln oben, hier unten — und prompt dreht sich das Vorzeichen im Zähler um. Wenn du beide sicher kannst, sitzt die Quotientenregel.</p>");

q("abl-05","ableitung",3,"Wie lautet die Ableitung von <code>f(x) = √(x² − 5) · ln(2x)</code>?",
 ["f′(x) = (x·ln(2x)) / √(x² − 5) + √(x² − 5)/x",
  "f′(x) = (x·ln(2x)) / √(x² − 5) − √(x² − 5)/x",
  "f′(x) = 2x · ln(2x) + √(x² − 5)/(2x)",
  "f′(x) = x / (√(x² − 5) · x)",
  "f′(x) = (x + ln(2x)) / √(x² − 5)"],0,
 "<p>Dieselben zwei Bausteine wie in der Originalklausur, aber als <b>Produkt</b> statt als Quotient. Produktregel: <code>(u·v)′ = u′v + uv′</code> — hier steht ein <b>Plus</b>.</p>"+
 "<ol><li><code>u = √(x² − 5)</code>, also <code>u′ = x/√(x² − 5)</code>.</li>"+
 "<li><code>v = ln(2x)</code>, also <code>v′ = 1/x</code>.</li>"+
 "<li><code>f′ = (x/√(x² − 5))·ln(2x) + √(x² − 5)·(1/x)</code>.</li></ol>"+
 "<p><b>Warum diese Aufgabe wichtig ist:</b> In der Klausur entscheidet sich alles daran, ob du die beiden Bausteine <code>u′</code> und <code>v′</code> sicher hast. Ob sie dann durch Produkt- oder Quotientenregel verbunden werden, ist nur noch Buchhaltung. Übe die Bausteine, nicht die Gesamtformel.</p>");

q("abl-06","ableitung",2,"Wie lautet die Ableitung von <code>f(x) = x² · ln(x)</code>?",
 ["f′(x) = x · (2·ln(x) + 1)","f′(x) = 2x / x","f′(x) = 2x · ln(x)","f′(x) = 2x + 1/x","f′(x) = x²/x + 2x"],0,
 "<p>Produktregel mit <code>u = x²</code> (<code>u′ = 2x</code>) und <code>v = ln(x)</code> (<code>v′ = 1/x</code>).</p>"+
 "<ol><li><code>f′ = 2x·ln(x) + x²·(1/x)</code>.</li>"+
 "<li>Der zweite Term vereinfacht sich: <code>x²/x = x</code>.</li>"+
 "<li>Also <code>f′ = 2x·ln(x) + x</code>, ausgeklammert <code>x·(2·ln(x) + 1)</code>.</li></ol>"+
 "<p><b>Zum Antwortenvergleich im Test:</b> <code>2x·ln(x) + x</code> und <code>x·(2·ln(x) + 1)</code> sind dasselbe. Wenn deine Rechnung nicht wörtlich unter den Optionen steht, klammere aus oder multipliziere aus, bevor du an einen Fehler glaubst.</p>");

q("abl-07","ableitung",2,"Wie lautet die Ableitung von <code>f(x) = e^(x²)</code>?",
 ["f′(x) = 2x · e^(x²)","f′(x) = e^(x²)","f′(x) = x² · e^(x²−1)","f′(x) = 2x · e^(2x)","f′(x) = e^(2x)"],0,
 "<ol><li>Die e-Funktion bleibt beim Ableiten unverändert stehen: <code>e^(x²)</code>.</li>"+
 "<li>Kettenregel: mal innere Ableitung, und die innere Funktion ist <code>x²</code> mit Ableitung <code>2x</code>.</li></ol>"+
 "<p><b>Typischer Fehler:</b> die Potenzregel auf den Exponenten anwenden und <code>x²·e^(x²−1)</code> hinschreiben. Die Potenzregel gilt, wenn <code>x</code> in der <em>Basis</em> steht (<code>x²</code>), nicht wenn es im <em>Exponenten</em> steht (<code>e^(x²)</code>). Faustformel: <code>e^u′ = u′ · e^u</code>.</p>");

q("abl-08","ableitung",2,"Wie lautet die Ableitung von <code>f(x) = ln(x² + 1)</code>?",
 ["f′(x) = 2x / (x² + 1)","f′(x) = 1 / (x² + 1)","f′(x) = 2x","f′(x) = 1/(2x)","f′(x) = (x² + 1)/(2x)"],0,
 "<ol><li>Äußere Ableitung von <code>ln(u)</code> ist <code>1/u</code>, also <code>1/(x² + 1)</code>.</li>"+
 "<li>Innere Ableitung von <code>x² + 1</code> ist <code>2x</code>.</li>"+
 "<li>Multiplizieren: <code>2x/(x² + 1)</code>.</li></ol>"+
 "<p><b>Allgemeine Form, die du im Kopf haben solltest:</b> <code>ln(u)′ = u′/u</code>. Damit sind alle Logarithmus-Ableitungen ein Einzeiler: die Ableitung des Inneren über das Innere. Anders als bei <code>ln(2x)</code> bleibt hier etwas stehen, weil <code>x² + 1</code> kein konstantes Vielfaches von x ist.</p>");

q("abl-09","ableitung",2,"Wie lautet die Ableitung von <code>f(x) = e^x / x</code>?",
 ["f′(x) = e^x · (x − 1) / x²","f′(x) = e^x / 1","f′(x) = e^x · (1 − x) / x²","f′(x) = e^x/x²","f′(x) = e^x · x²"],0,
 "<p>Quotientenregel mit <code>u = e^x</code> (<code>u′ = e^x</code>) und <code>v = x</code> (<code>v′ = 1</code>).</p>"+
 "<ol><li>Zähler: <code>e^x · x − e^x · 1 = e^x(x − 1)</code>.</li>"+
 "<li>Nenner: <code>x²</code>.</li></ol>"+
 "<p>Ausklammern von <code>e^x</code> ist hier fast Pflicht — die Antwortoptionen stehen in der Klausur praktisch immer in der ausgeklammerten Form. Die Variante <code>e^x·(1 − x)/x²</code> hat das Vorzeichen im Zähler gedreht (ZAN minus NAZ statt NAZ minus ZAN).</p>");

q("abl-10","ableitung",3,"Wie lautet die Ableitung von <code>f(x) = √x · ln(x)</code>?",
 ["f′(x) = (ln(x) + 2) / (2√x)","f′(x) = ln(x) / (2√x)","f′(x) = (ln(x) − 2) / (2√x)","f′(x) = 1/(2√x) · 1/x","f′(x) = √x / x"],0,
 "<p>Produktregel mit <code>u = √x</code> (<code>u′ = 1/(2√x)</code>) und <code>v = ln(x)</code> (<code>v′ = 1/x</code>).</p>"+
 "<ol><li><code>f′ = ln(x)/(2√x) + √x/x</code>.</li>"+
 "<li>Zweiten Term vereinfachen: <code>√x/x = 1/√x</code>, denn <code>x = √x·√x</code>.</li>"+
 "<li>Auf gemeinsamen Nenner <code>2√x</code> bringen: <code>1/√x = 2/(2√x)</code>.</li>"+
 "<li>Zusammen: <code>(ln(x) + 2)/(2√x)</code>.</li></ol>"+
 "<p><b>Die Rechentechnik, die hier zählt:</b> <code>√x/x = 1/√x</code>. Wurzelterme lassen sich fast immer vereinfachen, indem man alles als Potenz schreibt: <code>x^½ / x¹ = x^(−½)</code>. In der Klausur brauchst du diesen Schritt, um deine Lösung überhaupt in einer der Antwortoptionen wiederzufinden.</p>");

q("abl-11","ableitung",2,"Wie lautet die Ableitung von <code>f(x) = (x² + 1)³</code>?",
 ["f′(x) = 6x · (x² + 1)²","f′(x) = 3 · (x² + 1)²","f′(x) = 3 · (2x)²","f′(x) = 6x · (x² + 1)³","f′(x) = (2x)³"],0,
 "<ol><li>Äußere Ableitung: <code>3 · (x² + 1)²</code> — der Klammerinhalt bleibt unangetastet stehen.</li>"+
 "<li>Innere Ableitung: <code>2x</code>.</li>"+
 "<li>Multiplizieren: <code>3 · 2x · (x² + 1)² = 6x(x² + 1)²</code>.</li></ol>"+
 "<p><b>Der häufigste Fehler bei der Kettenregel</b> ist, die innere Ableitung schlicht zu vergessen und bei <code>3·(x² + 1)²</code> stehen zu bleiben. Gewöhne dir an, nach jedem Ableiten einer Klammer laut „mal innere Ableitung“ mitzudenken.</p>");

q("abl-12","ableitung",3,"Wie lautet die Ableitung von <code>f(x) = 1 / √(x² − 5)</code>?",
 ["f′(x) = −x / √(x² − 5)³","f′(x) = x / √(x² − 5)³","f′(x) = −1 / (2√(x² − 5))","f′(x) = 1/(2x)","f′(x) = −2x / √(x² − 5)"],0,
 "<ol><li>Als Potenz schreiben: <code>f = (x² − 5)^(−½)</code>. Das erspart die Quotientenregel vollständig.</li>"+
 "<li>Potenzregel: <code>−½ · (x² − 5)^(−³⁄₂)</code>.</li>"+
 "<li>Kettenregel: mal <code>2x</code>. Die 2 kürzt sich gegen das ½.</li>"+
 "<li>Ergebnis: <code>−x · (x² − 5)^(−³⁄₂) = −x/√(x² − 5)³</code>.</li></ol>"+
 "<p><b>Strategie:</b> Wenn im Zähler nur eine 1 steht, nie die Quotientenregel benutzen — als negative Potenz schreiben und ableiten. Das ist kürzer und deutlich weniger fehleranfällig. Das Minuszeichen kommt vom negativen Exponenten und wird gern vergessen.</p>");

q("abl-13","ableitung",3,"Wie lautet die Ableitung von <code>f(x) = ln(x) / x²</code>?",
 ["f′(x) = (1 − 2·ln(x)) / x³","f′(x) = (1 − ln(x)) / x³","f′(x) = (2·ln(x) − 1) / x³","f′(x) = 1 / (2x³)","f′(x) = (1 − 2·ln(x)) / x⁴"],0,
 "<p>Quotientenregel mit <code>u = ln(x)</code> (<code>u′ = 1/x</code>) und <code>v = x²</code> (<code>v′ = 2x</code>).</p>"+
 "<ol><li>Zähler: <code>(1/x)·x² − ln(x)·2x = x − 2x·ln(x)</code>.</li>"+
 "<li>Nenner: <code>(x²)² = x⁴</code>.</li>"+
 "<li>Kürzen: Zähler <code>x(1 − 2·ln(x))</code>, also <code>x(1 − 2·ln(x))/x⁴ = (1 − 2·ln(x))/x³</code>.</li></ol>"+
 "<p><b>Der Schritt, der Punkte kostet:</b> das Kürzen am Ende. Die Variante mit <code>x⁴</code> im Nenner und bereits gekürztem Zähler ist deshalb falsch. Nach der Quotientenregel immer prüfen, ob sich ein <code>x</code> ausklammern lässt.</p>");

q("abl-14","ableitung",2,"Wie lautet die Ableitung von <code>f(x) = x · e^(2x)</code>?",
 ["f′(x) = e^(2x) · (1 + 2x)","f′(x) = e^(2x)","f′(x) = 2x · e^(2x)","f′(x) = e^(2x) · (1 + x)","f′(x) = 2 · e^(2x)"],0,
 "<p>Produktregel mit <code>u = x</code> (<code>u′ = 1</code>) und <code>v = e^(2x)</code> (<code>v′ = 2e^(2x)</code>, Kettenregel).</p>"+
 "<ol><li><code>f′ = 1 · e^(2x) + x · 2e^(2x)</code>.</li>"+
 "<li><code>e^(2x)</code> ausklammern: <code>e^(2x)(1 + 2x)</code>.</li></ol>"+
 "<p>Die Variante <code>e^(2x)·(1 + x)</code> vergisst die innere Ableitung 2 bei <code>e^(2x)</code> — die häufigste Fehlerquelle, sobald die Exponentialfunktion einen Faktor im Exponenten trägt.</p>");

q("abl-15","ableitung",3,"Wie lautet die Ableitung von <code>f(x) = sin(2x) / x</code>?",
 ["f′(x) = (2x·cos(2x) − sin(2x)) / x²","f′(x) = (cos(2x) − sin(2x)) / x²","f′(x) = 2·cos(2x)/x","f′(x) = (x·cos(2x) − sin(2x)) / x²","f′(x) = −2·cos(2x)/x²"],0,
 "<p>Quotientenregel mit <code>u = sin(2x)</code> und <code>v = x</code>.</p>"+
 "<ol><li><code>u′ = cos(2x) · 2 = 2·cos(2x)</code> — Kettenregel, die innere Ableitung von <code>2x</code> ist 2.</li>"+
 "<li><code>v′ = 1</code>.</li>"+
 "<li>Zähler: <code>2·cos(2x)·x − sin(2x)·1</code>.</li>"+
 "<li>Nenner: <code>x²</code>.</li></ol>"+
 "<p>Die Variante mit <code>x·cos(2x)</code> im Zähler hat die innere Ableitung bei <code>sin(2x)</code> unterschlagen. Prüfe bei jeder trigonometrischen Funktion, ob im Argument mehr als ein nacktes <code>x</code> steht.</p>");

q("abl-16","ableitung",3,"Wie lautet die Ableitung von <code>f(x) = √(ln(x))</code>?",
 ["f′(x) = 1 / (2x·√(ln(x)))","f′(x) = 1 / (2√(ln(x)))","f′(x) = 1/(2x)","f′(x) = √(1/x)","f′(x) = ln(x) / (2√x)"],0,
 "<p>Zweifache Verschachtelung — genau die Bauart, die in der Klausur 8 Punkte wert ist.</p>"+
 "<ol><li>Äußere Funktion ist die Wurzel: <code>√(u)′ = 1/(2√u)</code>, also <code>1/(2√(ln(x)))</code>.</li>"+
 "<li>Innere Funktion ist <code>ln(x)</code> mit Ableitung <code>1/x</code>.</li>"+
 "<li>Multiplizieren: <code>1/(2√(ln(x))) · 1/x = 1/(2x·√(ln(x)))</code>.</li></ol>"+
 "<p><b>Vorgehen bei Verschachtelungen:</b> Von außen nach innen abarbeiten und die Faktoren einfach aneinanderhängen. Frage dich: „Was würde ich zuerst tun, wenn ich für ein konkretes x einen Wert ausrechnen wollte?“ Die <em>letzte</em> Rechenoperation ist die <em>äußere</em> Funktion — hier ziehst du zuletzt die Wurzel.</p>");

q("abl-17","ableitung",2,"Wie lautet die Ableitung von <code>f(x) = cos(x²)</code>?",
 ["f′(x) = −2x · sin(x²)","f′(x) = −sin(x²)","f′(x) = 2x · sin(x²)","f′(x) = −sin(2x)","f′(x) = −2x · cos(x²)"],0,
 "<ol><li>Äußere Ableitung: <code>cos(u)′ = −sin(u)</code>, also <code>−sin(x²)</code>. Das Minus gehört zum Cosinus.</li>"+
 "<li>Innere Ableitung von <code>x²</code>: <code>2x</code>.</li>"+
 "<li>Zusammen: <code>−2x·sin(x²)</code>.</li></ol>"+
 "<p><b>Die vier Werte, die sitzen müssen:</b> <code>sin′ = cos</code>, <code>cos′ = −sin</code>, <code>(−sin)′ = −cos</code>, <code>(−cos)′ = sin</code>. Das Minus taucht nur beim Ableiten des Cosinus auf — wer das verwechselt, verliert die ganze Aufgabe.</p>");

q("abl-18","ableitung",3,"Wie lautet die Ableitung von <code>f(x) = x² / √(x + 1)</code>?",
 ["f′(x) = x·(3x + 4) / (2·√(x + 1)³)","f′(x) = 2x / √(x + 1)","f′(x) = (2x·√(x+1) − x²) / (x + 1)","f′(x) = x² / (2√(x + 1))","f′(x) = (3x + 4) / (2√(x + 1))"],0,
 "<p>Quotientenregel mit <code>u = x²</code> (<code>u′ = 2x</code>) und <code>v = √(x + 1)</code> (<code>v′ = 1/(2√(x+1))</code>).</p>"+
 "<ol><li>Zähler: <code>2x·√(x+1) − x²/(2√(x+1))</code>.</li>"+
 "<li>Nenner: <code>(√(x+1))² = x + 1</code>.</li>"+
 "<li>Doppelbruch auflösen: Zähler und Nenner mit <code>2√(x+1)</code> erweitern. Zähler wird <code>4x(x+1) − x² = 4x² + 4x − x² = 3x² + 4x</code>, Nenner wird <code>2(x+1)·√(x+1) = 2√(x+1)³</code>.</li>"+
 "<li><code>x</code> ausklammern: <code>x(3x + 4) / (2√(x+1)³)</code>.</li></ol>"+
 "<p><b>Das ist die härteste Bauart überhaupt:</b> eine Wurzel im Nenner erzeugt einen Doppelbruch. Standardgriff: mit dem Wurzelterm erweitern, damit die Wurzel aus dem Zwischen-Nenner verschwindet. Genau dieser Schritt war auch in der Originalklausur nötig, um von der rohen Quotientenregel auf die angebotene Antwortform zu kommen.</p>");

// Symmetrieverhalten von Funktionen — der 4-Punkte-Block der Klausur
q("sym-01","symmetrie",1,"Welches Symmetrieverhalten hat <code>f(x) = x³ − x</code>?",
 ["punktsymmetrisch zum Ursprung","achsensymmetrisch zur y-Achse","punktsymmetrisch zu (1, 0)","achsensymmetrisch zur x-Achse","keine Symmetrie"],0,
 "<p><b>Der Test, der immer funktioniert:</b> Setze <code>−x</code> ein und vergleiche mit <code>f(x)</code>.</p>"+
 "<ol><li><code>f(−x) = (−x)³ − (−x) = −x³ + x</code>.</li>"+
 "<li>Das ist genau <code>−(x³ − x) = −f(x)</code>.</li>"+
 "<li><code>f(−x) = −f(x)</code> heißt <b>ungerade</b> = punktsymmetrisch zum Ursprung.</li></ol>"+
 "<p><b>Schnellregel für Polynome:</b> Kommen <em>nur</em> ungerade Exponenten vor (x¹, x³, x⁵ …), ist die Funktion ungerade. Kommen <em>nur</em> gerade vor (x⁰, x², x⁴ …), ist sie gerade. Gemischt heißt: keine der beiden Symmetrien. Daher der Name.</p>");

q("sym-02","symmetrie",1,"Welches Symmetrieverhalten hat <code>f(x) = x⁴ − 3x² + 1</code>?",
 ["achsensymmetrisch zur y-Achse","punktsymmetrisch zum Ursprung","punktsymmetrisch zu (0, 1)","achsensymmetrisch zur x-Achse","keine Symmetrie"],0,
 "<ol><li><code>f(−x) = (−x)⁴ − 3(−x)² + 1 = x⁴ − 3x² + 1 = f(x)</code>. Gerade Exponenten schlucken das Minuszeichen.</li>"+
 "<li><code>f(−x) = f(x)</code> heißt <b>gerade</b> = achsensymmetrisch zur y-Achse.</li></ol>"+
 "<p>Die konstante 1 zählt als <code>1·x⁰</code>, also ebenfalls gerader Exponent — sie stört die Symmetrie nicht. Eine Konstante verschiebt den Graphen nur nach oben, und die y-Achse bleibt Spiegelachse.</p>");

q("sym-03","symmetrie",2,"Welches Symmetrieverhalten hat <code>f(x) = x² · sin(x)</code>?",
 ["punktsymmetrisch zum Ursprung","achsensymmetrisch zur y-Achse","keine Symmetrie","punktsymmetrisch zu (π, 0)","achsensymmetrisch zur Geraden x = π"],0,
 "<p><b>Statt einzusetzen: die Bausteine einordnen.</b> Das ist im Test deutlich schneller.</p>"+
 "<ol><li><code>x²</code> ist <b>gerade</b> (nur gerader Exponent).</li>"+
 "<li><code>sin(x)</code> ist <b>ungerade</b>: <code>sin(−x) = −sin(x)</code>.</li>"+
 "<li>Produktregel für Symmetrie: gerade · ungerade = <b>ungerade</b> → punktsymmetrisch zum Ursprung.</li></ol>"+
